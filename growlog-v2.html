<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>GrowLog</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2A45">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GrowLog">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F3EE; --surface: #FFFFFF; --surface2: #FAF8F4; --border: #E4DFD5; --border2: #D3CCBE;
  --navy: #1B2A45; --navy2: #121E33; --navy-light: #EDF0F5;
  --text: #1C1914; --text2: #6E6A62; --text3: #A69F92;
  --green: #3A6B4C; --green-light: #EEF4EF; --rust: #B5562C; --rust-light: #FBF0EA; --stitch: #B0402C;
  --radius: 14px; --radius-sm: 9px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Noto Sans JP', sans-serif; -webkit-font-smoothing: antialiased; padding-bottom: 40px; }
.mono { font-family: 'DM Mono', monospace; } .disp { font-family: 'Zen Kaku Gothic New', sans-serif; }
.head { background: var(--navy); color: #fff; padding: calc(12px + env(safe-area-inset-top)) 18px 13px; border-bottom: 3px solid var(--stitch); position: relative; }
.head-cal-btn { position: absolute; top: calc(env(safe-area-inset-top) + 6px); right: 14px; width: 64px; height: 64px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); font-size: 32px; cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center; }
.head-eyebrow { font-size: 10px; letter-spacing: 0.12em; color: #AEB9CC; font-weight: 500; margin-bottom: 2px; }
.head-title { font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: 18px; letter-spacing: 0.02em; }
.head-sub { font-size: 11px; color: #C7CEDB; margin-top: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding: 10px 26px 0; }
.invite-bar { display: flex; align-items: center; gap: 8px; background: var(--navy-light); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 12.5px; color: var(--text2); margin-top: 8px; }
.invite-code { font-family: 'DM Mono', monospace; font-weight: 700; font-size: 15px; letter-spacing: 0.08em; color: var(--navy); }
.invite-bar button { margin-left: auto; border: 1px solid var(--border2); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 11.5px; color: var(--text2); cursor: pointer; }
.ptabs { display: flex; gap: 7px; overflow-x: auto; padding: 8px 14px 0; scrollbar-width: none; }
.ptab-search { width: 100%; padding: 9px 13px; border: 1px solid var(--border2); border-radius: 20px; font-size: 13px; font-family: inherit; background: var(--surface); color: var(--text); margin-top: 8px; }
.ptab-search:focus { outline: none; border-color: var(--navy); }
.ptabs::-webkit-scrollbar { display: none; }
.ptab { flex-shrink: 0; padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border2); background: var(--surface); color: var(--text2); font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all .15s; }
.ptab.active { background: var(--navy); color: #fff; border-color: var(--navy); }
.cal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-top: 10px; }
.cal-compact { display: flex; align-items: center; justify-content: space-between; padding: 9px 14px; gap: 8px; }
.cal-compact-label { font-family: 'DM Mono', monospace; font-weight: 500; font-size: 14px; color: var(--text); }
.cal-compact-actions { display: flex; gap: 6px; }
.cal-today-btn { border: 1px solid var(--border2); background: var(--surface2); color: var(--navy); font-size: 12px; font-weight: 700; border-radius: 16px; padding: 6px 12px; cursor: pointer; }
.cal-toggle { border: 1px solid var(--border2); background: var(--surface2); color: var(--text2); font-size: 12px; border-radius: 16px; padding: 6px 12px; cursor: pointer; }
.cal-grid-wrap { border-top: 1px solid var(--border); }
.cal-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.cal-title { font-weight: 700; font-size: 14px; }
.cal-nav { display: flex; gap: 4px; }
.cal-nav button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border2); background: var(--surface2); color: var(--text); font-size: 14px; cursor: pointer; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); padding: 8px; gap: 2px; }
.cal-dow { text-align: center; font-size: 10.5px; color: var(--text3); font-weight: 500; padding-bottom: 3px; }
.cal-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; font-size: 12.5px; color: var(--text); cursor: pointer; position: relative; font-family: 'DM Mono', monospace; border: 1px solid transparent; }
.cal-cell.out { color: var(--text3); cursor: default; }
.cal-cell.today { border-color: var(--navy); }
.cal-cell.selected { background: var(--navy); color: #fff; }
.cal-cell .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--stitch); margin-top: 2px; }
.cal-cell .dot.dot-unread { width: 7px; height: 7px; box-shadow: 0 0 0 2px var(--rust-light); }
.cal-cell.selected .dot { background: #fff; }
.cal-cell:not(.out):hover { background: var(--navy-light); }
.cal-cell.selected:hover { background: var(--navy); }
.section-title { font-size: 12px; font-weight: 700; color: var(--text3); margin: 14px 2px 6px; letter-spacing: 0.04em; }
.section-title:first-child { margin-top: 0; }
.panel { margin-top: 10px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; }
.card-label { font-size: 11.5px; font-weight: 700; color: var(--text2); margin-bottom: 6px; display: flex; align-items: center; gap: 7px; }
.card.good { border-left: 4px solid var(--green); } .card.issue { border-left: 4px solid var(--rust); }
.card.good .card-label { color: var(--green); } .card.issue .card-label { color: var(--rust); }
textarea { width: 100%; border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 9px 11px; font-family: 'Noto Sans JP', sans-serif; font-size: 14px; color: var(--text); resize: none; min-height: 44px; background: var(--surface2); overflow-y: hidden; }
.goal-card { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: 14px; margin-top: 10px; }
.goal-label { font-size: 13px; font-weight: 700; color: var(--navy); margin-bottom: 8px; }
.goal-input { width: 100%; border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 9px 11px; font-size: 14px; font-weight: 700; color: var(--text); background: var(--surface2); margin-bottom: 10px; }
.goal-input:focus { outline: none; border-color: var(--navy); background: var(--surface); }
.goal-tasks-label { font-size: 11.5px; font-weight: 700; color: var(--text2); margin-bottom: 6px; }
.goal-tasks { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.goal-task-row { display: flex; align-items: center; gap: 6px; }
.goal-task-input { flex: 1; min-width: 0; border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; background: var(--surface2); }
.goal-task-input:focus { outline: none; border-color: var(--navy); background: var(--surface); }
.goal-task-del { flex-shrink: 0; border: none; background: none; color: var(--text3); font-size: 15px; cursor: pointer; padding: 2px 4px; }
.goal-add-btn { border: 1px solid var(--border2); background: var(--surface2); color: var(--text2); border-radius: 16px; padding: 7px 14px; font-size: 12.5px; cursor: pointer; }
textarea:focus { outline: none; border-color: var(--navy); background: var(--surface); }
.tri-group { margin-bottom: 14px; } .tri-group:last-child { margin-bottom: 0; }
.tri-group-label { font-size: 11.5px; font-weight: 700; color: var(--text2); margin-bottom: 6px; }
.tri-row { display: flex; gap: 8px; }
.tri-opt { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--surface2); cursor: pointer; }
.tri-opt-icon { font-size: 17px; line-height: 1; }
.tri-opt-text { font-size: 10px; color: var(--text2); font-weight: 500; }
.tri-opt.active { border-color: var(--navy); background: var(--navy-light); }
.tri-opt.active .tri-opt-text { color: var(--navy); font-weight: 700; }
.coach-comment { margin-top: 8px; }
.coach-comment-label { font-size: 10.5px; font-weight: 700; color: var(--text3); margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
.coach-comment textarea { background: var(--navy-light); border-color: var(--border2); min-height: 36px; font-size: 13px; }
.coach-comment textarea[readonly] { background: var(--surface2); color: var(--text2); cursor: default; }
.coach-comment textarea[readonly]::placeholder { color: var(--text3); }
.section-toggle { display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
.section-toggle-arrow { font-size: 10px; color: var(--text3); transition: transform .15s; }
.section-toggle.expanded .section-toggle-arrow { transform: rotate(90deg); }
.video-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.video-item { display: flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; }
.video-item a { flex: 1; font-size: 13px; color: var(--navy); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.video-item button { border: none; background: none; color: var(--text3); cursor: pointer; font-size: 15px; padding: 2px 4px; }
.video-add { display: flex; gap: 6px; flex-wrap: wrap; }
.video-add input { flex: 1 1 120px; min-width: 0; border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; background: var(--surface2); }
.video-add input:focus { outline: none; border-color: var(--navy); background: var(--surface); }
.video-add button { flex-shrink: 0; white-space: nowrap; border: 1px solid var(--border2); background: var(--surface2); border-radius: var(--radius-sm); padding: 0 14px; font-size: 13px; cursor: pointer; color: var(--text2); }
.video-limit { font-size: 12px; color: var(--text3); background: var(--surface2); border-radius: var(--radius-sm); padding: 9px 10px; text-align: center; }

/* ── video upload ── */
.video-drop { border: 2px dashed var(--border2); border-radius: var(--radius-sm); padding: 18px 12px; text-align: center; cursor: pointer; background: var(--surface2); margin-top: 8px; transition: border-color .15s, background .15s; }
.video-drop.drag { border-color: var(--navy); background: var(--navy-light); }
.video-drop .v-drop-icon { font-size: 20px; display: block; margin-bottom: 4px; }
.video-drop .v-drop-main { font-weight: 700; font-size: 12.5px; color: var(--text); }
.video-drop .v-drop-sub { font-size: 10.5px; color: var(--text3); margin-top: 2px; }
.video-drop input[type=file] { display: none; }
.video-filename { margin-top: 6px; font-size: 11.5px; color: var(--navy); word-break: break-all; }
.video-upload-btn { width: 100%; margin-top: 8px; padding: 10px; border: none; border-radius: var(--radius-sm); background: var(--navy); color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; }
.video-upload-btn:disabled { opacity: .4; cursor: not-allowed; }
.video-board { margin-top: 8px; display: none; }
.video-board.show { display: block; }
.video-track { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
.video-fill { height: 100%; width: 0%; background: var(--rust); transition: width .15s linear; }
.video-status { margin-top: 5px; font-size: 11px; color: var(--text2); text-align: center; }
.video-err { margin-top: 8px; display: none; background: var(--rust-light); border: 1px solid #E7C4B6; border-radius: var(--radius-sm); padding: 8px 10px; font-size: 11.5px; color: var(--stitch); line-height: 1.6; }
.video-err.show { display: block; }
.video-divider { text-align: center; font-size: 11px; color: var(--text3); margin: 10px 0; }
.save-status { font-size: 11px; font-weight: 500; color: var(--text3); margin-left: 6px; }
.thread-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.thread-title { font-size: 12px; font-weight: 700; color: var(--text2); margin-bottom: 12px; }
.thread { position: relative; min-height: 20px; }
.msg { margin-bottom: 14px; max-width: 88%; }
.msg.mine { margin-left: auto; }
.msg-meta { font-size: 11px; color: var(--text3); margin-bottom: 3px; }
.msg.mine .msg-meta { text-align: right; }
.msg-bubble { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 9px 12px; font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; }
.msg.mine .msg-bubble { background: var(--navy-light); border-color: #D8DEE9; }
.thread-empty { color: var(--text3); font-size: 13px; padding: 4px 0 10px; }
.thread-input { display: flex; gap: 8px; margin-top: 10px; }
.thread-input textarea { min-height: 40px; flex: 1; min-width: 0; }
.thread-input button { flex-shrink: 0; white-space: nowrap; align-self: flex-end; background: var(--stitch); color: #fff; border: none; border-radius: var(--radius-sm); padding: 10px 16px; font-size: 13px; font-weight: 700; cursor: pointer; }
.new-badge { display: inline-block; background: var(--stitch); color: #fff; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 8px; margin-left: 4px; vertical-align: middle; }
.thread-notice { background: var(--rust-light); color: var(--stitch); font-size: 12.5px; font-weight: 700; border-radius: var(--radius-sm); padding: 9px 11px; margin-bottom: 8px; }
.send-target { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border2); }
.send-target-label { font-size: 11px; font-weight: 700; color: var(--text3); margin-bottom: 6px; }
.send-target-opts { display: flex; gap: 6px; }
.send-target-opt { flex: 1; text-align: center; padding: 7px 4px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--surface2); font-size: 12px; font-weight: 700; color: var(--text2); cursor: pointer; }
.send-target-opt.active { border-color: var(--navy); background: var(--navy); color: #fff; }
.send-target-picker { margin-top: 8px; }
.send-target-search { width: 100%; padding: 7px 10px; border: 1px solid var(--border2); border-radius: var(--radius-sm); font-size: 12.5px; margin-bottom: 6px; background: var(--surface); font-family: inherit; }
.send-target-list { display: flex; flex-direction: column; gap: 2px; max-height: 160px; overflow-y: auto; }
.send-target-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; font-size: 13px; cursor: pointer; }
.send-target-item:hover { background: var(--surface2); }
.menu-send-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.menu-send-btn { flex-shrink: 0; border: none; background: var(--navy); color: #fff; border-radius: var(--radius-sm); padding: 9px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.menu-send-status { font-size: 11.5px; color: var(--green); }
.remind-banner { background: var(--navy-light); color: var(--navy); font-size: 12.5px; font-weight: 700; border-radius: var(--radius-sm); padding: 9px 11px; margin-bottom: 8px; }
.seen-row { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 10px; margin-top: 6px; }
.seen-check { width: 17px; height: 17px; border-radius: 5px; border: 2px solid var(--border2); background: var(--surface2); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: 11px; font-weight: 900; color: #fff; }
.seen-check.checked { background: var(--green); border-color: var(--green); }
.seen-label { font-size: 11px; color: var(--text2); font-weight: 700; }
.seen-other-notice { font-size: 10.5px; color: var(--navy); font-weight: 700; }
.practice-end-btn { width: 100%; margin-bottom: 8px; padding: 7px; border: 1px dashed var(--border2); border-radius: var(--radius-sm); background: var(--surface2); color: var(--text2); font-size: 11px; font-weight: 700; cursor: pointer; }
.practice-end-btn.sent { border-style: solid; border-color: var(--green); background: var(--green-light); color: var(--green); }
.empty-hint { text-align: center; color: var(--text3); font-size: 13px; padding: 30px 10px; }
/* ── auth screen ── */
.auth-wrap { min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; background: var(--bg); }
.auth-box { width: 100%; max-width: 400px; }
.auth-title { font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: 22px; color: var(--navy); margin-bottom: 14px; }
.auth-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
.auth-tab { flex: 1; text-align: center; padding: 10px; border-radius: 10px; border: 1px solid var(--border2); background: var(--surface); color: var(--text2); font-weight: 700; font-size: 13px; cursor: pointer; }
.auth-tab.active { background: var(--navy); color: #fff; border-color: var(--navy); }
.auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
.auth-card label { display: block; font-size: 12px; color: var(--text2); font-weight: 700; margin: 12px 0 4px; }
.auth-card label:first-child { margin-top: 0; }
.auth-card input { width: 100%; padding: 10px 12px; border: 1px solid var(--border2); border-radius: 10px; font-size: 14px; font-family: inherit; background: #fff; color: var(--text); }
.birthdate-row { display: flex; gap: 6px; }
.birthdate-row select { flex: 1; min-width: 0; padding: 10px 6px; border: 1px solid var(--border2); border-radius: 10px; font-size: 13.5px; font-family: inherit; background: #fff; color: var(--text); }
.role-row { display: flex; gap: 8px; margin-top: 4px; }
.role-opt { flex: 1; text-align: center; padding: 10px; border-radius: 10px; border: 1px solid var(--border2); cursor: pointer; font-size: 13px; font-weight: 700; color: var(--text2); }
.role-opt.active { border-color: var(--navy); background: var(--navy); color: #fff; }
.auth-btn { width: 100%; margin-top: 18px; padding: 12px; border: none; border-radius: 10px; background: var(--navy); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; }
.auth-forgot { text-align: center; margin-top: 12px; font-size: 12.5px; color: var(--text2); text-decoration: underline; cursor: pointer; }
.auth-msg { font-size: 12.5px; margin-top: 10px; padding: 8px 10px; border-radius: 8px; }
.auth-msg.err { background: var(--rust-light); color: var(--rust); }
.auth-msg.ok { background: var(--green-light); color: var(--green); }
.auth-hint { font-size: 11.5px; color: var(--text3); margin-top: 6px; line-height: 1.5; }
.switch-code { text-align: center; font-size: 11.5px; color: var(--text3); padding: 14px 0 6px; cursor: pointer; text-decoration: underline; }
.err-screen { display: flex; align-items: center; justify-content: center; min-height: 60vh; padding: 30px; text-align: center; color: var(--text2); font-size: 14px; }
/* ── paywall ── */
.pay-wrap { min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 50px 16px; background: var(--bg); }
.pay-box { width: 100%; max-width: 400px; text-align: center; }
.pay-title { font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: 20px; color: var(--navy); margin-bottom: 6px; }
.pay-sub { font-size: 13px; color: var(--text2); margin-bottom: 24px; }
.pay-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; text-align: left; }
.pay-role { font-size: 12px; font-weight: 700; color: var(--text2); margin-bottom: 6px; }
.pay-amount { font-family: 'DM Mono', monospace; font-size: 30px; color: var(--navy); font-weight: 500; margin-bottom: 14px; }
.plan-grid { display: flex; flex-direction: column; gap: 10px; margin: 18px 0; }
.plan-opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; cursor: pointer; text-align: left; }
.plan-opt.active { border-color: var(--navy); background: var(--navy-light); }
.plan-opt-label { font-size: 13px; font-weight: 700; color: var(--text); flex: 1; }
.plan-opt-amount { font-family: 'DM Mono', monospace; font-size: 17px; color: var(--navy); font-weight: 700; white-space: nowrap; }
.plan-opt-amount span { font-size: 10px; color: var(--text3); font-weight: 500; }
.plan-opt-per { font-size: 10.5px; color: var(--text3); white-space: nowrap; margin-left: 10px; }
.pay-amount span { font-size: 12px; color: var(--text3); margin-left: 4px; }
.pay-btn { width: 100%; padding: 13px; border: none; border-radius: 10px; background: var(--navy); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; }
.pay-btn:disabled { opacity: 0.5; cursor: default; }
.pay-msg { font-size: 12.5px; margin-top: 12px; padding: 8px 10px; border-radius: 8px; }
.pay-msg.err { background: var(--rust-light); color: var(--rust); }
.pay-logout { text-align: center; font-size: 11.5px; color: var(--text3); padding-top: 18px; cursor: pointer; text-decoration: underline; }

.modal-card { background: var(--surface); border-radius: 16px 16px 0 0; padding: 18px 18px 22px; width: 100%; max-width: 480px; max-height: 86vh; overflow-y: auto; }
@media (min-width: 640px) { .modal-card { border-radius: var(--radius); } }
.modal-title { font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: 16px; color: var(--navy); margin-bottom: 4px; }
.modal-sub { font-size: 12px; color: var(--text2); margin-bottom: 14px; }
.modal-field { margin-bottom: 12px; }
.modal-label { font-size: 11.5px; font-weight: 700; color: var(--text2); margin-bottom: 6px; }
.modal-select, .modal-textarea { width: 100%; border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 9px 11px; font-family: 'Noto Sans JP', sans-serif; font-size: 14px; color: var(--text); background: var(--surface2); }
.modal-textarea { min-height: 100px; resize: vertical; }
.modal-select:focus, .modal-textarea:focus { outline: none; border-color: var(--navy); background: var(--surface); }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.modal-btn { flex: 1; border: none; border-radius: var(--radius-sm); padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; }
.modal-btn-cancel { background: var(--surface2); color: var(--text2); border: 1px solid var(--border2); }
.modal-btn-send { background: var(--navy); color: #fff; }
.modal-btn-send:disabled { opacity: 0.55; }
.modal-status { font-size: 12.5px; color: var(--green); margin-top: 10px; text-align: center; }
.modal-status.error { color: var(--rust); }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, initializeAuth, inMemoryPersistence, createUserWithEmailAndPassword, signInWithEmailAndPassword,

} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, collection, query, where, getDocs, orderBy, addDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import {
  getFunctions, httpsCallable
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-functions.js";
import {
  initializeAppCheck, ReCaptchaEnterpriseProvider
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app-check.js";

const firebaseConfig = {
  apiKey: "AIzaSyDkhejPJk0Nu90dgbsbbhnUWgCHc0mTawM",
  authDomain: "yakyu-nikki.firebaseapp.com",
  projectId: "yakyu-nikki",
  storageBucket: "yakyu-nikki.firebasestorage.app",
  messagingSenderId: "522594099909",
  appId: "1:522594099909:web:17fcfb6f96580d6c1486ac"
};
const fbApp = initializeApp(firebaseConfig);
// Capacitorのネイティブアプリ内（capacitor://localhost）ではreCAPTCHAが動作しないため、
// App Checkは通常のWeb版（https://）でのみ初期化する。
const isNativeApp = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
if (!isNativeApp) {
  try {
    initializeAppCheck(fbApp, {
      provider: new ReCaptchaEnterpriseProvider('6Lfq2aAtAAAAAAHUaHQvytodWp76RbOp-1_Fvph9'),
      isTokenAutoRefreshEnabled: true
    });
  } catch (e) { console.warn('App Check init skipped:', e); }
}
const auth = isNativeApp
  ? initializeAuth(fbApp, { persistence: inMemoryPersistence })
  : getAuth(fbApp);
const db = getFirestore(fbApp);
const functions = getFunctions(fbApp, 'us-central1');
const PRICE_IDS = {
  student: 'price_1UAKbrBAZvKHyOEKfPuJriMp',
  coach: 'price_1UAKcYBAZvKHyOEKu6JQAQMx'
};
// ▼▼ Stripeで人数帯ごとのPrice(月額)を作成したら、下のIDをそれぞれ差し替える ▼▼
const COACH_PLANS = [
  { id: 'p5',  max: 5,     label: '〜5名',        amount: 2980,  priceId: 'price_1UE7XWBAZvKHyOEKfQs2MOvR' },
  { id: 'p10', max: 10,    label: '〜10名',       amount: 4980,  priceId: 'price_1UE7bEBAZvKHyOEKpPXmkE9C' },
  { id: 'p20', max: 20,    label: '〜20名',       amount: 8800,  priceId: 'price_1UE7bYBAZvKHyOEKOIEQKj8e' },
  { id: 'p30', max: 30,    label: '〜30名',       amount: 12000, priceId: 'price_1UE7c8BAZvKHyOEKHMVLj9ZL' },
  { id: 'p50', max: 50,    label: '〜50名',       amount: 18000, priceId: 'price_1UE7cRBAZvKHyOEKWQAt2bqd' },
  { id: 'p51', max: Infinity, label: '51名以上（上限なし）', amount: 25000, priceId: 'price_1UE7cqBAZvKHyOEKs9TfsRji' }
];
// ▲▲ ここまで ▲▲
function planLabelByPriceId(priceId) {
  const p = COACH_PLANS.find(p => p.priceId === priceId);
  return p ? p.label : '';
}
function generateTeamCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 紛らわしい文字(0/O, 1/I等)を除外
  let code = '';
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}
async function generateUniqueTeamCode() {
  for (let i = 0; i < 8; i++) {
    const code = generateTeamCode();
    const q = query(collection(db, 'users'), where('teamCode', '==', code), where('role', '==', 'coach'));
    const snaps = await getDocs(q);
    if (snaps.empty) return code;
  }
  return generateTeamCode() + Date.now().toString(36).slice(-2).toUpperCase();
}
const SITE_URL = location.href.split('?')[0];
// ▼▼ Google Apps Scriptのウェブアプリをデプロイしたら、そのURLに差し替える ▼▼
const CONTACT_ENDPOINT = 'https://script.google.com/macros/s/AKfycby4gOfFg08Fnsj4n7rHtFERqoUg0riW9vIjlr7yi-7zNWDjiT8dlL-oLf9a8Bt1uF9kuA/exec';
// ▲▲ ここまで ▲▲

function openContactModal(profile, state) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'contact-overlay';
  overlay.innerHTML = `
    <div class="modal-card">
      <div class="modal-title">お問い合わせ</div>
      <div class="modal-sub">不具合の報告や使い方の質問など、お気軽にどうぞ。</div>
      <div class="modal-field">
        <div class="modal-label">種類</div>
        <select class="modal-select" id="contact-category">
          <option value="不具合報告">不具合の報告</option>
          <option value="使い方の質問">使い方の質問</option>
          <option value="ご要望">ご要望</option>
          <option value="その他">その他</option>
        </select>
      </div>
      <div class="modal-field">
        <div class="modal-label">内容</div>
        <textarea class="modal-textarea" id="contact-message" placeholder="内容を書いてください"></textarea>
      </div>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" id="contact-cancel">キャンセル</button>
        <button class="modal-btn modal-btn-send" id="contact-send">送信する</button>
      </div>
      <div class="modal-status" id="contact-status" style="display:none;"></div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  document.getElementById('contact-cancel').onclick = () => overlay.remove();
  document.getElementById('contact-send').onclick = async () => {
    const category = document.getElementById('contact-category').value;
    const message = document.getElementById('contact-message').value.trim();
    const status = document.getElementById('contact-status');
    const sendBtn = document.getElementById('contact-send');
    if (!message) {
      status.textContent = '内容を入力してください';
      status.className = 'modal-status error';
      status.style.display = 'block';
      return;
    }
    sendBtn.disabled = true;
    sendBtn.textContent = '送信中…';
    try {
      await fetch(CONTACT_ENDPOINT, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          name: profile.displayName || '',
          email: profile.email || '',
          role: state.role === 'coach' ? 'コーチ' : '選手・生徒',
          sport: profile.sport || '',
          category,
          message
        })
      });
      status.textContent = '送信しました。ありがとうございます！';
      status.className = 'modal-status';
      status.style.display = 'block';
      document.getElementById('contact-message').value = '';
      setTimeout(() => overlay.remove(), 1600);
    } catch (err) {
      status.textContent = '送信に失敗しました。時間をおいて再度お試しください。';
      status.className = 'modal-status error';
      status.style.display = 'block';
      sendBtn.disabled = false;
      sendBtn.textContent = '送信する';
    }
  };
}

async function kvGet(key) {
  const snap = await getDoc(doc(db, 'kv', key));
  if (!snap.exists()) return null;
  return { value: snap.data().value };
}
async function kvSet(key, value) {
  await setDoc(doc(db, 'kv', key), { key, value, updatedAt: Date.now() });
  return true;
}
async function kvList(prefix) {
  const q = query(collection(db, 'kv'), where('key', '>=', prefix), where('key', '<', prefix + '\uf8ff'));
  const snaps = await getDocs(q);
  const keys = [];
  snaps.forEach(d => keys.push(d.id));
  return { keys };
}

const app = document.getElementById('app');

/* ────────── 認証画面 ────────── */
let authMode = 'login';
let authRole = 'student';

function renderAuth() {
  app.innerHTML = `
    <div class="auth-wrap"><div class="auth-box">
      <div class="auth-title">Grow<span style="color:var(--rust)">Log</span></div>
      <div class="auth-tabs">
        <div class="auth-tab ${authMode==='login'?'active':''}" data-tab="login">ログイン</div>
        <div class="auth-tab ${authMode==='signup'?'active':''}" data-tab="signup">新規登録</div>
      </div>
      <div class="auth-card">
        ${authMode === 'signup' ? `
          <label>お名前</label>
          <input id="a-name" type="text" placeholder="表示される名前">
          <label>役割</label>
          <div class="role-row">
            <div class="role-opt ${authRole==='student'?'active':''}" data-role="student">選手・生徒</div>
            <div class="role-opt ${authRole==='coach'?'active':''}" data-role="coach">コーチ</div>
          </div>
          <label>競技名</label>
          <input id="a-sport" type="text" placeholder="例）野球、サッカー、バスケットボール">
          ${authRole === 'coach' ? `
            <div class="auth-hint">登録すると、選手を招待するための「招待コード」が自動で発行されます。</div>
          ` : `
            <label>招待コード</label>
            <input id="a-team" type="text" autocapitalize="characters" autocomplete="off" placeholder="コーチから教えてもらったコード">
            <div class="auth-hint">担当コーチから教えてもらった招待コードを入力してください。</div>
          `}
          ${authRole === 'student' ? `
            <label>生年月日</label>
            <div class="birthdate-row">
              <select id="a-birth-y">${birthYearOptions()}</select>
              <select id="a-birth-m">${monthDayOptions(12, '月')}</select>
              <select id="a-birth-d">${monthDayOptions(31, '日')}</select>
            </div>
          ` : ``}
        ` : ``}
        <label>メールアドレス</label>
        <input id="a-email" type="email" autocomplete="username" placeholder="you@example.com">
        <label>パスワード</label>
        <div style="display:flex; gap:6px;">
          <input id="a-pass" type="password" autocomplete="${authMode==='signup'?'new-password':'current-password'}" placeholder="6文字以上" style="flex:1;">
          <button type="button" id="a-pass-toggle" style="flex-shrink:0; border:1px solid var(--border2); background:var(--surface2); border-radius:10px; padding:0 14px; font-size:12.5px; cursor:pointer; color:var(--text2);">表示</button>
        </div>
        <button id="a-submit" class="auth-btn">${authMode==='signup' ? '仮登録する' : 'ログイン'}</button>
        ${authMode === 'login' ? `<div class="auth-forgot" id="a-forgot">パスワードをお忘れですか？</div>` : ''}
        <div id="a-msg"></div>
      </div>
    </div></div>
  `;
  app.querySelectorAll('.auth-tab').forEach(t => t.onclick = () => { authMode = t.dataset.tab; renderAuth(); });
  app.querySelectorAll('.role-opt').forEach(r => r.onclick = () => { authRole = r.dataset.role; renderAuth(); });
  document.getElementById('a-submit').onclick = authMode === 'signup' ? handleSignup : handleLogin;
  const forgotLink = document.getElementById('a-forgot');
  if (forgotLink) forgotLink.onclick = handleForgotPassword;
  const toggleBtn = document.getElementById('a-pass-toggle');
  const passInput = document.getElementById('a-pass');
  toggleBtn.onclick = () => {
    const showing = passInput.type === 'text';
    passInput.type = showing ? 'password' : 'text';
    toggleBtn.textContent = showing ? '表示' : '隠す';
  };
}
function birthYearOptions() {
  const nowY = new Date().getFullYear();
  let html = '<option value="">年</option>';
  for (let y = nowY; y >= nowY - 100; y--) html += `<option value="${y}">${y}年</option>`;
  return html;
}
function monthDayOptions(max, label) {
  let html = `<option value="">${label}</option>`;
  for (let i = 1; i <= max; i++) html += `<option value="${i}">${i}${label}</option>`;
  return html;
}
function showAuthMsg(text, type) {
  const el = document.getElementById('a-msg');
  if (el) el.innerHTML = `<div class="auth-msg ${type}">${text}</div>`;
}
async function handleForgotPassword() {
  const email = document.getElementById('a-email').value.trim();
  if (!email) { showAuthMsg('パスワードを再設定するメールアドレスを入力してください', 'err'); return; }
  const forgotLink = document.getElementById('a-forgot');
  const original = forgotLink.textContent;
  forgotLink.textContent = '送信中…';
  try {
    await sendPasswordResetEmail(auth, email);
    showAuthMsg('パスワード再設定用のメールを送りました。届いたメールのリンクから再設定してください。', 'ok');
  } catch (e) {
    showAuthMsg(translateError(e), 'err');
  }
  forgotLink.textContent = original;
}
async function handleSignup() {
  const name = document.getElementById('a-name').value.trim();
  const sport = document.getElementById('a-sport').value.trim();
  const email = document.getElementById('a-email').value.trim();
  const password = document.getElementById('a-pass').value;
  let teamCode = '';

  if (authRole === 'student') {
    teamCode = document.getElementById('a-team').value.trim().toUpperCase();
    if (!name || !sport || !teamCode || !email || !password) { showAuthMsg('すべての項目を入力してください', 'err'); return; }
  } else {
    if (!name || !sport || !email || !password) { showAuthMsg('すべての項目を入力してください', 'err'); return; }
  }

  let birthdate = null;
  if (authRole === 'student') {
    const by = document.getElementById('a-birth-y').value;
    const bm = document.getElementById('a-birth-m').value;
    const bd = document.getElementById('a-birth-d').value;
    if (!by || !bm || !bd) { showAuthMsg('生年月日を入力してください', 'err'); return; }
    birthdate = `${by}-${String(bm).padStart(2, '0')}-${String(bd).padStart(2, '0')}`;
  }

  const submitBtn = document.getElementById('a-submit');
  submitBtn.disabled = true;
  let cred = null;
  try {
    // Firestoreへの問い合わせ（招待コードの検証・発行）はセキュリティルール上
    // 認証済みユーザーでないと permission-denied になるため、
    // 先にFirebase Authenticationのアカウント作成を済ませる。
    cred = await createUserWithEmailAndPassword(auth, email, password);

    if (authRole === 'student') {
      const coachQ = query(collection(db, 'users'), where('teamCode', '==', teamCode), where('role', '==', 'coach'));
      const coachSnaps = await getDocs(coachQ);
      if (coachSnaps.empty) {
        // 招待コードが無効だった場合、作成済みの認証アカウントをロールバック（削除）する
        await cred.user.delete();
        showAuthMsg('その招待コードに一致するコーチが見つかりませんでした。コードを確認してください。', 'err');
        submitBtn.disabled = false;
        return;
      }
    } else {
      teamCode = await generateUniqueTeamCode();
    }

    const profileData = { email, displayName: name, role: authRole, sport, teamCode, createdAt: Date.now() };
    if (authRole === 'student') {
      Object.assign(profileData, { birthdate });
    }
    await setDoc(doc(db, 'users', cred.user.uid), profileData);
    await sendEmailVerification(cred.user);
    if (authRole === 'coach') {
      showAuthMsg(`仮登録できました。あなたの招待コードは「${teamCode}」です。届いた確認メールのリンクを開いてから、ログインしてください。`, 'ok');
    } else {
      showAuthMsg('仮登録できました。届いた確認メールのリンクを開いてから、ログインしてください。', 'ok');
    }
  } catch (e) {
    // setDoc等の後半処理で失敗した場合も、認証アカウントだけ残ってしまわないようロールバックを試みる
    if (cred && cred.user) {
      try { await cred.user.delete(); } catch (_) { /* 削除に失敗しても元のエラーを優先して表示 */ }
    }
    showAuthMsg(translateError(e), 'err');
  }
  submitBtn.disabled = false;
}
async function handleLogin() {
  const email = document.getElementById('a-email').value.trim();
  const password = document.getElementById('a-pass').value;
  if (!email || !password) { showAuthMsg('メールアドレスとパスワードを入力してください', 'err'); return; }
  try {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    await reload(cred.user);
    if (!cred.user.emailVerified) {
      showAuthMsg('まだメール確認が済んでいません。届いたメールのリンクを開いてから、もう一度ログインしてください。', 'err');
      await signOut(auth);
      return;
    }
  } catch (e) { showAuthMsg(translateError(e), 'err'); }
}
function translateError(e) {
  const code = e.code || '';
  if (code.includes('email-already-in-use')) return 'このメールアドレスはすでに登録されています。ログインタブからお試しください。';
  if (code.includes('invalid-email')) return 'メールアドレスの形式が正しくありません。';
  if (code.includes('weak-password')) return 'パスワードは6文字以上にしてください。';
  if (code.includes('user-not-found') || code.includes('wrong-password') || code.includes('invalid-credential')) return 'メールアドレスまたはパスワードが正しくありません。';
  return 'エラーが発生しました：' + code;
}

/* ────────── 起動フロー ────────── */
onAuthStateChanged(auth, async (user) => {
  if (user && user.emailVerified) {
    try {
      const profSnap = await getDoc(doc(db, 'users', user.uid));
      if (!profSnap.exists()) {
        app.innerHTML = `<div class="err-screen">プロフィールが見つかりませんでした。サポートにご連絡ください。</div>`;
        return;
      }
      const profile = profSnap.data();
      if (profile.freeAccess === true) {
        boot(user, profile);
        return;
      }
      if (profile.role === 'coach') {
        const hasSub = await checkActiveSubscription(user.uid);
        if (hasSub) { boot(user, profile); } else { renderPaywall(user, profile); }
      } else {
        // 生徒本人は課金せず、担当コーチの契約状況で判定する
        const coachQ = query(collection(db, 'users'), where('teamCode', '==', profile.teamCode), where('role', '==', 'coach'));
        const coachSnaps = await getDocs(coachQ);
        if (coachSnaps.empty) {
          app.innerHTML = `<div class="err-screen">担当コーチが見つかりませんでした。招待コードをコーチに確認してください。</div>`;
          return;
        }
        const coachDoc = coachSnaps.docs[0];
        const coachActive = coachDoc.data().freeAccess === true || await checkActiveSubscription(coachDoc.id);
        if (coachActive) {
          boot(user, profile);
        } else {
          renderWaitingForCoach(profile);
        }
      }
    } catch (e) {
      app.innerHTML = `<div class="err-screen">読み込みに失敗しました：${e.message}</div>`;
    }
  } else {
    renderAuth();
  }
});

async function checkActiveSubscription(uid) {
  try {
    const q = query(
      collection(db, 'customers', uid, 'subscriptions'),
      where('status', 'in', ['trialing', 'active'])
    );
    const snaps = await getDocs(q);
    return !snaps.empty;
  } catch (e) {
    console.error('subscription check failed', e);
    return false;
  }
}

function renderWaitingForCoach(profile) {
  app.innerHTML = `
    <div class="pay-wrap"><div class="pay-box">
      <div class="pay-title">Grow<span style="color:var(--rust)">Log</span>をはじめる</div>
      <div class="pay-sub">${profile.displayName}さん、担当コーチがまだプランに加入していません。コーチが加入すると、そのまま使えるようになります。</div>
      <div class="pay-logout" id="pay-logout">ログアウト</div>
    </div></div>
  `;
  document.getElementById('pay-logout').onclick = () => signOut(auth);
}

function renderPaywall(user, profile) {
  const cards = COACH_PLANS.map(p => `
    <div class="plan-opt" data-price="${p.priceId}">
      <div class="plan-opt-label">${p.label}</div>
      <div class="plan-opt-amount">¥${p.amount.toLocaleString()}<span>/ 月</span></div>
      <div class="plan-opt-per">${p.max === Infinity ? '' : `生徒1人あたり 約¥${Math.round(p.amount / p.max)}`}</div>
    </div>
  `).join('');
  app.innerHTML = `
    <div class="pay-wrap"><div class="pay-box">
      <div class="pay-title">Grow<span style="color:var(--rust)">Log</span>をはじめる</div>
      <div class="pay-sub">${profile.displayName}さん、チームの人数に合わせてプランを選んでください</div>
      <div class="plan-grid">${cards}</div>
      <button class="pay-btn" id="pay-btn" disabled>プランを選んでください</button>
      <div id="pay-msg"></div>
      <div class="pay-logout" id="pay-logout">ログアウト</div>
    </div></div>
  `;
  let selectedPrice = null;
  document.querySelectorAll('.plan-opt').forEach(el => {
    el.onclick = () => {
      document.querySelectorAll('.plan-opt').forEach(o => o.classList.remove('active'));
      el.classList.add('active');
      selectedPrice = el.dataset.price;
      const btn = document.getElementById('pay-btn');
      btn.disabled = false;
      btn.textContent = '加入手続きに進む';
    };
  });
  document.getElementById('pay-logout').onclick = () => signOut(auth);
  document.getElementById('pay-btn').onclick = () => { if (selectedPrice) startCheckout(user.uid, selectedPrice); };
}

async function startCheckout(uid, priceId) {
  const btn = document.getElementById('pay-btn');
  const msg = document.getElementById('pay-msg');
  btn.disabled = true;
  btn.textContent = '処理中…';
  try {
    const sessionRef = await addDoc(collection(db, 'customers', uid, 'checkout_sessions'), {
      price: priceId,
      success_url: SITE_URL,
      cancel_url: SITE_URL
    });
    onSnapshot(sessionRef, (snap) => {
      const data = snap.data();
      if (!data) return;
      if (data.error) {
        msg.innerHTML = `<div class="pay-msg err">エラーが発生しました：${data.error.message}</div>`;
        btn.disabled = false;
        btn.textContent = '加入手続きに進む';
      }
      if (data.url) {
        window.location.assign(data.url);
      }
    });
  } catch (e) {
    msg.innerHTML = `<div class="pay-msg err">エラーが発生しました：${e.message}</div>`;
    btn.disabled = false;
    btn.textContent = '加入手続きに進む';
  }
}

async function openPortal() {
  try {
    const createPortalLink = httpsCallable(functions, 'ext-firestore-stripe-payments-createPortalLink');
    const { data } = await createPortalLink({ returnUrl: SITE_URL });
    window.location.assign(data.url);
  } catch (e) {
    alert('契約管理ページを開けませんでした：' + e.message);
  }
}

function pad(n) { return String(n).padStart(2, '0'); }
function dateKey(y, m, d) { return `${y}-${pad(m + 1)}-${pad(d)}`; }
function todayParts() { const t = new Date(); return { y: t.getFullYear(), m: t.getMonth(), d: t.getDate() }; }
function formatSelectedLabel(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dow = ['日', '月', '火', '水', '木', '金', '土'][new Date(y, m - 1, d).getDay()];
  return `${m}月${d}日（${dow}）`;
}

async function boot(user, profile) {
  const isCoach = profile.role === 'coach';
  let TEAM = [{ uid: user.uid, name: profile.displayName }];
  if (isCoach) {
    const q = query(collection(db, 'users'), where('teamCode', '==', profile.teamCode), where('role', '==', 'student'));
    const snaps = await getDocs(q);
    const members = [];
    snaps.forEach(d => members.push({ uid: d.id, name: d.data().displayName }));
    if (members.length) TEAM = members;
  }

  const today = todayParts();
  const state = {
    playerId: TEAM[0].uid,
    role: isCoach ? 'coach' : 'player',
    myName: profile.displayName,
    year: today.y, month: today.m,
    selected: dateKey(today.y, today.m, today.d),
    entry: null, calExpanded: false, gameExpanded: false, remindActive: false,
    videoTarget: { mode: 'self', uids: [] }, menuTarget: { mode: 'self', uids: [] },
  };

  render();

  async function render() {
    const player = TEAM.find(r => r.uid === state.playerId);
    app.innerHTML = `
      <div class="head">
        <button class="head-cal-btn" id="head-cal-btn" aria-label="カレンダーを開く">📅</button>
        <div class="head-eyebrow">GrowLog・${profile.sport}</div>
        <div class="head-title" id="head-title">${isCoach ? (player ? player.name + 'さん' : '') : player.name + 'さん'}</div>
        <div class="head-sub">${isCoach ? '選手を選んでカレンダーから記録を確認・記入できます' : '練習の記録をつけよう'}</div>
      </div>
      <div class="wrap">
        ${isCoach ? `<div class="invite-bar" id="invite-bar">招待コード：<span class="invite-code">${profile.teamCode}</span><button id="invite-copy">コピー</button></div>` : ''}
        ${isCoach ? `<input class="ptab-search" id="ptab-search" placeholder="選手を検索">` : ''}
        ${isCoach ? `<div class="ptabs" id="ptabs"></div>` : ''}
        <div class="goal-card" id="goal-card"><div class="goal-loading">読み込み中…</div></div>
        <div class="cal" id="cal"></div>
        <div class="seen-row" id="seen-row"></div>
        <div class="panel" id="panel"></div>
        <div class="switch-code" id="logout-link">ログアウト</div>
        <div class="portal-link" id="portal-link">プラン・支払い管理</div>
        <div class="contact-link" id="contact-link">お問い合わせ</div>
      </div>
    `;
    document.getElementById('logout-link').onclick = () => signOut(auth);
    document.getElementById('portal-link').onclick = () => openPortal();
    document.getElementById('contact-link').onclick = () => openContactModal(profile, state);
    document.getElementById('head-cal-btn').onclick = () => { state.calExpanded = !state.calExpanded; renderCalendar(); };
    const inviteCopyBtn = document.getElementById('invite-copy');
    if (inviteCopyBtn) {
      inviteCopyBtn.onclick = () => {
        navigator.clipboard.writeText(profile.teamCode).then(() => {
          inviteCopyBtn.textContent = 'コピーしました';
          setTimeout(() => { inviteCopyBtn.textContent = 'コピー'; }, 1500);
        }).catch(() => {});
      };
    }
    if (isCoach) renderTabs();
    const ptabSearch = document.getElementById('ptab-search');
    if (ptabSearch) {
      ptabSearch.oninput = () => {
        const q = ptabSearch.value.trim();
        document.querySelectorAll('#ptabs .ptab').forEach(btn => {
          btn.style.display = btn.textContent.includes(q) ? '' : 'none';
        });
      };
    }
    renderCalendar();
    await loadGoal();
    await loadEntry();
  }

  function renderTabs() {
    const wrap = document.getElementById('ptabs');
    wrap.innerHTML = TEAM.map(r => `<button class="ptab ${r.uid === state.playerId ? 'active' : ''}" data-id="${r.uid}">${r.name}</button>`).join('');
    wrap.querySelectorAll('.ptab').forEach(btn => {
      btn.onclick = async () => {
        state.playerId = btn.dataset.id;
        const titleEl = document.getElementById('head-title');
        if (titleEl) titleEl.textContent = TEAM.find(r => r.uid === state.playerId).name + 'さん';
        renderTabs(); renderCalendar();
        await loadGoal(); await loadEntry();
      };
    });
  }

  async function renderCalendar() {
    const cal = document.getElementById('cal');
    const y = state.year, m = state.month;
    const first = new Date(y, m, 1);
    const startDow = first.getDay();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const prevDays = new Date(y, m, 0).getDate();
    const dows = ['日', '月', '火', '水', '木', '金', '土'];
    let cells = '';
    for (let i = 0; i < startDow; i++) cells += `<div class="cal-cell out">${prevDays - startDow + i + 1}</div>`;
    const t = todayParts();
    for (let d = 1; d <= daysInMonth; d++) {
      const key = dateKey(y, m, d);
      const isToday = t.y === y && t.m === m && t.d === d;
      const isSel = key === state.selected;
      cells += `<div class="cal-cell ${isToday ? 'today' : ''} ${isSel ? 'selected' : ''}" data-date="${key}">
        <span>${d}</span><span class="dot" style="visibility:hidden" data-dot="${key}"></span>
      </div>`;
    }
    const totalCells = startDow + daysInMonth;
    const trailing = (7 - (totalCells % 7)) % 7;
    for (let i = 1; i <= trailing; i++) cells += `<div class="cal-cell out">${i}</div>`;
    cal.innerHTML = `
      <div class="cal-compact" id="cal-compact">
        <span class="cal-compact-label">${formatSelectedLabel(state.selected)}</span>
        <div class="cal-compact-actions">
          ${state.selected !== dateKey(t.y, t.m, t.d) ? `<button class="cal-today-btn" id="cal-today">今日</button>` : ''}
        </div>
      </div>
      <div class="cal-grid-wrap" id="cal-grid-wrap" ${state.calExpanded ? '' : 'style="display:none;"'}>
        <div class="cal-head"><div class="cal-nav"><button id="prevM">‹</button></div><div class="cal-title">${y}年 ${m + 1}月</div><div class="cal-nav"><button id="nextM">›</button></div></div>
        <div class="cal-grid">${dows.map(d => `<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
      </div>
    `;
    const todayBtn = document.getElementById('cal-today');
    if (todayBtn) todayBtn.onclick = async () => {
      const tp = todayParts();
      state.year = tp.y; state.month = tp.m; state.selected = dateKey(tp.y, tp.m, tp.d); state.calExpanded = false;
      await renderCalendar(); await loadEntry();
    };
    document.getElementById('prevM').onclick = async () => { state.month--; if (state.month < 0) { state.month = 11; state.year--; } await renderCalendar(); };
    document.getElementById('nextM').onclick = async () => { state.month++; if (state.month > 11) { state.month = 0; state.year++; } await renderCalendar(); };
    cal.querySelectorAll('.cal-cell[data-date]').forEach(c => {
      c.onclick = async () => {
        state.selected = c.dataset.date;
        const dt = state.selected.split('-');
        state.year = parseInt(dt[0]); state.month = parseInt(dt[1]) - 1;
        state.calExpanded = false;
        await renderCalendar(); await loadEntry();
      };
    });
    try {
      const prefix = `entry:${state.playerId}:${y}-${pad(m + 1)}`;
      const res = await kvList(prefix);
      const keys = (res && res.keys) || [];
      const dateStrs = [];
      keys.forEach(k => {
        const dateStr = k.split(':')[2];
        dateStrs.push(dateStr);
        const dotEl = cal.querySelector(`[data-dot="${dateStr}"]`);
        if (dotEl) dotEl.style.visibility = 'visible';
      });
      markUnreadDots(dateStrs);
    } catch (e) { /* no entries this month */ }
  }

  async function markUnreadDots(dateStrs) {
    await Promise.all(dateStrs.map(async (dateStr) => {
      try {
        const [entryRes, lastReadEpoch] = await Promise.all([
          kvGet(`entry:${state.playerId}:${dateStr}`),
          getLastRead(state.playerId, dateStr, state.role),
        ]);
        if (!entryRes || !entryRes.value) return;
        const data = JSON.parse(entryRes.value);
        if (!data.thread || !data.thread.length) return;
        const last = data.thread[data.thread.length - 1];
        if (last.author === state.role) return;
        if (last.tsRaw && last.tsRaw > lastReadEpoch) {
          const dotEl = document.querySelector(`[data-dot="${dateStr}"]`);
          if (dotEl) { dotEl.style.visibility = 'visible'; dotEl.classList.add('dot-unread'); }
        }
      } catch (e) { /* skip */ }
    }));
  }
  async function getLastRead(playerId, date, role) {
    try {
      const res = await kvGet(`lastread:${playerId}:${date}:${role}`);
      if (res && res.value) return parseInt(res.value, 10) || 0;
    } catch (e) {}
    return 0;
  }
  async function setLastRead(playerId, date, role) {
    try { await kvSet(`lastread:${playerId}:${date}:${role}`, String(Date.now())); } catch (e) {}
  }

  async function getGoal(playerId) {
    try {
      const res = await kvGet(`goal:${playerId}`);
      if (res && res.value) return JSON.parse(res.value);
    } catch (e) {}
    return { goal: '', tasks: ['', '', ''] };
  }
  async function loadGoal() {
    state.goal = await getGoal(state.playerId);
    if (!state.goal.tasks || state.goal.tasks.length < 3) {
      state.goal.tasks = (state.goal.tasks || []).concat(['', '', '']).slice(0, Math.max(3, (state.goal.tasks || []).length));
    }
    renderGoal();
  }
  function renderGoal() {
    const box = document.getElementById('goal-card');
    if (!box) return;
    box.innerHTML = `
      <div class="goal-label">🎯 目標</div>
      <input class="goal-input" id="goal-text" placeholder="目標を書こう" value="${escapeAttr(state.goal.goal)}">
      <div class="goal-tasks-label">そのためにやること</div>
      <div class="goal-tasks" id="goal-tasks">
        ${state.goal.tasks.map((t, i) => `
          <div class="goal-task-row">
            <input class="goal-task-input" data-i="${i}" placeholder="やること ${i + 1}" value="${escapeAttr(t)}">
            ${i >= 3 ? `<button class="goal-task-del" data-i="${i}">✕</button>` : ''}
          </div>
        `).join('')}
      </div>
      <button class="goal-add-btn" id="goal-add-task">＋ やることを追加</button>
      <span class="save-status" id="goal-save-status"></span>
    `;
    document.getElementById('goal-text').addEventListener('input', scheduleGoalSave);
    box.querySelectorAll('.goal-task-input').forEach(inp => inp.addEventListener('input', scheduleGoalSave));
    box.querySelectorAll('.goal-task-del').forEach(btn => {
      btn.onclick = () => { state.goal.tasks.splice(parseInt(btn.dataset.i), 1); renderGoal(); saveGoal(); };
    });
    document.getElementById('goal-add-task').onclick = () => { state.goal.tasks.push(''); renderGoal(); };
  }
  let goalSaveTimer = null;
  function scheduleGoalSave() {
    const status = document.getElementById('goal-save-status');
    if (status) status.textContent = '…';
    clearTimeout(goalSaveTimer);
    goalSaveTimer = setTimeout(saveGoal, 700);
  }
  async function saveGoal() {
    const goalText = document.getElementById('goal-text');
    if (goalText) state.goal.goal = goalText.value;
    document.querySelectorAll('.goal-task-input').forEach(inp => { state.goal.tasks[parseInt(inp.dataset.i)] = inp.value; });
    const status = document.getElementById('goal-save-status');
    if (status) status.textContent = '保存中…';
    try {
      await kvSet(`goal:${state.playerId}`, JSON.stringify(state.goal));
      if (status) status.textContent = '保存しました';
    } catch (e) { if (status) status.textContent = '保存に失敗しました'; }
  }

  async function loadEntry() {
    const panel = document.getElementById('panel');
    panel.innerHTML = `<div class="empty-hint">読み込み中…</div>`;
    const key = `entry:${state.playerId}:${state.selected}`;
    const otherRole = state.role === 'coach' ? 'player' : 'coach';
    const [entryRes, lastReadEpoch, remindRes, mySeenRes, otherSeenRes] = await Promise.all([
      kvGet(key).catch(() => null),
      getLastRead(state.playerId, state.selected, state.role),
      !isCoach ? kvGet(`remind:${state.playerId}:${state.selected}`).catch(() => null) : Promise.resolve(null),
      isCoach ? kvGet(`seen:${state.playerId}:${state.selected}:${state.role}`).catch(() => null) : Promise.resolve(null),
      kvGet(`seen:${state.playerId}:${state.selected}:${otherRole}`).catch(() => null),
    ]);
    let data = null;
    try { if (entryRes && entryRes.value) data = JSON.parse(entryRes.value); } catch (e) { data = null; }
    if (!data) data = emptyEntry();
    if (data.gameGood === undefined) data.gameGood = '';
    if (data.gameIssue === undefined) data.gameIssue = '';
    if (data.condition === undefined) data.condition = null;
    if (data.weather === undefined) data.weather = null;
    if (data.mind === undefined) data.mind = null;
    if (data.skill === undefined) data.skill = null;
    if (data.body === undefined) data.body = null;
    if (data.goodComment === undefined) data.goodComment = '';
    if (data.issueComment === undefined) data.issueComment = '';
    if (data.gameGoodComment === undefined) data.gameGoodComment = '';
    if (data.gameIssueComment === undefined) data.gameIssueComment = '';
    state.entry = data;
    state.lastReadEpoch = lastReadEpoch;
    state.videoTarget = { mode: 'self', uids: [] };
    state.menuTarget = { mode: 'self', uids: [] };
    state.remindActive = !isCoach && !!(remindRes && remindRes.value);
    state.mySeen = isCoach && !!(mySeenRes && mySeenRes.value);
    state.otherSeenNotice = '';
    if (otherSeenRes && otherSeenRes.value) {
      const ts = parseInt(otherSeenRes.value, 10);
      if (ts && ts > (lastReadEpoch || 0)) {
        const who = state.role === 'coach' ? (TEAM.find(r => r.uid === state.playerId)?.name || '選手') : 'コーチ';
        state.otherSeenNotice = `✓ ${who}が見たよと伝えました`;
      }
    }
    renderPanel();
    renderSeenRow();
    setLastRead(state.playerId, state.selected, state.role);
  }

  function renderSeenRow() {
    const row = document.getElementById('seen-row');
    if (!row) return;
    if (!isCoach) {
      if (!state.otherSeenNotice) { row.style.display = 'none'; row.innerHTML = ''; return; }
      row.style.display = '';
      row.innerHTML = `<div><div class="seen-other-notice">${state.otherSeenNotice}</div></div>`;
      return;
    }
    row.style.display = '';
    row.innerHTML = `
      <div class="seen-check ${state.mySeen ? 'checked' : ''}" id="seen-check">${state.mySeen ? '✓' : ''}</div>
      <div><div class="seen-label">この記録を見たよ</div>${state.otherSeenNotice ? `<div class="seen-other-notice">${state.otherSeenNotice}</div>` : ''}</div>
    `;
    document.getElementById('seen-check').onclick = async () => {
      state.mySeen = !state.mySeen;
      const box = document.getElementById('seen-check');
      box.classList.toggle('checked', state.mySeen);
      box.textContent = state.mySeen ? '✓' : '';
      try {
        await kvSet(`seen:${state.playerId}:${state.selected}:${state.role}`, state.mySeen ? String(Date.now()) : '');
      } catch (e) {}
    };
  }

  function emptyEntry() {
    return { menu: '', good: '', issue: '', gameGood: '', gameIssue: '', videos: [], thread: [], condition: null, weather: null, mind: null, skill: null, body: null, goodComment: '', issueComment: '', gameGoodComment: '', gameIssueComment: '' };
  }
  async function mergeIntoOtherEntry(uid, mutateFn) {
    const key = `entry:${uid}:${state.selected}`;
    let data = null;
    try {
      const res = await kvGet(key);
      if (res && res.value) data = JSON.parse(res.value);
    } catch (e) { data = null; }
    if (!data) data = emptyEntry();
    if (!data.videos) data.videos = [];
    mutateFn(data);
    await kvSet(key, JSON.stringify(data));
  }
  function resolveTargetUids(target) {
    if (target.mode === 'all') return TEAM.map(r => r.uid);
    if (target.mode === 'pick') return [state.playerId, ...target.uids];
    return [state.playerId];
  }
  async function distributeVideo(video) {
    state.entry.videos.push(video);
    await saveEntry();
    if (isCoach) {
      const others = resolveTargetUids(state.videoTarget).filter(uid => uid !== state.playerId);
      for (const uid of others) {
        await mergeIntoOtherEntry(uid, (data) => { data.videos.push({ ...video }); });
      }
    }
  }
  async function broadcastPracticeEnd() {
    const now = String(Date.now());
    for (const r of TEAM) {
      await kvSet(`remind:${r.uid}:${state.selected}`, now);
    }
  }

  const CONDITION_OPTS = [ { v: 3, icon: '😊', label: '絶好調' }, { v: 2, icon: '😐', label: '普通' }, { v: 1, icon: '😨', label: '不調' } ];
  const WEATHER_OPTS = [ { v: 1, icon: '☀️', label: '晴れ' }, { v: 2, icon: '☁️', label: '曇り' }, { v: 3, icon: '☂️', label: '雨' } ];
  function triSelectHtml(group, value, options) {
    return `<div class="tri-row">${options.map(o => `
      <div class="tri-opt ${value === o.v ? 'active' : ''}" data-group="${group}" data-value="${o.v}">
        <span class="tri-opt-icon">${o.icon}</span><span class="tri-opt-text">${o.label}</span>
      </div>`).join('')}</div>`;
  }
  function coachCommentHtml(id, value) {
    const isCoach = state.role === 'coach';
    return `<div class="coach-comment"><div class="coach-comment-label">💬 コーチコメント</div>
      <textarea id="${id}" placeholder="${isCoach ? 'コメントを書こう' : 'コーチからのコメントがここに表示されます'}" ${isCoach ? '' : 'readonly'}>${escapeHtml(value)}</textarea>
    </div>`;
  }
  function targetPickerHtml(prefix, target) {
    const others = TEAM.filter(r => r.uid !== state.playerId);
    return `<div class="send-target">
      <div class="send-target-label">送信先</div>
      <div class="send-target-opts">
        <button type="button" class="send-target-opt ${target.mode === 'self' ? 'active' : ''}" data-prefix="${prefix}" data-mode="self">この子だけ</button>
        <button type="button" class="send-target-opt ${target.mode === 'all' ? 'active' : ''}" data-prefix="${prefix}" data-mode="all">全員</button>
        <button type="button" class="send-target-opt ${target.mode === 'pick' ? 'active' : ''}" data-prefix="${prefix}" data-mode="pick">人を指定</button>
      </div>
      ${target.mode === 'pick' ? `
        <div class="send-target-picker">
          <input class="send-target-search" data-prefix="${prefix}" placeholder="選手を検索">
          <div class="send-target-list" data-prefix="${prefix}">
            ${others.map(r => `
              <label class="send-target-item"><input type="checkbox" data-prefix="${prefix}" data-uid="${r.uid}" ${target.uids.includes(r.uid) ? 'checked' : ''}> ${escapeHtml(r.name)}</label>
            `).join('') || '<div class="thread-empty">他の選手がいません</div>'}
          </div>
        </div>
      ` : ''}
    </div>`;
  }

  function renderPanel() {
    const panel = document.getElementById('panel');
    const e = state.entry;
    panel.innerHTML = `
      ${isCoach ? `<button class="practice-end-btn" id="practice-end-btn">📣 練習終了 → 選手全員に「書いてね」を送る</button>` : ''}
      ${!isCoach && state.remindActive ? `<div class="remind-banner">📣 コーチが「書いてね」と伝えています</div>` : ''}
      <div class="section-title">コンディション</div>
      <div class="card">
        <div class="tri-group"><div class="tri-group-label">体調</div>${triSelectHtml('condition', e.condition, CONDITION_OPTS)}</div>
        <div class="tri-group"><div class="tri-group-label">天気</div>${triSelectHtml('weather', e.weather, WEATHER_OPTS)}</div>
      </div>
      <div class="section-title">練習</div>
      <div class="card"><div class="card-label">練習メニュー <span class="save-status" id="save-status"></span></div>
        <textarea id="f-menu" placeholder="今日やった練習内容を書こう">${escapeHtml(e.menu)}</textarea>
        ${isCoach ? `<div class="menu-send-row"><button class="menu-send-btn" id="menu-send-btn">この内容を送信</button><span class="menu-send-status" id="menu-send-status"></span></div>${targetPickerHtml('menu', state.menuTarget)}` : ''}</div>
      <div class="card good"><div class="card-label">◎ 良かった点</div>
        <textarea id="f-good" placeholder="意識したことや、うまくいったこと">${escapeHtml(e.good)}</textarea>
        ${coachCommentHtml('f-good-comment', e.goodComment)}</div>
      <div class="card issue"><div class="card-label">△ 改善点</div>
        <textarea id="f-issue" placeholder="難しかったこと、次に直したいこと">${escapeHtml(e.issue)}</textarea>
        ${coachCommentHtml('f-issue-comment', e.issueComment)}</div>
      <div class="section-title section-toggle ${state.gameExpanded ? 'expanded' : ''}" id="game-toggle">
        <span>試合・実戦形式</span><span class="section-toggle-arrow">▶</span>
      </div>
      ${state.gameExpanded ? `
      <div class="card good"><div class="card-label">◎ 良かった点</div>
        <textarea id="f-game-good" placeholder="試合や実戦形式で良かったこと">${escapeHtml(e.gameGood)}</textarea>
        ${coachCommentHtml('f-game-good-comment', e.gameGoodComment)}</div>
      <div class="card issue"><div class="card-label">△ 改善点</div>
        <textarea id="f-game-issue" placeholder="試合や実戦形式での課題">${escapeHtml(e.gameIssue)}</textarea>
        ${coachCommentHtml('f-game-issue-comment', e.gameIssueComment)}</div>
      ` : ''}
      <div class="section-title">心技体評価</div>
      <div class="card">
        <div class="tri-group"><div class="tri-group-label">心</div>${triSelectHtml('mind', e.mind, CONDITION_OPTS)}</div>
        <div class="tri-group"><div class="tri-group-label">技</div>${triSelectHtml('skill', e.skill, CONDITION_OPTS)}</div>
        <div class="tri-group"><div class="tri-group-label">体</div>${triSelectHtml('body', e.body, CONDITION_OPTS)}</div>
      </div>
      <div class="card"><div class="card-label">おすすめ動画</div>
        <div class="video-list" id="video-list">
          ${e.videos.map((v, i) => `<div class="video-item"><a href="${escapeAttr(v.url)}" target="_blank" rel="noopener">${escapeHtml(v.title || v.url)}</a><button data-i="${i}" class="video-del">✕</button></div>`).join('') || '<div class="thread-empty">まだ動画はありません</div>'}
        </div>
        <div class="video-add"><input id="v-title" placeholder="タイトル（任意）"><input id="v-url" placeholder="URLを貼り付け"><button id="v-add">追加</button></div>
        <div class="video-divider">または</div>
        <div class="video-drop" id="v-drop">
          <span class="v-drop-icon">🎥</span>
          <div class="v-drop-main">タップして動画を選ぶ</div>
          <div class="v-drop-sub">またはドラッグ＆ドロップ（最大300MB）</div>
        </div>
        <input type="file" id="v-file" accept="video/*">
        <div class="video-filename" id="v-filename"></div>
        <button class="video-upload-btn" id="v-upload-btn" disabled>この動画を追加</button>
        <div class="video-board" id="v-board">
          <div class="video-track"><div class="video-fill" id="v-fill"></div></div>
          <div class="video-status" id="v-status">準備中…</div>
        </div>
        <div class="video-err" id="v-err"></div>
        ${isCoach ? targetPickerHtml('video', state.videoTarget) : ''}
      </div>
      <div class="thread-card">
        <div class="thread-title">やり取り</div>
        ${threadNoticeHtml(e)}
        <div class="thread" id="thread">${e.thread.length ? e.thread.map(m => threadMsgHtml(m)).join('') : '<div class="thread-empty">まだやり取りはありません</div>'}</div>
        <div class="thread-input"><textarea id="t-input" placeholder="わからないことがあったら書いてみよう"></textarea><button id="t-send">送信</button></div>
      </div>
    `;
    document.getElementById('v-add').onclick = async () => {
      const title = document.getElementById('v-title').value.trim();
      const url = document.getElementById('v-url').value.trim();
      if (!url) return;
      await distributeVideo({ title, url });
      renderPanel();
    };
    setupVideoUpload();
    document.getElementById('game-toggle').onclick = () => { state.gameExpanded = !state.gameExpanded; renderPanel(); };
    panel.querySelectorAll('.video-del').forEach(btn => { btn.onclick = () => { state.entry.videos.splice(parseInt(btn.dataset.i), 1); renderPanel(); scheduleAutoSave(); }; });
    panel.querySelectorAll('.tri-opt').forEach(opt => {
      opt.onclick = () => {
        state.entry[opt.dataset.group] = parseInt(opt.dataset.value, 10);
        renderPanel();
        scheduleAutoSave();
      };
    });
    const practiceEndBtn = document.getElementById('practice-end-btn');
    if (practiceEndBtn) {
      practiceEndBtn.onclick = async () => {
        practiceEndBtn.disabled = true;
        practiceEndBtn.textContent = '送信中…';
        try {
          await broadcastPracticeEnd();
          practiceEndBtn.textContent = '✓ 全員に送りました';
          practiceEndBtn.classList.add('sent');
        } catch (e) {
          practiceEndBtn.textContent = '送信に失敗しました。もう一度お試しください。';
          practiceEndBtn.disabled = false;
        }
      };
    }
    const menuSendBtn = document.getElementById('menu-send-btn');
    if (menuSendBtn) {
      menuSendBtn.onclick = async () => {
        const text = document.getElementById('f-menu').value;
        state.entry.menu = text;
        const status = document.getElementById('menu-send-status');
        menuSendBtn.disabled = true;
        if (status) status.textContent = '送信中…';
        try {
          await saveEntry();
          const others = resolveTargetUids(state.menuTarget).filter(uid => uid !== state.playerId);
          for (const uid of others) {
            await mergeIntoOtherEntry(uid, (data) => { data.menu = text; });
          }
          if (status) status.textContent = '送信しました';
        } catch (e) {
          if (status) status.textContent = '送信に失敗しました';
        }
        menuSendBtn.disabled = false;
        setTimeout(() => { if (status) status.textContent = ''; }, 2500);
      };
    }
    panel.querySelectorAll('.send-target-opt').forEach(btn => {
      btn.onclick = () => {
        const target = btn.dataset.prefix === 'video' ? state.videoTarget : state.menuTarget;
        target.mode = btn.dataset.mode;
        renderPanel();
      };
    });
    panel.querySelectorAll('.send-target-list input[type="checkbox"]').forEach(cb => {
      cb.onchange = () => {
        const target = cb.dataset.prefix === 'video' ? state.videoTarget : state.menuTarget;
        if (cb.checked) { if (!target.uids.includes(cb.dataset.uid)) target.uids.push(cb.dataset.uid); }
        else { target.uids = target.uids.filter(u => u !== cb.dataset.uid); }
      };
    });
    panel.querySelectorAll('.send-target-search').forEach(inp => {
      inp.oninput = () => {
        const list = panel.querySelector(`.send-target-list[data-prefix="${inp.dataset.prefix}"]`);
        if (!list) return;
        const q = inp.value.trim();
        list.querySelectorAll('.send-target-item').forEach(item => {
          item.style.display = item.textContent.includes(q) ? '' : 'none';
        });
      };
    });
    ['f-menu', 'f-good', 'f-good-comment', 'f-issue', 'f-issue-comment', 'f-game-good', 'f-game-good-comment', 'f-game-issue', 'f-game-issue-comment'].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      autosizeTextarea(el);
      if (el.readOnly) return;
      el.addEventListener('input', () => { autosizeTextarea(el); scheduleAutoSave(); });
    });
    document.getElementById('t-send').onclick = () => sendThread();
  }

  function autosizeTextarea(el) { el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; }
  let autoSaveTimer = null;
  function scheduleAutoSave() {
    const status = document.getElementById('save-status');
    if (status) status.textContent = '…';
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(() => { saveEntry(); }, 700);
  }
  function setupVideoUpload() {
    const drop = document.getElementById('v-drop');
    const fileInput = document.getElementById('v-file');
    const filenameEl = document.getElementById('v-filename');
    const uploadBtn = document.getElementById('v-upload-btn');
    const board = document.getElementById('v-board');
    const fill = document.getElementById('v-fill');
    const statusTxt = document.getElementById('v-status');
    const errorBox = document.getElementById('v-err');
    const titleInput = document.getElementById('v-title');
    if (!drop) return;
    let selectedFile = null;

    drop.addEventListener('click', () => fileInput.click());
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('drag'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
    drop.addEventListener('drop', (e) => {
      e.preventDefault();
      drop.classList.remove('drag');
      if (e.dataTransfer.files.length) selectFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => { if (fileInput.files.length) selectFile(fileInput.files[0]); });

    function showError(msg) { errorBox.textContent = msg; errorBox.classList.add('show'); }
    function hideError() { errorBox.classList.remove('show'); }

    function selectFile(file) {
      hideError();
      if (!file.type.startsWith('video/')) { showError('動画ファイルを選んでください。'); return; }
      if (file.size > 300 * 1024 * 1024) { showError('ファイルサイズが300MBを超えています。'); return; }
      selectedFile = file;
      filenameEl.textContent = `${file.name}（${(file.size / 1024 / 1024).toFixed(1)}MB）`;
      uploadBtn.disabled = false;
    }

    uploadBtn.addEventListener('click', () => { if (selectedFile) handleUpload(selectedFile); });

    async function handleUpload(file) {
      hideError();
      uploadBtn.disabled = true;
      board.classList.add('show');
      fill.style.width = '0%';
      statusTxt.textContent = 'アップロード準備中…';
      try {
        const url = await uploadToCloudinary(file, (pct) => {
          fill.style.width = pct + '%';
          statusTxt.textContent = `アップロード中… ${pct}%`;
        });
        statusTxt.textContent = '追加中…';
        await distributeVideo({ title: titleInput.value.trim(), url });
        statusTxt.textContent = '追加しました！';
        fill.style.width = '100%';
        selectedFile = null;
        setTimeout(() => { board.classList.remove('show'); renderPanel(); }, 900);
      } catch (err) {
        console.error(err);
        board.classList.remove('show');
        uploadBtn.disabled = false;
        showError('失敗しました。もう一度お試しください。（' + (err.message || err) + '）');
      }
    }

    function uploadToCloudinary(file, onProgress) {
      return new Promise((resolve, reject) => {
        const CLOUD_NAME = 'wv2tbbjw';
        const UPLOAD_PRESET = 'jjthlcy0';
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', UPLOAD_PRESET);
        const xhr = new XMLHttpRequest();
        xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, true);
        xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(Math.round((e.loaded / e.total) * 100)); };
        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              const data = JSON.parse(xhr.responseText);
              if (data.secure_url) resolve(data.secure_url);
              else reject(new Error(data.error?.message || '不明なエラー'));
            } catch (e) { reject(new Error('レスポンスの解析に失敗しました')); }
          } else {
            try {
              const data = JSON.parse(xhr.responseText);
              reject(new Error(data.error?.message || ('HTTP ' + xhr.status)));
            } catch (e) { reject(new Error('HTTP ' + xhr.status)); }
          }
        };
        xhr.onerror = () => reject(new Error('ネットワークエラー'));
        xhr.send(formData);
      });
    }
  }

  function threadNoticeHtml(e) {
    if (!e.thread || !e.thread.length) return '';
    const last = e.thread[e.thread.length - 1];
    if (last.author === state.role) return '';
    if (!last.tsRaw || last.tsRaw <= (state.lastReadEpoch || 0)) return '';
    const who = state.role === 'coach' ? (last.authorName || '選手') : 'コーチ';
    return `<div class="thread-notice">🔔 ${escapeHtml(who)}が新しくやりとりに記入しました</div>`;
  }
  function threadMsgHtml(m) {
    const mine = m.author === state.role;
    const label = m.authorName || (m.author === 'coach' ? 'コーチ' : '本人');
    const isNew = !mine && m.tsRaw && m.tsRaw > (state.lastReadEpoch || 0);
    return `<div class="msg ${mine ? 'mine' : ''}"><div class="msg-meta">${label} ・ ${m.ts} ${isNew ? '<span class="new-badge">NEW</span>' : ''}</div><div class="msg-bubble">${escapeHtml(m.text)}</div></div>`;
  }
  async function saveEntry() {
    state.entry.menu = document.getElementById('f-menu').value;
    state.entry.good = document.getElementById('f-good').value;
    state.entry.issue = document.getElementById('f-issue').value;
    const gameGoodEl = document.getElementById('f-game-good');
    const gameIssueEl = document.getElementById('f-game-issue');
    if (gameGoodEl) state.entry.gameGood = gameGoodEl.value;
    if (gameIssueEl) state.entry.gameIssue = gameIssueEl.value;
    if (state.role === 'coach') {
      state.entry.goodComment = document.getElementById('f-good-comment').value;
      state.entry.issueComment = document.getElementById('f-issue-comment').value;
      const gameGoodCommentEl = document.getElementById('f-game-good-comment');
      const gameIssueCommentEl = document.getElementById('f-game-issue-comment');
      if (gameGoodCommentEl) state.entry.gameGoodComment = gameGoodCommentEl.value;
      if (gameIssueCommentEl) state.entry.gameIssueComment = gameIssueCommentEl.value;
    }
    const key = `entry:${state.playerId}:${state.selected}`;
    const status = document.getElementById('save-status');
    if (status) status.textContent = '保存中…';
    try {
      await kvSet(key, JSON.stringify(state.entry));
      if (status) status.textContent = '保存しました';
      const dotEl = document.querySelector(`[data-dot="${state.selected}"]`);
      if (dotEl) dotEl.style.visibility = 'visible';
      if (!isCoach && state.remindActive) {
        state.remindActive = false;
        kvSet(`remind:${state.playerId}:${state.selected}`, '').catch(() => {});
        const banner = document.querySelector('.remind-banner');
        if (banner) banner.remove();
      }
    } catch (e) { if (status) status.textContent = '保存に失敗しました'; }
  }
  async function sendThread() {
    const input = document.getElementById('t-input');
    const text = input.value.trim();
    if (!text) return;
    const now = new Date();
    const ts = `${pad(now.getMonth() + 1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    state.entry.thread.push({ author: state.role, authorName: state.myName, text, ts, tsRaw: now.getTime() });
    input.value = '';
    await saveEntry();
    await setLastRead(state.playerId, state.selected, state.role);
    renderPanel();
  }
  function escapeHtml(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function escapeAttr(s) { return escapeHtml(s); }
}
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
