<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Self+</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2A45">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Self+">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=DM+Mono:wght@500&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=DM+Mono:wght@500&display=swap" rel="stylesheet"></noscript>
<style>
:root {
  --bg: #F5F3EE; --surface: #FFFFFF; --surface2: #FAF8F4; --border: #E4DFD5; --border2: #D3CCBE;
  --navy: #1B2A45; --navy2: #121E33; --navy-light: #EDF0F5;
  --text: #1C1914; --text2: #6E6A62; --text3: #A69F92;
  --green: #3A6B4C; --green-light: #EEF4EF; --rust: #B5562C; --rust-light: #FBF0EA; --stitch: #B0402C;
  --radius: 14px; --radius-sm: 9px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--navy); color: var(--text); font-family: 'Noto Sans JP', sans-serif; -webkit-font-smoothing: antialiased; padding-bottom: 40px; }

/* ---- 起動スプラッシュ（Self+ワードマーク→ヘッダーへ折りたたみ） ---- */
#introSplash { position: fixed; inset: 0; z-index: 9999; background: var(--navy); display: flex; align-items: center; justify-content: center; }
.intro-word { font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; color: #fff; font-size: 15vw; letter-spacing: 0;
  transform-origin: center center;
  opacity: 0;
  animation: introIn 0.5s ease forwards 0.05s;
}
@keyframes introIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }
.plus-mark { position: relative; display: inline-block; width: 0.62em; height: 0.62em; margin-left: 0.09em; vertical-align: -0.08em; }
.plus-mark::before, .plus-mark::after { content: ''; position: absolute; background: #FF7A2E; border-radius: 1px; }
.plus-mark::before { width: 100%; height: 26%; top: 50%; left: 0; transform: translateY(-50%); }
.plus-mark::after { height: 100%; width: 26%; left: 50%; top: 0; transform: translateX(-50%); }
.intro-word .plus-mark { width: 0.62em; height: 0.62em; margin-left: 0.09em; vertical-align: -0.02em; }
#introSplash.fading { animation: introFade 0.3s ease forwards; }
@keyframes introFade { to { opacity: 0; } }
.mono { font-family: 'DM Mono', monospace; } .disp { font-family: 'Zen Kaku Gothic New', sans-serif; }
.head { background: var(--navy); color: #fff; padding: calc(12px + env(safe-area-inset-top)) 18px 13px; border-bottom: 3px solid var(--stitch); position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.head-cal-btn { flex-shrink: 0; width: 64px; height: 64px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); font-size: 32px; cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center; }
.head-text { flex: 1; min-width: 0; }
.head-eyebrow { font-size: 10px; letter-spacing: 0.12em; color: #AEB9CC; font-weight: 500; margin-bottom: 2px; }
.head-title { font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: 18px; letter-spacing: 0.02em; }
.head-sub { font-size: 11px; color: #C7CEDB; margin-top: 2px; }
.head-date { font-size: 15px; font-weight: 700; color: #fff; margin-top: 4px; font-family: 'Zen Kaku Gothic New', sans-serif; letter-spacing: 0.02em; }
.wrap { max-width: 640px; margin: 0 auto; padding: 10px 26px 0; }
.invite-bar { display: flex; align-items: center; gap: 8px; background: var(--navy-light); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 12.5px; color: var(--text2); margin-top: 8px; }
.invite-code { font-family: 'DM Mono', monospace; font-weight: 700; font-size: 15px; letter-spacing: 0.08em; color: var(--navy); }
.invite-bar button { margin-left: auto; border: 1px solid var(--border2); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 11.5px; color: var(--text2); cursor: pointer; }
.ptabs { display: flex; gap: 7px; overflow-x: auto; padding: 8px 14px 0; scrollbar-width: none; }
.ptab-search { width: 100%; padding: 9px 13px; border: 1px solid var(--border2); border-radius: 20px; font-size: 13px; font-family: inherit; background: var(--surface); color: var(--text); margin-top: 8px; }
.ptab-search:focus { outline: none; border-color: var(--navy); }
.ptabs::-webkit-scrollbar { display: none; }
.ptab { flex-shrink: 0; padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border2); background: var(--surface); color: var(--text2); font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all .15s; }
.ptab.active { background: var(--navy); color: #fff; border-color: var(--navy); }
.cal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-top: 10px; }
.cal-compact { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; cursor: default; }
.cal-compact-label { font-family: 'DM Mono', monospace; font-weight: 500; font-size: 14px; color: var(--text); }
.cal-grid-wrap { border-top: 1px solid var(--border); }
.cal-today-btn { border: 1px solid var(--border2); background: var(--surface2); color: var(--navy); font-size: 12px; font-weight: 700; border-radius: 16px; padding: 6px 12px; cursor: pointer; }
.cal-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.cal-title { font-weight: 700; font-size: 14px; }
.cal-nav { display: flex; gap: 4px; }
.cal-nav-right { display: flex; align-items: center; gap: 8px; }
.cal-nav button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border2); background: var(--surface2); color: var(--text); font-size: 14px; cursor: pointer; }
.dream-card { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: 14px; margin-top: 12px; margin-bottom: 0; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); padding: 8px; gap: 2px; }
.cal-dow { text-align: center; font-size: 10.5px; color: var(--text3); font-weight: 500; padding-bottom: 3px; }
.cal-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; font-size: 12.5px; color: var(--text); cursor: pointer; position: relative; font-family: 'DM Mono', monospace; border: 1px solid transparent; }
.cal-star { position: absolute; top: 2px; right: 3px; color: var(--border2); font-size: 10px; line-height: 1; pointer-events: none; z-index: 2; }
.cal-star.active { color: var(--rust); }
.cal-cell { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.cal-hint { text-align: center; font-size: 10.5px; color: var(--text3); padding: 8px 10px 10px; }
.cal-loading { text-align: center; font-size: 11px; color: var(--text3); padding: 0 10px 6px; opacity: 0.85; }
.cal-star.active { color: var(--rust); }
.cal-cell.important { background: var(--rust-light); }
.cal-cell.out { color: var(--text3); cursor: default; }
.cal-cell.today { border-color: var(--navy); }
.cal-cell.selected { background: var(--navy); color: #fff; }
.cal-cell.selected .cal-star { color: rgba(255,255,255,0.5); }
.cal-cell.selected .cal-star.active { color: #FF9F66; }
.cal-cell.important.selected { background: var(--rust); }
.cal-cell .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--stitch); margin-top: 2px; }
.cal-cell .dot.dot-unread { width: 7px; height: 7px; box-shadow: 0 0 0 2px var(--rust-light); }
.cal-cell.selected .dot { background: #fff; }
.cal-cell .dot.dot-face { width: auto; height: auto; border-radius: 0; background: none; font-size: 11px; line-height: 1; margin-top: 1px; position: relative; }
.cal-cell .dot.dot-face.dot-unread::after { content: ''; position: absolute; top: -3px; right: -4px; width: 5px; height: 5px; border-radius: 50%; background: var(--rust); }
.cal-cell:not(.out):hover { background: var(--navy-light); }
.cal-cell.selected:hover { background: var(--navy); }
.section-title { font-size: 12px; font-weight: 700; color: var(--text3); margin: 14px 2px 6px; letter-spacing: 0.04em; }
.section-title:first-child { margin-top: 0; }
.panel { margin-top: 10px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; }
.card-label { font-size: 11.5px; font-weight: 700; color: var(--text2); margin-bottom: 6px; display: flex; align-items: center; gap: 7px; }
.card.good { border-left: 4px solid var(--green); } .card.issue { border-left: 4px solid var(--rust); }
.card.good .card-label { color: var(--green); } .card.issue .card-label { color: var(--rust); }
.removed-banner { background: var(--navy-light); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-top: 10px; margin-bottom: 4px; }
.removed-banner-title { font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 900; font-size: 14px; color: var(--navy); margin-bottom: 6px; }
.removed-banner-text { font-size: 12.5px; color: var(--text2); line-height: 1.6; margin-bottom: 10px; }
.removed-reactivate-btn { width: 100%; padding: 11px; border: none; border-radius: var(--radius-sm); background: var(--navy); color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; }
.removed-reactivate-btn:disabled { opacity: 0.45; cursor: default; }
.removed-refresh-row { text-align: center; margin-top: 10px; }
.removed-refresh-btn { border: none; background: none; color: var(--navy); font-size: 12px; font-weight: 700; text-decoration: underline; cursor: pointer; padding: 4px; }
.removed-refresh-hint { font-size: 11.5px; color: var(--text3); margin-top: 4px; }
.removed-join-row { display: flex; gap: 8px; }
.removed-join-row .modal-select { flex: 1; }
.removed-date-label { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--text2); margin: 12px 2px 6px; }
.removed-cond-row { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12.5px; color: var(--text2); }
.removed-readonly-text { font-size: 13.5px; color: var(--text); white-space: pre-wrap; line-height: 1.6; }
.removed-coach-comment { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border2); font-size: 12.5px; color: var(--navy); white-space: pre-wrap; }
textarea { width: 100%; border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 9px 11px; font-family: 'Noto Sans JP', sans-serif; font-size: 14px; color: var(--text); resize: none; min-height: 44px; background: var(--surface2); overflow-y: hidden; }
.goal-card { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: 14px; margin-top: 10px; }
.goal-label { font-size: 13px; font-weight: 700; color: var(--navy); margin-bottom: 8px; }
.goal-input { width: 100%; border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 9px 11px; font-size: 14px; font-weight: 700; color: var(--text); background: var(--surface2); margin-bottom: 10px; }
.goal-input:focus { outline: none; border-color: var(--navy); background: var(--surface); }
.goal-tasks-label { font-size: 11.5px; font-weight: 700; color: var(--text2); margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; }
.goal-progress { font-size: 11px; font-weight: 700; color: var(--green); }
.goal-tasks { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.goal-task-row { display: flex; align-items: center; gap: 6px; }
.goal-task-row.done .goal-task-input { color: var(--text3); text-decoration: line-through; }
.goal-task-check { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--border2); background: var(--surface2); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: 11px; font-weight: 900; color: #fff; }
.goal-task-row.done .goal-task-check { background: var(--green); border-color: var(--green); }
.goal-task-input { flex: 1; min-width: 0; border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; background: var(--surface2); }
.goal-task-input:focus { outline: none; border-color: var(--navy); background: var(--surface); }
.goal-task-star { flex-shrink: 0; border: none; background: none; font-size: 15px; cursor: pointer; padding: 2px 4px; color: var(--text3); }
.goal-task-star.active { color: #E0A429; }
.goal-task-del { flex-shrink: 0; border: none; background: none; color: var(--text3); font-size: 15px; cursor: pointer; padding: 2px 4px; }
.goal-expand-btn { display: block; border: none; background: none; color: var(--navy); font-size: 12px; font-weight: 700; cursor: pointer; padding: 4px 0 8px; }
.goal-add-btn { border: 1px solid var(--border2); background: var(--surface2); color: var(--text2); border-radius: 16px; padding: 7px 14px; font-size: 12.5px; cursor: pointer; }
textarea:focus { outline: none; border-color: var(--navy); background: var(--surface); }
.tri-group { margin-bottom: 14px; } .tri-group:last-child { margin-bottom: 0; }
.tri-group-label { font-size: 11.5px; font-weight: 700; color: var(--text2); margin-bottom: 6px; }
.tri-row { display: flex; gap: 8px; }
.tri-opt { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--surface2); cursor: pointer; }
.tri-opt-icon { font-size: 17px; line-height: 1; }
.tri-opt-text { font-size: 10px; color: var(--text2); font-weight: 500; }
.tri-opt.active { border-color: var(--navy); background: var(--navy-light); }
.tri-opt.active .tri-opt-text { color: var(--navy); font-weight: 700; }
.coach-comment { margin-top: 8px; }
.coach-comment-label { font-size: 10.5px; font-weight: 700; color: var(--text3); margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
.coach-comment textarea { background: var(--navy-light); border-color: var(--border2); min-height: 36px; font-size: 13px; }
.coach-comment textarea[readonly] { background: var(--surface2); color: var(--text2); cursor: default; }
.coach-comment textarea[readonly]::placeholder { color: var(--text3); }
.section-toggle { display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
.section-toggle-arrow { font-size: 10px; color: var(--text3); transition: transform .15s; }
.section-toggle.expanded .section-toggle-arrow { transform: rotate(90deg); }
.section-toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.section-toggle-row .section-toggle { flex: 1; }
.important-toggle-btn { flex-shrink: 0; padding: 5px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--surface2); font-size: 11.5px; font-weight: 700; color: var(--text2); cursor: pointer; }
.important-toggle-btn.active { border-color: var(--rust); background: var(--rust-light); color: var(--rust); }
.video-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.video-item { display: flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; }
.video-item a { flex: 1; font-size: 13px; color: var(--navy); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.video-item button { border: none; background: none; color: var(--text3); cursor: pointer; font-size: 15px; padding: 2px 4px; }
.video-title-shared { display: block; width: 100%; border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; background: var(--surface2); margin-bottom: 8px; }
.video-title-shared:focus { outline: none; border-color: var(--navy); background: var(--surface); }
.video-add { display: flex; gap: 6px; flex-wrap: wrap; }
.video-add input { flex: 1 1 120px; min-width: 0; border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; background: var(--surface2); }
.video-add input:focus { outline: none; border-color: var(--navy); background: var(--surface); }
.video-add button { flex-shrink: 0; white-space: nowrap; border: 1px solid var(--border2); background: var(--surface2); border-radius: var(--radius-sm); padding: 0 14px; font-size: 13px; cursor: pointer; color: var(--text2); }
.video-limit { font-size: 12px; color: var(--text3); background: var(--surface2); border-radius: var(--radius-sm); padding: 9px 10px; text-align: center; }

/* ── video upload ── */
.video-drop { border: 2px dashed var(--border2); border-radius: var(--radius-sm); padding: 18px 12px; text-align: center; cursor: pointer; background: var(--surface2); margin-top: 8px; transition: border-color .15s, background .15s; }
.video-drop.drag { border-color: var(--navy); background: var(--navy-light); }
.video-drop .v-drop-icon { font-size: 20px; display: block; margin-bottom: 4px; }
.video-drop .v-drop-main { font-weight: 700; font-size: 12.5px; color: var(--text); }
.video-drop .v-drop-sub { font-size: 10.5px; color: var(--text3); margin-top: 2px; }
.video-drop input[type=file] { display: none; }
.video-filename { margin-top: 6px; font-size: 11.5px; color: var(--navy); word-break: break-all; }
.video-processing-hint { margin-top: 8px; font-size: 11px; color: var(--text3); line-height: 1.5; }
.video-upload-btn { width: 100%; margin-top: 8px; padding: 10px; border: none; border-radius: var(--radius-sm); background: var(--navy); color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; }
.video-upload-btn:disabled { opacity: .4; cursor: not-allowed; }
.video-board { margin-top: 8px; display: none; }
.video-board.show { display: block; }
.video-track { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
.video-fill { height: 100%; width: 0%; background: var(--rust); transition: width .15s linear; }
.video-status { margin-top: 5px; font-size: 11px; color: var(--text2); text-align: center; }
.video-err { margin-top: 8px; display: none; background: var(--rust-light); border: 1px solid #E7C4B6; border-radius: var(--radius-sm); padding: 8px 10px; font-size: 11.5px; color: var(--stitch); line-height: 1.6; }
.video-err.show { display: block; }
.video-divider { text-align: center; font-size: 11px; color: var(--text3); margin: 10px 0; }
.save-status { font-size: 11px; font-weight: 500; color: var(--text3); margin-left: 6px; }
.thread-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.thread-title { font-size: 12px; font-weight: 700; color: var(--text2); margin-bottom: 12px; }
.thread { position: relative; min-height: 20px; }
.msg { margin-bottom: 14px; max-width: 88%; }
.msg.mine { margin-left: auto; }
.msg-meta { font-size: 11px; color: var(--text3); margin-bottom: 3px; }
.msg.mine .msg-meta { text-align: right; }
.msg-bubble { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 9px 12px; font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; }
.msg.mine .msg-bubble { background: var(--navy-light); border-color: #D8DEE9; }
.thread-empty { color: var(--text3); font-size: 13px; padding: 4px 0 10px; }
.thread-input { display: flex; gap: 8px; margin-top: 10px; }
.thread-input textarea { min-height: 40px; flex: 1; min-width: 0; }
.thread-input button { flex-shrink: 0; white-space: nowrap; align-self: flex-end; background: var(--stitch); color: #fff; border: none; border-radius: var(--radius-sm); padding: 10px 16px; font-size: 13px; font-weight: 700; cursor: pointer; }
.new-badge { display: inline-block; background: var(--stitch); color: #fff; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 8px; margin-left: 4px; vertical-align: middle; }
.thread-notice { background: var(--rust-light); color: var(--stitch); font-size: 12.5px; font-weight: 700; border-radius: var(--radius-sm); padding: 9px 11px; margin-bottom: 8px; }
.send-target { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border2); }
.send-target-label { font-size: 11px; font-weight: 700; color: var(--text3); margin-bottom: 6px; }
.send-target-opts { display: flex; gap: 6px; }
.send-target-opt { flex: 1; text-align: center; padding: 7px 4px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--surface2); font-size: 12px; font-weight: 700; color: var(--text2); cursor: pointer; }
.send-target-opt.active { border-color: var(--navy); background: var(--navy); color: #fff; }
.send-target-picker { margin-top: 8px; }
.send-target-search { width: 100%; padding: 7px 10px; border: 1px solid var(--border2); border-radius: var(--radius-sm); font-size: 12.5px; margin-bottom: 6px; background: var(--surface); font-family: inherit; }
.send-target-list { display: flex; flex-direction: column; gap: 2px; max-height: 160px; overflow-y: auto; }
.send-target-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; font-size: 13px; cursor: pointer; }
.send-target-item:hover { background: var(--surface2); }

  const msgEl = document.getElementById('del-msg');
  const updateState = () => { submitBtn.disabled = !(passEl.value && confirmEl.value.trim() === '削除'); };
  passEl.oninput = updateState;
  confirmEl.oninput = updateState;

  // 有料プランの注意書き（確認できなかった場合も、念のため注意を出す）
  checkActiveSubscription(current.uid).then(active => {
    const note = document.getElementById('del-sub-note');
    if (!note) return;
    if (active === false) { note.remove(); return; }
    const teamNote = isCoachRole ? 'チームの他のコーチが契約していない場合、選手もSelf+を使えなくなります。' : '';
    note.innerHTML = active
      ? `<b>加入中の有料プランは、削除と同時に解約されます。</b>日割りでの返金はありません。${teamNote}`
      : `契約状況を確認できませんでした。有料プランに加入中の場合は、削除と同時に解約されます（日割りでの返金はありません）。${teamNote}`;
  });

  submitBtn.onclick = async () => {
    msgEl.innerHTML = '';
    submitBtn.disabled = true;
    submitBtn.textContent = '削除しています…';
    try {
      const cred = EmailAuthProvider.credential(current.email, passEl.value);
      await reauthenticateWithCredential(current, cred);
      pendingAuthNotice = { text: 'アカウントを削除しました。ご利用ありがとうございました。', type: 'ok' };
      await deleteUser(current);
      close();
      // この後 onAuthStateChanged が発火してログイン画面に戻り、上のメッセージが表示される
    } catch (e) {
      pendingAuthNotice = null;
      console.error('account delete failed', e);
      const wrongPass = e && (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential');
      const text = wrongPass ? 'パスワードが正しくありません。' : translateError(e);
      msgEl.innerHTML = `<div class="pay-msg err">${escapeHtml(text)}</div>`;
      submitBtn.textContent = '完全に削除する';
      updateState();
    }
  };
}

async function kvGet(key) {
  const snap = await getDoc(doc(db, 'kv', key));
  if (!snap.exists()) return null;
  return { value: snap.data().value };
}
async function kvSet(key, value) {
  await setDoc(doc(db, 'kv', key), { key, value, updatedAt: Date.now() });
  return true;
}
async function kvList(prefix, withValues) {
  const q = query(collection(db, 'kv'), where(documentId(), '>=', prefix), where(documentId(), '<', prefix + '\uf8ff'));
  const snaps = await getDocs(q);
  const keys = [];
  const docs = [];
  snaps.forEach(d => { keys.push(d.id); if (withValues) docs.push({ key: d.id, value: d.data().value }); });
  return { keys, docs };
}

function birthYearOptions() {

}
function monthDayOptions(max, label) {
  let html = `<option value="">${label}</option>`;
  for (let i = 1; i <= max; i++) html += `<option value="${i}">${i}${label}</option>`;
  return html;
}
function showAuthMsg(text, type) {
  const el = document.getElementById('a-msg');
  if (el) el.innerHTML = `<div class="auth-msg ${type}">${text}</div>`;
}
async function handleForgotPassword() {

// アカウント削除（ロールバック）を試みる。成功/失敗を呼び出し側で判定できるようにする。
async function rollbackSignupAccount(cred) {
  try {
    await cred.user.delete();
    return true;
  } catch (e) {
    console.error('signup rollback failed:', e);
    return false;
  }
}
async function handleSignup() {
  const agreeEl = document.getElementById('a-agree');
  if (!agreeEl || !agreeEl.checked) { showAuthMsg('利用規約とプライバシーポリシーへの同意が必要です', 'err'); return; }
  const name = document.getElementById('a-name').value.trim();
  const sport = document.getElementById('a-sport').value.trim();
  const email = document.getElementById('a-email').value.trim();
  const password = document.getElementById('a-pass').value;
  let teamCode = '';

  if (authRole === 'student') {
    teamCode = document.getElementById('a-team').value.trim().toUpperCase();
    if (!name || !sport || !teamCode || !email || !password) { showAuthMsg('すべての項目を入力してください', 'err'); return; }
  } else if (authRole === 'coach' && authCoachMode === 'join') {
    teamCode = document.getElementById('a-team').value.trim().toUpperCase();
    if (!name || !sport || !teamCode || !email || !password) { showAuthMsg('すべての項目を入力してください', 'err'); return; }
  } else {
    if (!name || !sport || !email || !password) { showAuthMsg('すべての項目を入力してください', 'err'); return; }
  }

  let birthdate = null;
  if (authRole === 'student') {
    const by = document.getElementById('a-birth-y').value;
    const bm = document.getElementById('a-birth-m').value;
    const bd = document.getElementById('a-birth-d').value;
    if (!by || !bm || !bd) { showAuthMsg('生年月日を入力してください', 'err'); return; }
    birthdate = `${by}-${String(bm).padStart(2, '0')}-${String(bd).padStart(2, '0')}`;
  }

  const submitBtn = document.getElementById('a-submit');
  submitBtn.disabled = true;
  let cred = null;
  try {
    // Firestoreへの問い合わせ（招待コードの検証・発行）はセキュリティルール上
    // 認証済みユーザーでないと permission-denied になるため、
    // 先にFirebase Authenticationのアカウント作成を済ませる。
    cred = await createUserWithEmailAndPassword(auth, email, password);

    if (authRole === 'student') {
      const coachQ = query(collection(db, 'users'), where('teamCode', '==', teamCode), where('role', '==', 'coach'));
      const coachSnaps = await getDocs(coachQ);
      if (coachSnaps.empty) {
        // 招待コードが無効だった場合、作成済みの認証アカウントをロールバック（削除）する
        const rolledBack = await rollbackSignupAccount(cred);
        showAuthMsg(
          rolledBack
            ? 'その招待コードに一致するコーチが見つかりませんでした。コードを確認してください。'
            : 'その招待コードに一致するコーチが見つかりませんでした。また、アカウントの後始末に失敗しました。お手数ですが、このメールアドレスでの再登録がうまくいかない場合はお問い合わせフォームからご連絡ください。',
          'err'
        );
        submitBtn.disabled = false;
        return;
      }
    } else if (authRole === 'coach' && authCoachMode === 'join') {
      const coachQ = query(collection(db, 'users'), where('teamCode', '==', teamCode), where('role', '==', 'coach'));
      const coachSnaps = await getDocs(coachQ);
      if (coachSnaps.empty) {
        const rolledBack = await rollbackSignupAccount(cred);
        showAuthMsg(
          rolledBack
            ? 'その招待コードに一致するチームが見つかりませんでした。コードを確認してください。'
            : 'その招待コードに一致するチームが見つかりませんでした。また、アカウントの後始末に失敗しました。お手数ですが、このメールアドレスでの再登録がうまくいかない場合はお問い合わせフォームからご連絡ください。',
          'err'
        );
        submitBtn.disabled = false;
        return;
      }
    } else {
      teamCode = await generateUniqueTeamCode();
    }

    const profileData = { email, displayName: name, role: authRole, sport, teamCode, createdAt: Date.now() };
    if (authRole === 'student') {
      Object.assign(profileData, { birthdate });
    }
    await setDoc(doc(db, 'users', cred.user.uid), profileData);
    await sendEmailVerification(cred.user);
    if (authRole === 'coach' && authCoachMode === 'new') {
      showAuthMsg(`仮登録できました。あなたの招待コードは「${teamCode}」です。届いた確認メールのリンクを開いてから、ログインしてください。`, 'ok');
    } else if (authRole === 'coach') {
      showAuthMsg('仮登録できました。チームに参加しました。届いた確認メールのリンクを開いてから、ログインしてください。', 'ok');
    } else {
      showAuthMsg('仮登録できました。届いた確認メールのリンクを開いてから、ログインしてください。', 'ok');
    }
  } catch (e) {
    // setDoc等の後半処理で失敗した場合も、認証アカウントだけ残ってしまわないようロールバックを試みる
    if (cred && cred.user) {
      const rolledBack = await rollbackSignupAccount(cred);
      if (!rolledBack) {
        showAuthMsg(translateError(e) + ' また、アカウントの後始末にも失敗しました。お手数ですが、このメールアドレスでの再登録がうまくいかない場合はお問い合わせフォームからご連絡ください。', 'err');
        submitBtn.disabled = false;
        return;
      }
    }
    showAuthMsg(translateError(e), 'err');
  }
  submitBtn.disabled = false;
}
async function handleLogin() {
  const email = document.getElementById('a-email').value.trim();
  const password = document.getElementById('a-pass').value;
  if (!email || !password) { showAuthMsg('メールアドレスとパスワードを入力してください', 'err'); return; }
  try {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    await reload(cred.user);
    if (!cred.user.emailVerified) {
      showAuthMsg('まだメール確認が済んでいません。届いたメールのリンクを開いてから、もう一度ログインしてください。', 'err');
      await signOut(auth);
      return;
    }
  } catch (e) { showAuthMsg(translateError(e), 'err'); }
}
function translateError(e) {
  const code = e.code || '';
  if (code.includes('email-already-in-use')) return 'このメールアドレスはすでに登録されています。ログインタブからお試しください。';
  if (code.includes('invalid-email')) return 'メールアドレスの形式が正しくありません。';
  if (code.includes('weak-password')) return 'パスワードは6文字以上にしてください。';
  if (code.includes('user-not-found') || code.includes('wrong-password') || code.includes('invalid-credential')) return 'メールアドレスまたはパスワードが正しくありません。';
  return 'エラーが発生しました：' + code;
}

/* ────────── 起動フロー ────────── */
onAuthStateChanged(auth, async (user) => {
  if (user && user.emailVerified) {
    try {
      let profSnap;
      try {
        profSnap = await getDoc(doc(db, 'users', user.uid));
      } catch (e) {
        console.error('profile fetch failed', e);
        renderCheckFailedScreen({ displayName: '' }, () => location.reload());
        return;
      }
      if (!profSnap.exists()) {
        app.innerHTML = `<div class="err-screen">プロフィールが見つかりませんでした。サポートにご連絡ください。</div>`;
        return;
      }
      const profile = profSnap.data();
      if (profile.freeAccess === true) {
        boot(user, profile);
        return;
      }
      if (profile.role === 'coach') {
        // チーム単位の契約：自分個人の契約でなく、同じチームのコーチの誰か1人でも
        // 有効な契約(またはfreeAccess)を持っていればチーム全体を有効とみなす
        const coachQ = query(collection(db, 'users'), where('teamCode', '==', profile.teamCode), where('role', '==', 'coach'));
        const coachSnaps = await getDocs(coachQ);
        let teamActive = false;
        let checkFailed = false;
        for (const d of coachSnaps.docs) {
          if (d.data().freeAccess === true) { teamActive = true; break; }
          const result = await checkActiveSubscription(d.id);
          if (result === true) { teamActive = true; break; }
          if (result === null) checkFailed = true;
        }
        if (teamActive) {
          boot(user, profile);
        } else if (checkFailed) {
          // 誰か1人でも「確認できなかった」だけで、確実に未契約と判明した人はいない
          renderCheckFailedScreen(profile, () => location.reload());
        } else {
          renderPaywall(user, profile);
        }
      } else {
        await routeStudent(user, profile);
      }
    } catch (e) {
      app.innerHTML = `<div class="err-screen">読み込みに失敗しました：${e.message}</div>`;
    }
  } else {
    renderAuth();
  }
});

async function routeStudent(user, profile) {
  // チームから外れた（コーチに削除された）選手は、担当コーチ検索より前にここで検知する
  if (!profile.teamCode) {
    const result = await checkActiveSubscription(user.uid);
    if (result === true) {
      boot(user, profile);
    } else if (result === null) {
      renderCheckFailedScreen(profile, () => routeStudent(user, profile));
    } else {
      renderRemovedStudentScreen(user, profile);
    }
    return;
  }
  // 生徒本人は課金せず、担当コーチの契約状況で判定する
  // （同じチームのコーチの誰か1人でも有効な契約/freeAccessがあればOK）
  const coachQ = query(collection(db, 'users'), where('teamCode', '==', profile.teamCode), where('role', '==', 'coach'));
  const coachSnaps = await getDocs(coachQ);
  if (coachSnaps.empty) {
    app.innerHTML = `<div class="err-screen">担当コーチが見つかりませんでした。招待コードをコーチに確認してください。</div>`;
    return;
  }
  let coachActive = false;
  let checkFailed = false;
  for (const d of coachSnaps.docs) {
    if (d.data().freeAccess === true) { coachActive = true; break; }
    const result = await checkActiveSubscription(d.id);
    if (result === true) { coachActive = true; break; }
    if (result === null) checkFailed = true;
  }
  if (coachActive) {
    boot(user, profile);
  } else if (checkFailed) {
    renderCheckFailedScreen(profile, () => routeStudent(user, profile));
  } else {
    // コーチの契約が止まっている（または未加入）チームの選手も、自分の過去の記録は閲覧できるようにする
    renderRemovedStudentScreen(user, profile, 'coachInactive');
  }
}

// 招待コードを入力して新しいチームに参加する（ログイン中の既存アカウント向け）。
// 成功すると自分の teamCode を書き換える。呼び出し側で再判定（routeStudent等）すること。
async function joinTeamByCode(uid, rawCode) {
  const code = (rawCode || '').trim().toUpperCase();
  if (!code) return { ok: false, message: '招待コードを入力してください' };
  const coachQ = query(collection(db, 'users'), where('teamCode', '==', code), where('role', '==', 'coach'));
  const coachSnaps = await getDocs(coachQ);
  if (coachSnaps.empty) return { ok: false, message: 'その招待コードに一致するチームが見つかりませんでした。コードを確認してください。' };
  try {
    await setDoc(doc(db, 'users', uid), { teamCode: code }, { merge: true });
    return { ok: true };
  } catch (e) {
    return { ok: false, message: '参加に失敗しました：' + e.message };
  }
}

async function checkActiveSubscription(uid) {
  try {
    const q = query(
      collection(db, 'customers', uid, 'subscriptions'),
      where('status', 'in', ['trialing', 'active'])
    );
    const snaps = await getDocs(q);
    return !snaps.empty;
  } catch (e) {
    console.error('subscription check failed', e);
    // 通信エラーやFirestore側の一時的な問題で「確認できなかった」場合はnullを返す。
    // ここでfalseにしてしまうと「未契約」と誤判定され、正規の課金者が
    // 有料画面に弾かれてしまうため、呼び出し側で必ず区別して扱うこと。
    return null;
  }
}

  async function renderCal() {
    const cal = document.getElementById('removed-cal');
    if (!cal) return;
    const y = rState.year, m = rState.month;
    const first = new Date(y, m, 1);
    const startDow = first.getDay();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const prevDays = new Date(y, m, 0).getDate();
    const dows = ['日', '月', '火', '水', '木', '金', '土'];
    let cells = '';
    for (let i = 0; i < startDow; i++) cells += `<div class="cal-cell out">${prevDays - startDow + i + 1}</div>`;
    const t = todayParts();
    for (let d = 1; d <= daysInMonth; d++) {
      const key = dateKey(y, m, d);
      const isToday = t.y === y && t.m === m && t.d === d;
      const isSel = key === rState.selected;
      cells += `<div class="cal-cell ${isToday ? 'today' : ''} ${isSel ? 'selected' : ''}" data-date="${key}">
        <span>${d}</span><span class="dot" style="visibility:hidden" data-dot="${key}"></span>
      </div>`;
    }
    const totalCells = startDow + daysInMonth;
    const trailing = (7 - (totalCells % 7)) % 7;
    for (let i = 1; i <= trailing; i++) cells += `<div class="cal-cell out">${i}</div>`;
    cal.innerHTML = `
      <div class="cal-head">
        <div class="cal-nav"><button id="removed-prevM">‹</button></div>
        <div class="cal-title">${y}年 ${m + 1}月</div>
        <div class="cal-nav"><button id="removed-nextM">›</button></div>
      </div>

    `;

    document.getElementById('removed-nextM').onclick = () => { rState.month++; if (rState.month > 11) { rState.month = 0; rState.year++; } renderCal(); };
    cal.querySelectorAll('.cal-cell[data-date]').forEach(c => {
      c.onclick = () => { rState.selected = c.dataset.date; renderCal(); renderDetail(); };
    });
    try {
      // 今日のカレンダー修正と同じ理由：一覧クエリ(kvList)はFirestoreのルール上
      // 安全性の事前証明が不安定なため使わず、1日ずつ個別取得(kvGet)する。
      // 未来の日付は記録が存在し得ないので問い合わせから除外する。
      const maxDay = (t.y === y && t.m === m) ? t.d : (t.y > y || (t.y === y && t.m > m)) ? daysInMonth : 0;
      const days = Array.from({ length: maxDay }, (_, i) => i + 1);
      await Promise.all(days.map(async (d) => {
        const dateStr = dateKey(y, m, d);
        try {
          const r = await kvGet(`entry:${user.uid}:${dateStr}`);
          if (!r || !r.value) return;
          let parsed = null;
          try { parsed = JSON.parse(r.value); } catch (e) { return; }
          if (!hasEntryContent(parsed)) return;
          const dotEl = cal.querySelector(`[data-dot="${dateStr}"]`);
          if (dotEl) dotEl.style.visibility = 'visible';
        } catch (e) { /* この日だけ取得失敗、他の日には影響させない */ }
      }));
    } catch (e) { console.error('[removed-calendar] renderCal failed:', e); }
  }

  async function renderDetail() {
    const box = document.getElementById('removed-detail');
    if (!box) return;
    box.innerHTML = `<div class="empty-hint">読み込み中…</div>`;
    let data = null;
    try {
      const res = await kvGet(`entry:${user.uid}:${rState.selected}`);
      if (res && res.value) data = JSON.parse(res.value);
    } catch (e) {}
    if (!data) {
      box.innerHTML = `<div class="removed-date-label">${formatSelectedLabel(rState.selected)}</div><div class="card"><div class="empty-hint">この日の記録はありません</div></div>`;
      return;
    }
    try {
      const w = WEATHER_OPTS.find(o => o.v === data.weather);
      const c1 = CONDITION_OPTS.find(o => o.v === data.condition);
      const c2 = CONDITION_OPTS.find(o => o.v === data.mind);
      const c3 = CONDITION_OPTS.find(o => o.v === data.skill);
      const c4 = CONDITION_OPTS.find(o => o.v === data.body);
      box.innerHTML = `
        <div class="removed-date-label">${formatSelectedLabel(rState.selected)}${data.important ? ' ★重要' : ''}</div>
        <div class="card">
          <div class="removed-cond-row">
            ${w ? `<span>${w.icon} ${w.label}</span>` : ''}
            ${c1 ? `<span>${c1.icon} 体調:${c1.label}</span>` : ''}
            ${c2 ? `<span>${c2.icon} 心:${c2.label}</span>` : ''}
            ${c3 ? `<span>${c3.icon} 技:${c3.label}</span>` : ''}
            ${c4 ? `<span>${c4.icon} 体:${c4.label}</span>` : ''}
          </div>
        </div>
        ${data.menu ? `<div class="card"><div class="card-label">練習メニュー</div><div class="removed-readonly-text">${escapeHtml(data.menu)}</div></div>` : ''}
        ${data.good ? `<div class="card good"><div class="card-label">◎ 良かった点</div><div class="removed-readonly-text">${escapeHtml(data.good)}</div>${data.goodComment ? `<div class="removed-coach-comment">💬 ${escapeHtml(data.goodComment)}</div>` : ''}</div>` : ''}
        ${data.issue ? `<div class="card issue"><div class="card-label">△ 改善点</div><div class="removed-readonly-text">${escapeHtml(data.issue)}</div>${data.issueComment ? `<div class="removed-coach-comment">💬 ${escapeHtml(data.issueComment)}</div>` : ''}</div>` : ''}
        ${data.gameGood ? `<div class="card good"><div class="card-label">◎ 試合で良かった点</div><div class="removed-readonly-text">${escapeHtml(data.gameGood)}</div>${data.gameGoodComment ? `<div class="removed-coach-comment">💬 ${escapeHtml(data.gameGoodComment)}</div>` : ''}</div>` : ''}
        ${data.gameIssue ? `<div class="card issue"><div class="card-label">△ 試合の改善点</div><div class="removed-readonly-text">${escapeHtml(data.gameIssue)}</div>${data.gameIssueComment ? `<div class="removed-coach-comment">💬 ${escapeHtml(data.gameIssueComment)}</div>` : ''}</div>` : ''}
        ${data.thread && data.thread.length ? `<div class="card"><div class="card-label">やり取り</div>${data.thread.map(m => `<div class="removed-readonly-text"><strong>${escapeHtml(m.authorName || (m.author === 'coach' ? 'コーチ' : '本人'))}：</strong>${escapeHtml(m.text)}</div>`).join('')}</div>` : ''}
      `;
    } catch (e) {
      box.innerHTML = `<div class="removed-date-label">${formatSelectedLabel(rState.selected)}</div><div class="card"><div class="empty-hint">表示に失敗しました</div></div>`;
    }
  }

  await renderCal();
  await renderDetail();
}

async function startCheckout(uid, priceId) {
  const btn = document.getElementById('pay-btn');
  const msg = document.getElementById('pay-msg');
  btn.disabled = true;
  btn.textContent = '処理中…';
  try {
    const sessionRef = await addDoc(collection(db, 'customers', uid, 'checkout_sessions'), {
      price: priceId,
      success_url: SITE_URL,
      cancel_url: SITE_URL
    });
    let settled = false;
    let timeoutId;
    const unsub = onSnapshot(sessionRef, (snap) => {
      if (settled) return;
      const data = snap.data();
      if (!data) return;
      if (data.error) {
        settled = true;
        clearTimeout(timeoutId);
        msg.innerHTML = `<div class="pay-msg err">エラーが発生しました：${data.error.message}</div>`;
        btn.disabled = false;
        btn.textContent = '加入手続きに進む';
        unsub();
      }
      if (data.url) {
        settled = true;
        clearTimeout(timeoutId);
        unsub();
        window.location.assign(data.url);
      }
    });
    // 15秒たっても応答（エラーorリダイレクトURL）が来なければ、
    // ボタンが「処理中…」のまま固まって見えないようにタイムアウトさせる
    timeoutId = setTimeout(() => {
      if (settled) return;
      settled = true;
      unsub();
      msg.innerHTML = `<div class="pay-msg err">時間がかかりすぎています。通信環境を確認して、もう一度お試しください。</div>`;
      btn.disabled = false;
      btn.textContent = '加入手続きに進む';
    }, 15000);
  } catch (e) {
    msg.innerHTML = `<div class="pay-msg err">エラーが発生しました：${e.message}</div>`;
    btn.disabled = false;
    btn.textContent = '加入手続きに進む';
  }
}

async function openPortal() {

    const { data } = await createPortalLink({ returnUrl: SITE_URL });
    window.location.assign(data.url);
  } catch (e) {

  }
}

function pad(n) { return String(n).padStart(2, '0'); }
function dateKey(y, m, d) { return `${y}-${pad(m + 1)}-${pad(d)}`; }
function todayParts() { const t = new Date(); return { y: t.getFullYear(), m: t.getMonth(), d: t.getDate() }; }
function formatSelectedLabel(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dow = ['日', '月', '火', '水', '木', '金', '土'][new Date(y, m - 1, d).getDay()];
  return `${m}月${d}日（${dow}）`;
}
const CONDITION_OPTS = [ { v: 3, icon: '😊', label: '絶好調' }, { v: 2, icon: '😐', label: '普通' }, { v: 1, icon: '😨', label: '不調' } ];
const WEATHER_OPTS = [ { v: 1, icon: '☀️', label: '晴れ' }, { v: 2, icon: '☁️', label: '曇り' }, { v: 3, icon: '☂️', label: '雨' } ];
function escapeHtml(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
// カレンダーに丸を付けるかどうかの判定：ドキュメントが存在するだけでなく、
// 体調・練習メニュー・良かった点／改善点・動画・やり取りなど、実質的な中身が
// 何か入っているかどうかを見る（★重要フラグだけが立ってるケースなどを除外するため）。
// boot()の中だけでなく、離脱後の生徒画面（renderRemovedStudentScreen）からも使うため、
// どちらからも呼べるようにトップレベルで定義する。
function hasEntryContent(data) {
  if (!data) return false;
  const textFields = [data.menu, data.good, data.issue, data.gameGood, data.gameIssue];
  if (textFields.some(v => (v || '').trim())) return true;
  if (Array.isArray(data.videos) && data.videos.length) return true;
  if (Array.isArray(data.thread) && data.thread.length) return true;
  if (data.condition !== null && data.condition !== undefined) return true;
  if (data.weather !== null && data.weather !== undefined) return true;
  if (data.mind !== null && data.mind !== undefined) return true;
  if (data.skill !== null && data.skill !== undefined) return true;
  if (data.body !== null && data.body !== undefined) return true;
  return false;
}

    const q = query(collection(db, 'users'), where('teamCode', '==', profile.teamCode), where('role', '==', 'student'));
    const snaps = await getDocs(q);

    snaps.forEach(d => members.push({ uid: d.id, name: d.data().displayName }));
    if (members.length) TEAM = members;

    const coachQ = query(collection(db, 'users'), where('teamCode', '==', profile.teamCode), where('role', '==', 'coach'));
    const coachSnaps = await getDocs(coachQ);
    const coachMembers = [];
    coachSnaps.forEach(d => coachMembers.push({ uid: d.id, name: d.data().displayName }));
    if (coachMembers.length) COACHES = coachMembers;

    try {
      const catRes = await kvGet(`categories:${profile.teamCode}`);

    year: today.y, month: today.m,

    entry: null, calExpanded: false, gameExpanded: false, remindActive: false,
    videoTarget: { mode: 'self', uids: [], categoryIds: [] }, menuTarget: { mode: 'self', uids: [], categoryIds: [] },
    remindTarget: { mode: 'all', uids: [], categoryIds: [] },
    seenByCoach: {}, seenPickerOpen: false, goalTasksExpanded: true,

  async function render() {

          <div class="${!isCoach && state.view === 'detail' ? 'head-date' : 'head-sub'}" id="head-date-label">${!isCoach && state.view === 'detail' ? formatSelectedLabel(state.selected) : (isCoach ? '選手を選んでカレンダーから記録を確認・記入できます' : 'カレンダーから日付を選んで記録をつけよう')}</div>
        </div>
        ${showCalToggle ? `<button class="head-cal-btn" id="head-cal-btn" aria-label="カレンダーを開く">📅</button>` : ''}
      </div>

        ${isCoach ? `<div class="ptabs" id="ptabs"></div>` : ''}
        ${showHome ? `<div class="dream-card" id="dream-card"><div class="goal-loading">読み込み中…</div></div>` : ''}
        <div class="cal" id="cal"></div>
        ${!showHome ? `
          ${isCoach ? `<div class="dream-card" id="dream-card"><div class="goal-loading">読み込み中…</div></div>` : ''}
          <div class="goal-card" id="goal-card"><div class="goal-loading">読み込み中…</div></div>

  async function goHome() {
    state.view = 'home';
    await render();
  }

  async function openDate(dateStr) {
    state.selected = dateStr;
    const dt = dateStr.split('-');
    state.year = parseInt(dt[0]); state.month = parseInt(dt[1]) - 1;
    state.view = 'detail';

  async function selectDate(dateStr) {
    state.selected = dateStr;
    const dt = dateStr.split('-');
    state.year = parseInt(dt[0]); state.month = parseInt(dt[1]) - 1;
    state.calExpanded = false;

    if (isCoach) await loadDream();

  async function loadDream() {
    let dream = { text: '' };

      const res = await kvGet(`dream:${state.playerId}`);
      if (res && res.value) dream = JSON.parse(res.value);

  function renderDream() {
    const box = document.getElementById('dream-card');
    if (!box) return;
    box.innerHTML = `
      <div class="goal-label">🌟 将来の夢</div>

  function scheduleDreamSave() {

    dreamSaveTimer = setTimeout(saveDream, 700);

  async function saveDream() {

      await kvSet(`dream:${state.playerId}`, JSON.stringify(state.dream));
      if (status) status.textContent = '保存しました';
    } catch (e) { if (status) status.textContent = '保存に失敗しました'; }
  }

  function renderTabs() {
    const wrap = document.getElementById('ptabs');
    wrap.innerHTML = TEAM.map(r => `<button class="ptab ${r.uid === state.playerId ? 'active' : ''}" data-id="${r.uid}">${r.name}</button>`).join('');
    wrap.querySelectorAll('.ptab').forEach(btn => {
      btn.onclick = async () => {
        state.playerId = btn.dataset.id;
        const titleEl = document.getElementById('head-title');
        if (titleEl) titleEl.textContent = TEAM.find(r => r.uid === state.playerId).name + 'さん';
        renderTabs();
        state.calExpanded = false;
        await renderCalendar();
        await loadDream();
        await loadGoal();
        await loadEntry();
      };
    });
  }

  async function renderCalendar() {
    const cal = document.getElementById('cal');
    if (!cal) return;
    const homeMode = !isCoach && state.view === 'home';
    const y = state.year, m = state.month;
    const first = new Date(y, m, 1);
    const startDow = first.getDay();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const prevDays = new Date(y, m, 0).getDate();
    const dows = ['日', '月', '火', '水', '木', '金', '土'];
    let cells = '';
    for (let i = 0; i < startDow; i++) cells += `<div class="cal-cell out">${prevDays - startDow + i + 1}</div>`;
    const t = todayParts();
    for (let d = 1; d <= daysInMonth; d++) {
      const key = dateKey(y, m, d);
      const isToday = t.y === y && t.m === m && t.d === d;
      cells += `<div class="cal-cell ${isToday ? 'today' : ''}" data-date="${key}">
        <span class="cal-star" data-star-date="${key}">☆</span>
        <span>${d}</span><span class="dot" style="visibility:hidden" data-dot="${key}"></span>
      </div>`;
    }
    const totalCells = startDow + daysInMonth;
    const trailing = (7 - (totalCells % 7)) % 7;
    for (let i = 1; i <= trailing; i++) cells += `<div class="cal-cell out">${i}</div>`;
    const gridHtml = `
      <div class="cal-head">
        <div class="cal-nav"><button id="prevM">‹</button></div>
        <div class="cal-title">${y}年 ${m + 1}月</div>
        <div class="cal-nav-right">${(t.y !== y || t.m !== m) ? `<button class="cal-today-btn" id="cal-today">今日</button>` : ''}<button id="nextM">›</button></div>
      </div>
      <div class="cal-grid">${dows.map(d => `<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
      <div class="cal-loading" id="cal-loading" style="visibility:hidden;">読み込み中…</div>
      <div class="cal-hint">日付を長押しすると、大事な試合に★印を付けられます</div>
    `;
    if (homeMode) {
      cal.innerHTML = gridHtml;
    } else {
      cal.innerHTML = `
        <div class="cal-compact" id="cal-compact">
          <span class="cal-compact-label">${formatSelectedLabel(state.selected)}</span>
        </div>
        ${state.calExpanded ? `<div class="cal-grid-wrap">${gridHtml}</div>` : ''}
      `;
    }
    const todayBtn = document.getElementById('cal-today');
    if (todayBtn) todayBtn.onclick = async () => {
      const tp = todayParts();
      state.year = tp.y; state.month = tp.m;
      await renderCalendar();
    };
    const prevBtn = document.getElementById('prevM');
    if (prevBtn) prevBtn.onclick = async () => { state.month--; if (state.month < 0) { state.month = 11; state.year--; } await renderCalendar(); };
    const nextBtn = document.getElementById('nextM');
    if (nextBtn) nextBtn.onclick = async () => { state.month++; if (state.month > 11) { state.month = 0; state.year++; } await renderCalendar(); };
    cal.querySelectorAll('.cal-cell[data-date]').forEach(c => {
      let pressTimer = null;
      let longPressed = false;
      const startPress = () => {
        longPressed = false;
        pressTimer = setTimeout(() => {
          longPressed = true;
          if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }
          const starEl = c.querySelector('.cal-star');
          toggleCalendarImportant(c.dataset.date, starEl);
        }, 500);
      };
      const cancelPress = () => { clearTimeout(pressTimer); };
      c.addEventListener('pointerdown', startPress);
      c.addEventListener('pointerup', cancelPress);
      c.addEventListener('pointerleave', cancelPress);
      c.addEventListener('pointercancel', cancelPress);
      c.onclick = () => {
        if (longPressed) { longPressed = false; return; }
        homeMode ? openDate(c.dataset.date) : selectDate(c.dataset.date);
      };
    });
    const loadingEl = document.getElementById('cal-loading');
    const cacheKey = `${state.playerId}:${y}-${pad(m + 1)}`;
    const cached = state.calCache[cacheKey];
    if (cached) {
      // 同じ月をすでに読み込み済みなら、通信せずキャッシュから即表示する
      cached.dateStrs.forEach(dateStr => {
        const dotEl = cal.querySelector(`[data-dot="${dateStr}"]`);
        if (dotEl) dotEl.style.visibility = 'visible';
      });
      await markUnreadDots(cached.dateStrs, cached.entryCache);
      return;
    }
    if (loadingEl) loadingEl.style.visibility = 'visible';
    try {
      const dateStrs = [];
      const entryCache = {}; // dateStr -> パース済みentryデータ（markUnreadDotsでの再取得を避けるため）
      // 一覧クエリ(list)はFirestoreのルール上「本当に安全か」を事前証明する必要があり、
      // 今回のルール（get()を使った間接判定を含む複雑なOR条件）だと、たとえ自分自身のデータでも
      // 証明が不安定でpermission-deniedになることがあるため使わない。
      // 個別取得(get)は都度そのドキュメント単体で権限判定されるため確実に動く。
      // 未来の日付は絶対に記録が存在しないので、問い合わせの対象から外して通信回数を減らす。
      const maxDay = (t.y === y && t.m === m) ? t.d : (t.y > y || (t.y === y && t.m > m)) ? daysInMonth : 0;
      const days = Array.from({ length: maxDay }, (_, i) => i + 1);
      const results = await Promise.all(days.map(async (d) => {
        const dateStr = dateKey(y, m, d);
        try {
          const r = await kvGet(`entry:${state.playerId}:${dateStr}`);
          if (!r || !r.value) return null;
          let parsed = null;
          try { parsed = JSON.parse(r.value); } catch (e) { return null; }
          entryCache[dateStr] = parsed;
          return hasEntryContent(parsed) ? dateStr : null;
        } catch (e) { return null; }
      }));
      results.forEach(dateStr => {
        if (!dateStr) return;
        dateStrs.push(dateStr);
        const dotEl = cal.querySelector(`[data-dot="${dateStr}"]`);
        if (dotEl) dotEl.style.visibility = 'visible';
      });
      // 今月はまだ記録が増えていく途中なので、月をまたいだ後のキャッシュのみ対象にする
      // （過去月は原則もう変わらないため安全にキャッシュできる。今月は毎回取り直す）
      if (!(t.y === y && t.m === m)) {
        state.calCache[cacheKey] = { dateStrs, entryCache };
      }
      await markUnreadDots(dateStrs, entryCache);
    } catch (e) {
      console.error('[calendar] renderCalendar failed:', e);
      console.error('[calendar] debug: state.playerId =', state.playerId, ' user.uid =', user.uid, ' match =', state.playerId === user.uid, ' isCoach =', isCoach, ' role =', state.role);
    } finally {
      if (loadingEl) loadingEl.style.visibility = 'hidden';
    }
  }

  async function toggleCalendarImportant(dateStr, starEl) {
    try {
      let data = null;
      const res = await kvGet(`entry:${state.playerId}:${dateStr}`);
      if (res && res.value) data = JSON.parse(res.value);
      if (!data) data = emptyEntry();
      data.important = !data.important;
      await kvSet(`entry:${state.playerId}:${dateStr}`, JSON.stringify(data));
      if (starEl) {
        starEl.textContent = data.important ? '★' : '☆';
        starEl.classList.toggle('active', data.important);
      }
      const cellEl = starEl ? starEl.closest('.cal-cell') : document.querySelector(`.cal-cell[data-date="${dateStr}"]`);
      if (cellEl) cellEl.classList.toggle('important', data.important);
      // 今開いてる日付なら、記入画面側のボタンも同期させる
      if (state.selected === dateStr && state.entry) {
        state.entry.important = data.important;
        const panelBtn = document.getElementById('important-toggle');
        if (panelBtn) {
          panelBtn.textContent = data.important ? '★ 重要' : '☆ 重要な試合にする';
          panelBtn.classList.toggle('active', data.important);
        }
      }
    } catch (e) {
      alert('更新に失敗しました。もう一度お試しください。');
    }
  }

  async function markUnreadDots(dateStrs, entryCache) {
    await Promise.all(dateStrs.map(async (dateStr) => {
      try {
        const cached = entryCache && entryCache[dateStr];
        const [data, lastReadEpoch] = await Promise.all([
          cached ? Promise.resolve(cached) : kvGet(`entry:${state.playerId}:${dateStr}`).then(r => (r && r.value) ? JSON.parse(r.value) : null),
          getLastRead(state.playerId, dateStr, state.role),
        ]);
        if (!data) return;
        const cellEl = document.querySelector(`.cal-cell[data-date="${dateStr}"]`);
        if (cellEl) cellEl.classList.toggle('important', !!data.important);
        const starEl = document.querySelector(`.cal-star[data-star-date="${dateStr}"]`);
        if (starEl && data.important) { starEl.textContent = '★'; starEl.classList.add('active'); }
        const dotEl = document.querySelector(`[data-dot="${dateStr}"]`);
        if (dotEl) {
          const opt = CONDITION_OPTS.find(o => o.v === data.condition);
          if (opt) {
            dotEl.textContent = opt.icon;
            dotEl.classList.add('dot-face');
          }
        }
        if (!data.thread || !data.thread.length) return;
        const last = data.thread[data.thread.length - 1];
        if (last.author === state.role) return;
        if (last.tsRaw && last.tsRaw > lastReadEpoch) {
          if (dotEl) { dotEl.style.visibility = 'visible'; dotEl.classList.add('dot-unread'); }
        }
      } catch (e) { console.error('[calendar] markUnreadDots failed for', dateStr, ':', e); }
    }));
  }
  async function getLastRead(playerId, date, role) {
    try {
      const res = await kvGet(`lastread:${playerId}:${date}:${role}`);
      if (res && res.value) return parseInt(res.value, 10) || 0;
    } catch (e) {}
    return 0;
  }
  async function setLastRead(playerId, date, role) {
    try { await kvSet(`lastread:${playerId}:${date}:${role}`, String(Date.now())); } catch (e) {}
  }

  function goalKey(playerId, dateStr) {
    const ym = dateStr.slice(0, 7); // "2026-09-21" -> "2026-09"
    return `goal:${playerId}:${ym}`;
  }
  async function getGoal(playerId, dateStr) {
    try {
      const res = await kvGet(goalKey(playerId, dateStr));
      if (res && res.value) return JSON.parse(res.value);
    } catch (e) {}
    // 移行措置：月ごとに分ける前の共通データ（goal:uid）は、
    // 「今まさに使ってる月（今日を含む月）」のときだけ初期値として引き継ぐ。
    // それ以外の月（未来の月や、他の過去月）は常に白紙から始める。
    const t = todayParts();
    const thisMonthStr = `${t.y}-${pad(t.m + 1)}`;
    if (dateStr.slice(0, 7) === thisMonthStr) {
      try {
        const legacy = await kvGet(`goal:${playerId}`);
        if (legacy && legacy.value) return JSON.parse(legacy.value);
      } catch (e) {}
    }
    return { goal: '', tasks: [] };
  }
  function newTaskId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function normalizeGoalTasks(goal) {
    let tasks = goal.tasks || [];
    let generatedId = false;
    // 旧形式（文字列の配列）からの移行、およびid未付与のタスクへのid付与
    // （完了チェックを日付ごとに記録するため、タスクを一意に特定できるidが必要）
    tasks = tasks.map(t => {
      if (typeof t === 'string') { generatedId = true; return { id: newTaskId(), text: t, important: false }; }
      if (!t.id) { generatedId = true; t = { ...t, id: newTaskId() }; }
      delete t.done; // 完了状態は日付ごとの別ドキュメントで管理するため、タスク本体からは削除
      return t;
    });
    while (tasks.length < 3) { tasks.push({ id: newTaskId(), text: '', important: false }); generatedId = true; }
    goal.tasks = tasks;
    goal._idsGenerated = generatedId;
    return goal;
  }
  async function getGoalDone(playerId, dateStr) {
    try {
      const res = await kvGet(`goalDone:${playerId}:${dateStr}`);
      if (res && res.value) return JSON.parse(res.value);
    } catch (e) {}
    return [];
  }
  async function loadGoal() {
    state.goal = normalizeGoalTasks(await getGoal(state.playerId, state.selected));
    state.goalDoneToday = await getGoalDone(state.playerId, state.selected);
    if (state.goalTasksExpanded === undefined) state.goalTasksExpanded = true;
    renderGoal();
    if (state.goal._idsGenerated) { saveGoal().catch(() => {}); } // 新規付与したidを保存しておく
  }
  function renderGoal() {
    const box = document.getElementById('goal-card');
    if (!box) return;
    const tasks = state.goal.tasks;
    const doneSet = new Set(state.goalDoneToday || []);
    const doneCount = tasks.filter(t => t.text.trim() && doneSet.has(t.id)).length;
    const totalCount = tasks.filter(t => t.text.trim()).length;
    const importantIdx = [];
    const normalIdx = [];
    tasks.forEach((t, i) => (t.important ? importantIdx : normalIdx).push(i));
    const shownIdx = state.goalTasksExpanded ? tasks.map((_, i) => i) : importantIdx;
    const hiddenCount = tasks.length - shownIdx.length;
    function taskRowHtml(i) {
      const t = tasks[i];
      const done = doneSet.has(t.id);
      return `
        <div class="goal-task-row ${done ? 'done' : ''}">
          <div class="goal-task-check" data-check="${i}">${done ? '✓' : ''}</div>
          <input class="goal-task-input" data-i="${i}" placeholder="やること ${i + 1}" value="${escapeAttr(t.text)}">
          <button type="button" class="goal-task-star ${t.important ? 'active' : ''}" data-star="${i}" aria-label="重要度">${t.important ? '★' : '☆'}</button>
          ${i >= 3 ? `<button class="goal-task-del" data-i="${i}">✕</button>` : ''}
        </div>`;
    }
    box.innerHTML = `
      <div class="goal-label">🎯 月間目標</div>
      <input class="goal-input" id="goal-text" placeholder="目標を書こう" value="${escapeAttr(state.goal.goal)}">
      <div class="goal-tasks-label">そのためにやること${totalCount ? `<span class="goal-progress">${doneCount}/${totalCount} 達成</span>` : ''}</div>
      <div class="goal-tasks" id="goal-tasks">
        ${shownIdx.map(i => taskRowHtml(i)).join('')}
      </div>
      ${hiddenCount > 0 ? `<button class="goal-expand-btn" id="goal-expand-btn">▶ 他${hiddenCount}件を表示</button>` : ''}
      ${state.goalTasksExpanded && normalIdx.length ? `<button class="goal-expand-btn" id="goal-collapse-btn">▲ 閉じる</button>` : ''}
      <button class="goal-add-btn" id="goal-add-task">＋ やることを追加</button>
      <button class="goal-add-btn" id="ai-goal-tasks-btn">🤖 AIでタスクを自動作成</button>
      <span class="save-status" id="goal-save-status"></span>
    `;
    document.getElementById('goal-text').addEventListener('input', scheduleGoalSave);
    box.querySelectorAll('.goal-task-input').forEach(inp => inp.addEventListener('input', scheduleGoalSave));
    box.querySelectorAll('.goal-task-del').forEach(btn => {
      btn.onclick = () => { state.goal.tasks.splice(parseInt(btn.dataset.i), 1); renderGoal(); saveGoal(); };
    });
    box.querySelectorAll('.goal-task-check').forEach(chk => {
      chk.onclick = () => {
        const i = parseInt(chk.dataset.check);
        const id = state.goal.tasks[i].id;
        const set = new Set(state.goalDoneToday || []);
        if (set.has(id)) set.delete(id); else set.add(id);
        state.goalDoneToday = [...set];
        renderGoal(); saveGoalDone();
      };
    });
    box.querySelectorAll('.goal-task-star').forEach(star => {
      star.onclick = () => {
        const i = parseInt(star.dataset.star);
        state.goal.tasks[i].important = !state.goal.tasks[i].important;
        renderGoal(); saveGoal();
      };
    });
    const expandBtn = document.getElementById('goal-expand-btn');
    if (expandBtn) expandBtn.onclick = () => { state.goalTasksExpanded = true; renderGoal(); };
    const collapseBtn = document.getElementById('goal-collapse-btn');
    if (collapseBtn) collapseBtn.onclick = () => { state.goalTasksExpanded = false; renderGoal(); };
    document.getElementById('goal-add-task').onclick = () => { state.goal.tasks.push({ id: newTaskId(), text: '', important: false }); state.goalTasksExpanded = true; renderGoal(); };
    const aiGoalTasksBtn = document.getElementById('ai-goal-tasks-btn');
    if (aiGoalTasksBtn) {
      aiGoalTasksBtn.onclick = async () => {
        const goalTextEl = document.getElementById('goal-text');
        const goalText = (goalTextEl && goalTextEl.value) || state.goal.goal;
        if (!(goalText || '').trim()) { alert('先に目標を入力してください'); return; }
        aiGoalTasksBtn.disabled = true;
        aiGoalTasksBtn.textContent = '考え中…';
        try {
          const res = await fetch(CLAUDE_PROXY_ENDPOINT, {
            method: 'POST',
            body: JSON.stringify({ action: 'goalTasks', payload: { goal: goalText } })
          });
          const data = await res.json();
          if (!data.ok) throw new Error(data.error || 'タスクの生成に失敗しました');
          // 既に文字が入ってるタスクは残し、空欄タスクだけをAI生成タスクで置き換える
          const filledTasks = state.goal.tasks.filter(t => (t.text || '').trim());
          const newTasks = data.tasks.map(text => ({ id: newTaskId(), text, important: false }));
          state.goal.tasks = [...filledTasks, ...newTasks].slice(0, 8);
          state.goal.goal = goalText;
          state.goalTasksExpanded = true;
          await saveGoal();
          renderGoal();
        } catch (e) {
          console.error('[ai-goal-tasks] failed:', e);
          alert('タスクの生成に失敗しました。もう一度お試しください。');
        }
        aiGoalTasksBtn.disabled = false;
        aiGoalTasksBtn.textContent = '🤖 AIでタスクを自動作成';
      };
    }
  }
  let goalSaveTimer = null;
  function scheduleGoalSave() {
    const status = document.getElementById('goal-save-status');
    if (status) status.textContent = '…';
    clearTimeout(goalSaveTimer);
    goalSaveTimer = setTimeout(saveGoal, 700);
  }
  async function saveGoal() {
    const goalText = document.getElementById('goal-text');
    if (goalText) state.goal.goal = goalText.value;
    document.querySelectorAll('.goal-task-input').forEach(inp => { state.goal.tasks[parseInt(inp.dataset.i)].text = inp.value; });
    const status = document.getElementById('goal-save-status');
    if (status) status.textContent = '保存中…';
    try {
      const { _idsGenerated, ...toSave } = state.goal;
      await kvSet(goalKey(state.playerId, state.selected), JSON.stringify(toSave));
      if (status) status.textContent = '保存しました';
    } catch (e) { if (status) status.textContent = '保存に失敗しました'; }
  }
  async function saveGoalDone() {
    const status = document.getElementById('goal-save-status');
    if (status) status.textContent = '保存中…';
    try {
      await kvSet(`goalDone:${state.playerId}:${state.selected}`, JSON.stringify(state.goalDoneToday || []));
      if (status) status.textContent = '保存しました';
    } catch (e) { if (status) status.textContent = '保存に失敗しました'; }
  }

  async function loadEntry() {
    const panel = document.getElementById('panel');
    panel.innerHTML = `<div class="empty-hint">読み込み中…</div>`;
    const key = `entry:${state.playerId}:${state.selected}`;
    const seenPrefix = `seen:${state.playerId}:${state.selected}:coach:`;
    const [entryRes, lastReadEpoch, remindRes, seenListRes] = await Promise.all([
      kvGet(key).catch(() => null),
      getLastRead(state.playerId, state.selected, state.role),
      !isCoach ? kvGet(`remind:${state.playerId}:${state.selected}`).catch(() => null) : Promise.resolve(null),
      kvList(seenPrefix, true).catch(() => ({ docs: [] })),
    ]);
    let data = null;
    try { if (entryRes && entryRes.value) data = JSON.parse(entryRes.value); } catch (e) { data = null; }
    if (!data) data = emptyEntry();
    if (data.gameGood === undefined) data.gameGood = '';
    if (data.gameIssue === undefined) data.gameIssue = '';
    if (data.condition === undefined) data.condition = null;
    if (data.weather === undefined) data.weather = null;
    if (data.mind === undefined) data.mind = null;
    if (data.skill === undefined) data.skill = null;
    if (data.body === undefined) data.body = null;
    if (data.goodComment === undefined) data.goodComment = '';
    if (data.issueComment === undefined) data.issueComment = '';
    if (data.gameGoodComment === undefined) data.gameGoodComment = '';
    if (data.gameIssueComment === undefined) data.gameIssueComment = '';
    if (data.playerUpdatedAt === undefined) data.playerUpdatedAt = null;
    if (data.important === undefined) data.important = false;
    state.entry = data;
    state.lastReadEpoch = lastReadEpoch;
    state.videoTarget = { mode: 'self', uids: [], categoryIds: [] };
    state.menuTarget = { mode: 'self', uids: [], categoryIds: [] };
    state.remindTarget = { mode: 'all', uids: [], categoryIds: [] };
    state.remindActive = !isCoach && !!(remindRes && remindRes.value);

    const seenEntries = (seenListRes.docs || []).map(d => {
      try { const v = JSON.parse(d.value); return v && v.ts ? { uid: d.key.split(':').pop(), ...v } : null; }
      catch (e) { return null; }
    }).filter(Boolean);
    state.seenByCoach = {};
    seenEntries.forEach(e => { state.seenByCoach[e.uid] = e; });
    state.seenPickerOpen = false;

    state.otherSeenNotice = '';
    if (!isCoach) {
      const latest = seenEntries.sort((a, b) => b.ts - a.ts)[0];
      if (latest && latest.ts > (lastReadEpoch || 0)) {
        state.otherSeenNotice = `✓ ${latest.name || 'コーチ'}が見たよと伝えました`;
      }
    }
    renderPanel();
    renderSeenRow();
    setLastRead(state.playerId, state.selected, state.role);
  }

  function renderSeenRow() {
    const row = document.getElementById('seen-row');
    if (!row) return;
    if (!isCoach) {
      if (!state.otherSeenNotice) { row.style.display = 'none'; row.innerHTML = ''; return; }
      row.style.display = '';
      row.innerHTML = `<div><div class="seen-other-notice">${state.otherSeenNotice}</div></div>`;
      return;
    }
    row.style.display = '';
    const seenListHtml = COACHES.map(c => {
      const seen = !!state.seenByCoach[c.uid];
      return `<span class="seen-coach-item ${seen ? 'seen' : ''}">${seen ? '✓' : '・'} ${escapeHtml(c.name)}</span>`;
    }).join('');
    row.innerHTML = `
      <div class="seen-block">
        <div class="seen-summary">
          <div class="seen-label">この記録を見たよ</div>
          <div class="seen-coach-list">${seenListHtml}</div>
        </div>
        <button type="button" class="seen-toggle-btn" id="seen-toggle-btn">${state.seenPickerOpen ? '閉じる' : '見たよを記録'}</button>
      </div>
      ${state.seenPickerOpen ? `
        <div class="seen-picker">
          <div class="seen-picker-label">自分の名前を選んでね</div>
          ${COACHES.map(c => `
            <button type="button" class="seen-picker-opt ${state.seenByCoach[c.uid] ? 'active' : ''}" data-uid="${c.uid}">${state.seenByCoach[c.uid] ? '✓ ' : ''}${escapeHtml(c.name)}</button>
          `).join('')}
        </div>
      ` : ''}
    `;
    document.getElementById('seen-toggle-btn').onclick = () => {
      state.seenPickerOpen = !state.seenPickerOpen;
      renderSeenRow();
    };
    row.querySelectorAll('.seen-picker-opt').forEach(btn => {
      btn.onclick = async () => {
        const uid = btn.dataset.uid;
        const coach = COACHES.find(c => c.uid === uid);
        const already = !!state.seenByCoach[uid];
        const seenKey = `seen:${state.playerId}:${state.selected}:coach:${uid}`;
        try {
          if (already) {
            await kvSet(seenKey, '');
            delete state.seenByCoach[uid];
          } else {
            const entry = { ts: Date.now(), name: coach ? coach.name : 'コーチ' };
            await kvSet(seenKey, JSON.stringify(entry));
            state.seenByCoach[uid] = entry;
          }
        } catch (e) {}
        renderSeenRow();
      };
    });
  }

  function emptyEntry() {
    return { menu: '', good: '', issue: '', gameGood: '', gameIssue: '', videos: [], thread: [], condition: null, weather: null, mind: null, skill: null, body: null, goodComment: '', issueComment: '', gameGoodComment: '', gameIssueComment: '', playerUpdatedAt: null, important: false };
  }
  async function mergeIntoOtherEntry(uid, mutateFn) {
    const key = `entry:${uid}:${state.selected}`;
    let data = null;
    try {
      const res = await kvGet(key);
      if (res && res.value) data = JSON.parse(res.value);
    } catch (e) { data = null; }
    if (!data) data = emptyEntry();
    if (!data.videos) data.videos = [];
    mutateFn(data);
    await kvSet(key, JSON.stringify(data));
    const dt = state.selected.split('-');
    delete state.calCache[`${uid}:${dt[0]}-${dt[1]}`]; // 送信先のキャッシュも古くなるため無効化
  }
  function resolveTargetUids(target) {
    if (target.mode === 'all') return TEAM.map(r => r.uid);
    if (target.mode === 'category') {
      const uids = new Set([state.playerId]);
      (target.categoryIds || []).forEach(cid => {
        const g = CATEGORIES.groups.find(g => g.id === cid);
        if (g) g.memberUids.forEach(u => uids.add(u));
      });
      return [...uids];
    }
    if (target.mode === 'pick') return [state.playerId, ...target.uids];
    return [state.playerId];
  }
  async function distributeVideo(video) {
    state.entry.videos.push(video);
    await saveEntry();
    if (isCoach) {
      const others = resolveTargetUids(state.videoTarget).filter(uid => uid !== state.playerId);
      for (const uid of others) {
        await mergeIntoOtherEntry(uid, (data) => { data.videos.push({ ...video }); });
      }
    }
  }
  async function broadcastPracticeEnd(target) {
    const now = String(Date.now());
    const uids = resolveTargetUids(target);
    for (const uid of uids) {
      await kvSet(`remind:${uid}:${state.selected}`, now);
    }
  }
