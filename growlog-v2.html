function escapeHtml(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
// カレンダーに丸を付けるかどうかの判定：ドキュメントが存在するだけでなく、
// 体調・練習メニュー・良かった点／改善点・動画・やり取りなど、実質的な中身が
// 何か入っているかどうかを見る（★重要フラグだけが立ってるケースなどを除外するため）。
// boot()の中だけでなく、離脱後の生徒画面（renderRemovedStudentScreen）からも使うため、
// どちらからも呼べるようにトップレベルで定義する。
function hasEntryContent(data) {
  if (!data) return false;
  const textFields = [data.menu, data.good, data.issue, data.gameGood, data.gameIssue];
  if (textFields.some(v => (v || '').trim())) return true;
  if (Array.isArray(data.videos) && data.videos.length) return true;
  if (Array.isArray(data.thread) && data.thread.length) return true;
  if (data.condition !== null && data.condition !== undefined) return true;
  if (data.weather !== null && data.weather !== undefined) return true;
  if (data.mind !== null && data.mind !== undefined) return true;
  if (data.skill !== null && data.skill !== undefined) return true;
  if (data.body !== null && data.body !== undefined) return true;
  return false;
}

async function boot(user, profile) {
  const isCoach = profile.role === 'coach';
  let TEAM = [{ uid: user.uid, name: profile.displayName, photo: profile.photo || null }];
  let COACHES = [{ uid: user.uid, name: profile.displayName, photo: profile.photo || null }];
  const PHOTO_BY_UID = { [user.uid]: profile.photo || null };
  let CATEGORIES = { groups: [] };
  if (isCoach) {
    const q = query(collection(db, 'users'), where('teamCode', '==', profile.teamCode), where('role', '==', 'student'));
    const snaps = await getDocs(q);
    const members = [];
    snaps.forEach(d => members.push({ uid: d.id, name: d.data().displayName, photo: d.data().photo || null, loginType: d.data().loginType || 'email', loginId: d.data().loginId || '' }));
    if (members.length) TEAM = members;

    const coachQ = query(collection(db, 'users'), where('teamCode', '==', profile.teamCode), where('role', '==', 'coach'));
    const coachSnaps = await getDocs(coachQ);
    const coachMembers = [];
    coachSnaps.forEach(d => coachMembers.push({ uid: d.id, name: d.data().displayName, photo: d.data().photo || null }));
    if (coachMembers.length) COACHES = coachMembers;

    try {
      const catRes = await kvGet(`categories:${profile.teamCode}`);
      if (catRes && catRes.value) {
        const parsed = JSON.parse(catRes.value);
        if (parsed.groups) CATEGORIES = parsed;
      }
    } catch (e) {}
  }

  // コメント欄などに表示する写真（選手・コーチ）
  TEAM.forEach(m => { PHOTO_BY_UID[m.uid] = m.photo || null; });
  COACHES.forEach(c => { PHOTO_BY_UID[c.uid] = c.photo || null; });
  const COACH_PHOTO_BY_NAME = {};
  COACHES.forEach(c => { if (c.name) COACH_PHOTO_BY_NAME[c.name] = c.photo || null; });
  if (!isCoach && profile.teamCode) {
    try {
      const cq = query(collection(db, 'users'), where('teamCode', '==', profile.teamCode), where('role', '==', 'coach'));
      const cs = await getDocs(cq);
      cs.forEach(d => {
        PHOTO_BY_UID[d.id] = d.data().photo || null;
        if (d.data().displayName) COACH_PHOTO_BY_NAME[d.data().displayName] = d.data().photo || null;
      });
    } catch (e) {}
  }

  const today = todayParts();
  const state = {
    playerId: TEAM[0].uid,
    role: isCoach ? 'coach' : 'player',
    myName: profile.displayName,
    year: today.y, month: today.m,
    selected: dateKey(today.y, today.m, today.d),
    entry: null, calExpanded: false, gameExpanded: false, remindActive: false,
    videoTarget: { mode: 'self', uids: [], categoryIds: [] }, menuTarget: { mode: 'self', uids: [], categoryIds: [] },
    remindTarget: { mode: 'all', uids: [], categoryIds: [] },
    seenByCoach: {}, seenPickerOpen: false, goalTasksExpanded: true,
    view: 'home',
    calCache: {}, // 月ごとの取得結果をメモリにキャッシュ（同じ月に戻った時の再取得を避ける）
  };

  renderLauncher();

  // ── トップ画面（Netflix風）：日替わり名言と、2つの入り口 ──
  function renderLauncher() {
    const qd = todaysQuote();
    app.innerHTML = `
      <div class="launcher">
        <div class="launcher-top"><span class="brand-badge">Self+</span><span class="launcher-hello">${escapeHtml(profile.displayName || '')}さん、今日も積み重ねよう</span></div>
        <div class="launcher-main">
        ${qd ? `
        <div class="quote-card">
          <div class="quote-eyebrow">TODAY'S WORD</div>
          <div class="quote-text">${phraseHtml(qd.c)}</div>
          <div class="quote-who">${escapeHtml(qd.name)}${qd.field ? `<span class="quote-field">${escapeHtml(qd.field)}</span>` : ''}</div>
          ${qd.n && qd.n.length ? `<div class="quote-note">${phraseHtml(qd.n)}</div>` : ''}
        </div>` : ''}
        <div class="launcher-tiles-area">
          <div class="launcher-tiles">
            <button type="button" class="launcher-tile" id="tile-diary">
              <span class="launcher-icon"><img src="${LAUNCHER_LOGO_IMG}" alt=""></span>
              <span class="launcher-label">日記を記入</span>
            </button>
            <button type="button" class="launcher-tile" id="tile-athlete">
              <span class="launcher-icon"><img src="${LAUNCHER_ATHLETE_IMG}" alt=""></span>
              <span class="launcher-label">アスリートへの質問</span>
            </button>
          </div>
        </div>
        </div>
        <div class="launcher-footer">
          <div class="switch-code" id="launch-settings">設定</div>
          <div class="switch-code" id="launch-logout">ログアウト</div>
        </div>
        ${legalLinksHtml()}
      </div>
    `;
    document.getElementById('tile-diary').onclick = () => { if (!isCoach) state.view = 'home'; render(); };
    document.getElementById('tile-athlete').onclick = () => openProQuestionModal(profile);
    document.getElementById('launch-settings').onclick = () => { render().then(() => openSettingsModal()); };
    document.getElementById('launch-logout').onclick = () => signOut(auth);
    wireLegalLinks(app);
  }

  async function render() {
    const player = TEAM.find(r => r.uid === state.playerId);
    const showHome = !isCoach && state.view === 'home';
    const showCalToggle = isCoach || (!isCoach && state.view === 'detail');
    app.innerHTML = `
      <div class="head">
        <div class="head-text">
          <div class="head-eyebrow"><span class="brand-badge" id="brand-to-top" role="button" aria-label="トップへ" style="cursor:pointer;">Self+</span>${escapeHtml(profile.sport || '')}</div>
          <div class="head-title" id="head-title">${player ? avatarHtml(player.photo, player.name) + `<span class="head-name">${escapeHtml(player.name)}さん</span>` : ''}</div>
        </div>
        ${showCalToggle ? `<button class="head-cal-btn" id="head-cal-btn" aria-label="カレンダーを開く"><img class="head-cal-img" src="${HEAD_CAL_ICON}" alt=""></button>` : ''}
      </div>
      <div class="wrap">
        ${isCoach ? `<input class="ptab-search" id="ptab-search" placeholder="選手を検索">` : ''}
        ${isCoach ? `<div class="ptabs" id="ptabs"></div>` : ''}
        ${showHome ? `<div class="dream-card" id="dream-card"><div class="goal-loading">読み込み中…</div></div>` : ''}
        <div class="cal" id="cal"></div>
        ${!showHome ? `
          <div class="goal-card" id="goal-card"><div class="goal-loading">読み込み中…</div></div>
          <div class="seen-row" id="seen-row"></div>
          <div class="panel" id="panel"></div>
        ` : ''}
        <div class="footer-links">
          <div class="switch-code" id="settings-link">設定</div>
          <div class="switch-code" id="logout-link">ログアウト</div>
          ${isNativeApp ? '' : '<div class="portal-link" id="portal-link">プラン・支払い管理</div>'}
          
          <div class="contact-link" id="contact-link">お問い合わせ</div>
        </div>
        ${legalLinksHtml()}
      </div>
    `;
    document.getElementById('settings-link').onclick = () => openSettingsModal();
    document.getElementById('logout-link').onclick = () => signOut(auth);
    const portalLinkEl = document.getElementById('portal-link');
    if (portalLinkEl) portalLinkEl.onclick = () => openPortal();
    document.getElementById('contact-link').onclick = () => openContactModal(profile, state);
    const brandToTop = document.getElementById('brand-to-top');
    if (brandToTop) brandToTop.onclick = () => renderLauncher();
    wireLegalLinks(app);
    const calBtn = document.getElementById('head-cal-btn');
    if (calBtn) calBtn.onclick = () => { state.calExpanded = !state.calExpanded; renderCalendar(); };
    const titleEl = document.getElementById('head-title');
    if (titleEl && !isCoach && state.view === 'detail') {
      titleEl.style.cursor = 'pointer';
      titleEl.onclick = () => goHome();
    }
    if (isCoach) renderTabs();
    const ptabSearch = document.getElementById('ptab-search');
    if (ptabSearch) {
      ptabSearch.oninput = () => {
        const q = ptabSearch.value.trim();
        document.querySelectorAll('#ptabs .ptab').forEach(btn => {
          btn.style.display = btn.textContent.includes(q) ? '' : 'none';
        });
      };
    }
    if (showHome) {
      state.calExpanded = true;
      await renderCalendar();
      await loadDream();
    } else {
      state.calExpanded = false;
      await renderCalendar();
        await loadGoal();
      await loadEntry();
    }
  }

  async function goHome() {
    state.view = 'home';
    await render();
  }

  async function openDate(dateStr) {
    state.selected = dateStr;
    const dt = dateStr.split('-');
    state.year = parseInt(dt[0]); state.month = parseInt(dt[1]) - 1;
    state.view = 'detail';
    await render();
  }

  async function selectDate(dateStr) {
    state.selected = dateStr;
    const dt = dateStr.split('-');
    state.year = parseInt(dt[0]); state.month = parseInt(dt[1]) - 1;
    state.calExpanded = false;
    const headDateEl = document.getElementById('head-date-label');
    if (headDateEl && !isCoach && state.view === 'detail') headDateEl.textContent = formatSelectedLabel(state.selected);
    await renderCalendar();
    await loadGoal();
    await loadEntry();
  }

  async function loadDream() {
    let dream = { text: '' };
    try {
      const res = await kvGet(`dream:${state.playerId}`);
      if (res && res.value) dream = JSON.parse(res.value);
    } catch (e) {}
    state.dream = dream;
    renderDream();
  }
  function renderDream() {
    const box = document.getElementById('dream-card');
    if (!box) return;
    box.innerHTML = `
      <div class="goal-label">🌟 叶える目標</div>
      <input class="goal-input" id="dream-text" value="${escapeAttr(state.dream.text)}">
      <span class="save-status" id="dream-save-status"></span>
    `;
    document.getElementById('dream-text').addEventListener('input', scheduleDreamSave);
  }
  let dreamSaveTimer = null;
  function scheduleDreamSave() {
    const status = document.getElementById('dream-save-status');
    if (status) status.textContent = '';
    clearTimeout(dreamSaveTimer);
    dreamSaveTimer = setTimeout(saveDream, 700);
  }
  async function saveDream() {
    const textEl = document.getElementById('dream-text');
    if (textEl) state.dream.text = textEl.value;
    const status = document.getElementById('dream-save-status');
    if (status) status.textContent = '';
    try {
      await kvSet(`dream:${state.playerId}`, JSON.stringify(state.dream));
      if (status) status.textContent = '';
    } catch (e) { if (status) status.textContent = '保存に失敗しました'; }
  }

  function renderTabs() {
    const wrap = document.getElementById('ptabs');
    wrap.innerHTML = TEAM.map(r => `<button class="ptab ${r.uid === state.playerId ? 'active' : ''}" data-id="${r.uid}">${r.name}</button>`).join('');
    wrap.querySelectorAll('.ptab').forEach(btn => {
      btn.onclick = async () => {
        state.playerId = btn.dataset.id;
        const titleEl = document.getElementById('head-title');
        if (titleEl) { const pl = TEAM.find(r => r.uid === state.playerId); titleEl.innerHTML = avatarHtml(pl.photo, pl.name) + `<span class="head-name">${escapeHtml(pl.name)}さん</span>`; }
        renderTabs();
        state.calExpanded = false;
        await renderCalendar();
        await loadGoal();
        await loadEntry();
      };
    });
  }

  async function renderCalendar() {
    const cal = document.getElementById('cal');
    if (!cal) return;
    const homeMode = !isCoach && state.view === 'home';
    const y = state.year, m = state.month;
    const first = new Date(y, m, 1);
    const startDow = first.getDay();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const prevDays = new Date(y, m, 0).getDate();
    const dows = ['日', '月', '火', '水', '木', '金', '土'];
    let cells = '';
    for (let i = 0; i < startDow; i++) cells += `<div class="cal-cell out">${prevDays - startDow + i + 1}</div>`;
    const t = todayParts();
    for (let d = 1; d <= daysInMonth; d++) {
      const key = dateKey(y, m, d);
      const isToday = t.y === y && t.m === m && t.d === d;
      cells += `<div class="cal-cell ${isToday ? 'today' : ''}" data-date="${key}">
        <span class="cal-star" data-star-date="${key}">☆</span>
        <span>${d}</span><span class="dot" style="visibility:hidden" data-dot="${key}"></span>
      </div>`;
    }
    const totalCells = startDow + daysInMonth;
    const trailing = (7 - (totalCells % 7)) % 7;
    for (let i = 1; i <= trailing; i++) cells += `<div class="cal-cell out">${i}</div>`;
    const gridHtml = `
      <div class="cal-head">
        <div class="cal-nav"><button id="prevM">‹</button></div>
        <div class="cal-title">${y}年 ${m + 1}月</div>
        <div class="cal-nav-right">${(t.y !== y || t.m !== m) ? `<button class="cal-today-btn" id="cal-today">今日</button>` : ''}<button id="nextM">›</button></div>
      </div>
      <div class="cal-grid">${dows.map(d => `<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
      <div class="cal-loading" id="cal-loading" style="visibility:hidden;">読み込み中…</div>
      <div class="cal-hint">日付を長押しすると、試合の日に⭐マーク</div>
    `;
    if (homeMode) {
      cal.innerHTML = gridHtml + `
        <div class="match-box">
          <div class="match-box-label">🏆 ${m + 1}月の試合</div>
          <div id="match-list"><div class="match-empty">読み込み中…</div></div>
        </div>`;
    } else {
      cal.innerHTML = `
        <div class="cal-compact" id="cal-compact">
          <span class="cal-compact-label">${formatSelectedLabel(state.selected)}</span>
        </div>
        ${state.calExpanded ? `<div class="cal-grid-wrap">${gridHtml}</div>` : ''}
      `;
    }
    const todayBtn = document.getElementById('cal-today');
    if (todayBtn) todayBtn.onclick = async () => {
      const tp = todayParts();
      state.year = tp.y; state.month = tp.m;
      await renderCalendar();
    };
    const prevBtn = document.getElementById('prevM');
    if (prevBtn) prevBtn.onclick = async () => { state.month--; if (state.month < 0) { state.month = 11; state.year--; } await renderCalendar(); };
    const nextBtn = document.getElementById('nextM');
    if (nextBtn) nextBtn.onclick = async () => { state.month++; if (state.month > 11) { state.month = 0; state.year++; } await renderCalendar(); };
    cal.querySelectorAll('.cal-cell[data-date]').forEach(c => {
      let pressTimer = null;
      let longPressed = false;
      const startPress = () => {
        longPressed = false;
        pressTimer = setTimeout(() => {
          longPressed = true;
          if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }
          const starEl = c.querySelector('.cal-star');
          toggleCalendarImportant(c.dataset.date, starEl);
        }, 500);
      };
      const cancelPress = () => { clearTimeout(pressTimer); };
      c.addEventListener('pointerdown', startPress);
      c.addEventListener('pointerup', cancelPress);
      c.addEventListener('pointerleave', cancelPress);
      c.addEventListener('pointercancel', cancelPress);
      c.onclick = () => {
        if (longPressed) { longPressed = false; return; }
        homeMode ? openDate(c.dataset.date) : selectDate(c.dataset.date);
      };
    });
    const loadingEl = document.getElementById('cal-loading');
    const cacheKey = `${state.playerId}:${y}-${pad(m + 1)}`;
    const cached = state.calCache[cacheKey];
    if (cached) {
      // 同じ月をすでに読み込み済みなら、通信せずキャッシュから即表示する
      cached.dateStrs.forEach(dateStr => {
        const dotEl = cal.querySelector(`[data-dot="${dateStr}"]`);
        if (dotEl) dotEl.style.visibility = 'visible';
      });
      state.monthEntries = cached.entryCache;
      state.monthKey = cacheKey;
      await markUnreadDots(cached.dateStrs, cached.entryCache);
      markImportantStars(cached.entryCache);
      if (homeMode) renderMatchList();
      return;
    }
    if (loadingEl) loadingEl.style.visibility = 'visible';
    try {
      const dateStrs = [];
      const entryCache = {}; // dateStr -> パース済みentryデータ（markUnreadDotsでの再取得を避けるため）
      // 一覧クエリ(list)はFirestoreのルール上「本当に安全か」を事前証明する必要があり、
      // 今回のルール（get()を使った間接判定を含む複雑なOR条件）だと、たとえ自分自身のデータでも
      // 証明が不安定でpermission-deniedになることがあるため使わない。
      // 個別取得(get)は都度そのドキュメント単体で権限判定されるため確実に動く。
      // 未来の日付にも「試合の日（⭐）」と試合名が保存されていることがあるため、月の全日付を読み込む。
      // （以前は未来の日付を読み込み対象から外していたため、未来の⭐が月の切り替えで消えて見えていた）
      const days = Array.from({ length: daysInMonth }, (_, i) => i + 1);
      const results = await Promise.all(days.map(async (d) => {
        const dateStr = dateKey(y, m, d);
        try {
          const r = await kvGet(`entry:${state.playerId}:${dateStr}`);
          if (!r || !r.value) return null;
          let parsed = null;
          try { parsed = JSON.parse(r.value); } catch (e) { return null; }
          entryCache[dateStr] = parsed;
          return hasEntryContent(parsed) ? dateStr : null;
        } catch (e) { return null; }
      }));
      results.forEach(dateStr => {
        if (!dateStr) return;
        dateStrs.push(dateStr);
        const dotEl = cal.querySelector(`[data-dot="${dateStr}"]`);
        if (dotEl) dotEl.style.visibility = 'visible';
      });
      // 今月はまだ記録が増えていく途中なので、月をまたいだ後のキャッシュのみ対象にする
      // （過去月は原則もう変わらないため安全にキャッシュできる。今月は毎回取り直す）
      if (!(t.y === y && t.m === m)) {
        state.calCache[cacheKey] = { dateStrs, entryCache };
      }
      state.monthEntries = entryCache;
      state.monthKey = cacheKey;
      await markUnreadDots(dateStrs, entryCache);
      markImportantStars(entryCache);
      if (homeMode) renderMatchList();
    } catch (e) {
      console.error('[calendar] renderCalendar failed:', e);
      console.error('[calendar] debug: state.playerId =', state.playerId, ' user.uid =', user.uid, ' match =', state.playerId === user.uid, ' isCoach =', isCoach, ' role =', state.role);
    } finally {
      if (loadingEl) loadingEl.style.visibility = 'hidden';
    }
  }

  // 読み込んだ月のデータから、⭐（試合の日）をすべて表示する（記録の中身がない日も含む）
  function markImportantStars(entryCache) {
    Object.keys(entryCache || {}).forEach(dateStr => {
      const data = entryCache[dateStr];
      if (!data || !data.important) return;
      const cellEl = document.querySelector(`.cal-cell[data-date="${dateStr}"]`);
      if (cellEl) cellEl.classList.add('important');
      const starEl = document.querySelector(`.cal-star[data-star-date="${dateStr}"]`);
      if (starEl) { starEl.textContent = '★'; starEl.classList.add('active'); }
    });
  }
  // 1日分の変更を、表示中の月のデータとキャッシュの両方に反映する
  function updateMonthEntry(dateStr, data) {
    const monthKey = `${state.playerId}:${dateStr.slice(0, 7)}`;
    if (state.monthKey === monthKey && state.monthEntries) state.monthEntries[dateStr] = data;
    const cached = state.calCache[monthKey];
    if (cached) cached.entryCache[dateStr] = data;
  }

  // カレンダー下の「〇月の試合」一覧（選手のホーム画面）。⭐の日を日付順に並べ、試合名をその場で編集できる
  const matchSaveTimers = {};
  function renderMatchList() {
    const list = document.getElementById('match-list');
    if (!list) return;
    const entries = state.monthEntries || {};
    const dates = Object.keys(entries).filter(d => entries[d] && entries[d].important).sort();
    if (!dates.length) {
      list.innerHTML = `<div class="match-empty">日付を長押しすると、ここに試合の日が追加されます</div>`;
      return;
    }
    list.innerHTML = dates.map(d => `
      <div class="match-row">
        <div class="match-row-date">${formatSelectedLabel(d)}</div>
        <input class="goal-input" data-match-date="${d}" placeholder="試合名（例：秋季大会1回戦）" value="${escapeAttr(entries[d].matchName || '')}">
        <span class="save-status" data-match-status="${d}"></span>
      </div>`).join('');
    list.querySelectorAll('input[data-match-date]').forEach(input => {
      input.oninput = () => {
        const d = input.dataset.matchDate;
        const status = list.querySelector(`[data-match-status="${d}"]`);
        if (status) status.textContent = '…';
        clearTimeout(matchSaveTimers[d]);
        matchSaveTimers[d] = setTimeout(() => saveCalendarMatchName(d, input.value.trim()), 800);
      };
    });
  }
  async function saveCalendarMatchName(dateStr, name) {
    const status = document.querySelector(`[data-match-status="${dateStr}"]`);
    if (status) status.textContent = '保存中…';
    try {
      const key = `entry:${state.playerId}:${dateStr}`;
      const res = await kvGet(key);
      const data = (res && res.value) ? JSON.parse(res.value) : emptyEntry();
      data.matchName = name;
      data.important = true;
      await kvSet(key, JSON.stringify(data));
      updateMonthEntry(dateStr, data);
      if (state.selected === dateStr && state.entry) { state.entry.matchName = name; state.entry.important = true; }
      const st = document.querySelector(`[data-match-status="${dateStr}"]`);
      if (st) st.textContent = '';
    } catch (e) {
      const st = document.querySelector(`[data-match-status="${dateStr}"]`);
      if (st) st.textContent = '保存に失敗';
    }
  }

  async function toggleCalendarImportant(dateStr, starEl) {
    try {
      let data = null;
      const res = await kvGet(`entry:${state.playerId}:${dateStr}`);
      if (res && res.value) data = JSON.parse(res.value);
      if (!data) data = emptyEntry();
      data.important = !data.important;
      await kvSet(`entry:${state.playerId}:${dateStr}`, JSON.stringify(data));
      updateMonthEntry(dateStr, data);
      renderMatchList();
      if (starEl) {
        starEl.textContent = data.important ? '★' : '☆';
        starEl.classList.toggle('active', data.important);
      }
      const cellEl = starEl ? starEl.closest('.cal-cell') : document.querySelector(`.cal-cell[data-date="${dateStr}"]`);
      if (cellEl) cellEl.classList.toggle('important', data.important);
      // 今開いてる日付なら、記入画面側のボタンも同期させる
      if (state.selected === dateStr && state.entry) {
        state.entry.important = data.important;
        const panelBtn = document.getElementById('important-toggle');
        if (panelBtn) {
          panelBtn.textContent = data.important ? '★ 試合の日' : '☆ 試合の日にする';
          panelBtn.classList.toggle('active', data.important);
        }
      }
    } catch (e) {
      alert('更新に失敗しました。もう一度お試しください。');
    }
  }

  async function markUnreadDots(dateStrs, entryCache) {
    await Promise.all(dateStrs.map(async (dateStr) => {
      try {
        const cached = entryCache && entryCache[dateStr];
        const [data, lastReadEpoch] = await Promise.all([
          cached ? Promise.resolve(cached) : kvGet(`entry:${state.playerId}:${dateStr}`).then(r => (r && r.value) ? JSON.parse(r.value) : null),
          getLastRead(state.playerId, dateStr, state.role),
        ]);
        if (!data) return;
        const cellEl = document.querySelector(`.cal-cell[data-date="${dateStr}"]`);
        if (cellEl) cellEl.classList.toggle('important', !!data.important);
        const starEl = document.querySelector(`.cal-star[data-star-date="${dateStr}"]`);
        if (starEl && data.important) { starEl.textContent = '★'; starEl.classList.add('active'); }
        const dotEl = document.querySelector(`[data-dot="${dateStr}"]`);
        if (dotEl) {
          const opt = CONDITION_OPTS.find(o => o.v === data.condition);
          if (opt) {
            dotEl.textContent = opt.icon;
            dotEl.classList.add('dot-face');
          }
        }
        if (!data.thread || !data.thread.length) return;
        const last = data.thread[data.thread.length - 1];
        if (last.author === state.role) return;
        if (last.tsRaw && last.tsRaw > lastReadEpoch) {
          if (dotEl) { dotEl.style.visibility = 'visible'; dotEl.classList.add('dot-unread'); }
        }
      } catch (e) { console.error('[calendar] markUnreadDots failed for', dateStr, ':', e); }
    }));
  }
  async function getLastRead(playerId, date, role) {
    try {
      const res = await kvGet(`lastread:${playerId}:${date}:${role}`);
      if (res && res.value) return parseInt(res.value, 10) || 0;
    } catch (e) {}
    return 0;
  }
  async function setLastRead(playerId, date, role) {
    try { await kvSet(`lastread:${playerId}:${date}:${role}`, String(Date.now())); } catch (e) {}
  }

  function goalKey(playerId, dateStr) {
    const ym = dateStr.slice(0, 7); // "2026-09-21" -> "2026-09"
    return `goal:${playerId}:${ym}`;
  }
  async function getGoal(playerId, dateStr) {
    try {
      const res = await kvGet(goalKey(playerId, dateStr));
      if (res && res.value) return JSON.parse(res.value);
    } catch (e) {}
    // 移行措置：月ごとに分ける前の共通データ（goal:uid）は、
    // 「今まさに使ってる月（今日を含む月）」のときだけ初期値として引き継ぐ。
    // それ以外の月（未来の月や、他の過去月）は常に白紙から始める。
    const t = todayParts();
    const thisMonthStr = `${t.y}-${pad(t.m + 1)}`;
    if (dateStr.slice(0, 7) === thisMonthStr) {
      try {
        const legacy = await kvGet(`goal:${playerId}`);
        if (legacy && legacy.value) return JSON.parse(legacy.value);
      } catch (e) {}
    }
    return { goal: '', tasks: [] };
  }
  function newTaskId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function normalizeGoalTasks(goal) {
    let tasks = goal.tasks || [];
    let generatedId = false;
    // 旧形式（文字列の配列）からの移行、およびid未付与のタスクへのid付与
    // （完了チェックを日付ごとに記録するため、タスクを一意に特定できるidが必要）
    tasks = tasks.map(t => {
      if (typeof t === 'string') { generatedId = true; return { id: newTaskId(), text: t, important: false }; }
      if (!t.id) { generatedId = true; t = { ...t, id: newTaskId() }; }
      delete t.done; // 完了状態は日付ごとの別ドキュメントで管理するため、タスク本体からは削除
      return t;
    });
    while (tasks.length < 3) { tasks.push({ id: newTaskId(), text: '', important: false }); generatedId = true; }
    goal.tasks = tasks;
    goal._idsGenerated = generatedId;
    return goal;
  }
  async function getGoalDone(playerId, dateStr) {
    try {
      const res = await kvGet(`goalDone:${playerId}:${dateStr}`);
      if (res && res.value) return JSON.parse(res.value);
    } catch (e) {}
    return [];
  }
  async function loadGoal() {
    state.goal = normalizeGoalTasks(await getGoal(state.playerId, state.selected));
    state.goalDoneToday = await getGoalDone(state.playerId, state.selected);
    if (state.goalTasksExpanded === undefined) state.goalTasksExpanded = true;
    renderGoal();
    if (state.goal._idsGenerated) { saveGoal().catch(() => {}); } // 新規付与したidを保存しておく
  }
  function renderGoal() {
    const box = document.getElementById('goal-card');
    if (!box) return;
    const tasks = state.goal.tasks;
    const doneSet = new Set(state.goalDoneToday || []);
    const doneCount = tasks.filter(t => t.text.trim() && doneSet.has(t.id)).length;
    const totalCount = tasks.filter(t => t.text.trim()).length;
    const importantIdx = [];
    const normalIdx = [];
    tasks.forEach((t, i) => (t.important ? importantIdx : normalIdx).push(i));
    const shownIdx = tasks.map((_, i) => i); // ⭐（重要）での絞り込みは廃止し、常に全件表示
    const hiddenCount = tasks.length - shownIdx.length;
    function taskRowHtml(i) {
      const t = tasks[i];
      const done = doneSet.has(t.id);
      return `
        <div class="goal-task-row ${done ? 'done' : ''}">
          <div class="goal-task-check" data-check="${i}">${done ? '✓' : ''}</div>
          <input class="goal-task-input" data-i="${i}" placeholder="やること ${i + 1}" value="${escapeAttr(t.text)}">
          ${i >= 3 ? `<button class="goal-task-del" data-i="${i}">✕</button>` : ''}
        </div>`;
    }
    box.innerHTML = `
      <div class="goal-label">🎯 月間目標</div>
      <input class="goal-input" id="goal-text" placeholder="目標を書こう" value="${escapeAttr(state.goal.goal)}">
      <div class="goal-tasks-label">そのためにやること<button type="button" class="goal-ai-btn" id="ai-goal-tasks-btn">🤖 AIでタスクを自動作成</button></div>
      <div class="goal-tasks" id="goal-tasks">
        ${shownIdx.map(i => taskRowHtml(i)).join('')}
      </div>
      <div class="goal-foot">
        <button class="goal-add-btn" id="goal-add-task">＋ やることを追加</button>
        <span>${totalCount ? `<span class="goal-progress">${doneCount}/${totalCount} 達成</span>` : ''}<span class="save-status" id="goal-save-status"></span></span>
      </div>
    `;
    document.getElementById('goal-text').addEventListener('input', scheduleGoalSave);
    box.querySelectorAll('.goal-task-input').forEach(inp => inp.addEventListener('input', scheduleGoalSave));
    box.querySelectorAll('.goal-task-del').forEach(btn => {
      btn.onclick = () => { state.goal.tasks.splice(parseInt(btn.dataset.i), 1); renderGoal(); saveGoal(); };
    });
    box.querySelectorAll('.goal-task-check').forEach(chk => {
      chk.onclick = () => {
        const i = parseInt(chk.dataset.check);
        const id = state.goal.tasks[i].id;
        const set = new Set(state.goalDoneToday || []);
        if (set.has(id)) set.delete(id); else set.add(id);
        state.goalDoneToday = [...set];
        renderGoal(); saveGoalDone();
      };
    });
    box.querySelectorAll('.goal-task-star').forEach(star => {
      star.onclick = () => {
        const i = parseInt(star.dataset.star);
        state.goal.tasks[i].important = !state.goal.tasks[i].important;
        renderGoal(); saveGoal();
      };
    });
    const expandBtn = document.getElementById('goal-expand-btn');
    if (expandBtn) expandBtn.onclick = () => { state.goalTasksExpanded = true; renderGoal(); };
    const collapseBtn = document.getElementById('goal-collapse-btn');
    if (collapseBtn) collapseBtn.onclick = () => { state.goalTasksExpanded = false; renderGoal(); };
    document.getElementById('goal-add-task').onclick = () => { state.goal.tasks.push({ id: newTaskId(), text: '', important: false }); state.goalTasksExpanded = true; renderGoal(); };
    const aiGoalTasksBtn = document.getElementById('ai-goal-tasks-btn');
    if (aiGoalTasksBtn) {
      aiGoalTasksBtn.onclick = async () => {
        const goalTextEl = document.getElementById('goal-text');
        const goalText = (goalTextEl && goalTextEl.value) || state.goal.goal;
        if (!(goalText || '').trim()) { alert('先に目標を入力してください'); return; }
        aiGoalTasksBtn.disabled = true;
        aiGoalTasksBtn.textContent = '考え中…';
        try {
          const res = await fetch(CLAUDE_PROXY_ENDPOINT, {
            method: 'POST',
            body: JSON.stringify({ action: 'goalTasks', payload: { goal: goalText } })
          });
          const data = await res.json();
          if (!data.ok) throw new Error(data.error || 'タスクの生成に失敗しました');
          // 既に文字が入ってるタスクは残し、空欄タスクだけをAI生成タスクで置き換える
          const filledTasks = state.goal.tasks.filter(t => (t.text || '').trim());
          const newTasks = data.tasks.map(text => ({ id: newTaskId(), text, important: false }));
          state.goal.tasks = [...filledTasks, ...newTasks].slice(0, 8);
          state.goal.goal = goalText;
          state.goalTasksExpanded = true;
          await saveGoal();
          renderGoal();
        } catch (e) {
          console.error('[ai-goal-tasks] failed:', e);
          alert('タスクの生成に失敗しました。もう一度お試しください。');
        }
        aiGoalTasksBtn.disabled = false;
        aiGoalTasksBtn.textContent = '🤖 AIでタスクを自動作成';
      };
    }
  }

    const status = document.getElementById('goal-save-status');

      await kvSet(goalKey(state.playerId, state.selected), JSON.stringify(toSave));
      if (status) status.textContent = '';

  async function loadEntry() {
    const panel = document.getElementById('panel');
    panel.innerHTML = `<div class="empty-hint">読み込み中…</div>`;
    const key = `entry:${state.playerId}:${state.selected}`;
    const seenPrefix = `seen:${state.playerId}:${state.selected}:coach:`;
    const [entryRes, lastReadEpoch, remindRes, seenListRes] = await Promise.all([
      kvGet(key).catch(() => null),
      getLastRead(state.playerId, state.selected, state.role),
      !isCoach ? kvGet(`remind:${state.playerId}:${state.selected}`).catch(() => null) : Promise.resolve(null),
      kvList(seenPrefix, true).catch(() => ({ docs: [] })),
    ]);
    let data = null;
    try { if (entryRes && entryRes.value) data = JSON.parse(entryRes.value); } catch (e) { data = null; }
    if (!data) data = emptyEntry();
    if (data.gameGood === undefined) data.gameGood = '';
    if (data.gameIssue === undefined) data.gameIssue = '';
    if (data.condition === undefined) data.condition = null;
    if (data.weather === undefined) data.weather = null;
    if (data.mind === undefined) data.mind = null;
    if (data.skill === undefined) data.skill = null;
    if (data.body === undefined) data.body = null;
    if (data.goodComment === undefined) data.goodComment = '';
    if (data.issueComment === undefined) data.issueComment = '';
    if (data.gameGoodComment === undefined) data.gameGoodComment = '';
    if (data.gameIssueComment === undefined) data.gameIssueComment = '';
    if (data.playerUpdatedAt === undefined) data.playerUpdatedAt = null;
    if (data.important === undefined) data.important = false;
    state.entry = data;
    state.lastReadEpoch = lastReadEpoch;
    state.videoTarget = { mode: 'self', uids: [], categoryIds: [] };
    state.menuTarget = { mode: 'self', uids: [], categoryIds: [] };
    state.remindTarget = { mode: 'all', uids: [], categoryIds: [] };
    state.remindActive = !isCoach && !!(remindRes && remindRes.value);

    const seenEntries = (seenListRes.docs || []).map(d => {
      try { const v = JSON.parse(d.value); return v && v.ts ? { uid: d.key.split(':').pop(), ...v } : null; }
      catch (e) { return null; }
    }).filter(Boolean);
    state.seenByCoach = {};
    seenEntries.forEach(e => { state.seenByCoach[e.uid] = e; });
    state.seenPickerOpen = false;

    state.otherSeenNotice = '';
    if (!isCoach) {
      const latest = seenEntries.sort((a, b) => b.ts - a.ts)[0];
      if (latest && latest.ts > (lastReadEpoch || 0)) {
        state.otherSeenNotice = `✓ ${latest.name || 'コーチ'}が見たよと伝えました`;
      }
    }
    renderPanel();
    renderSeenRow();
    setLastRead(state.playerId, state.selected, state.role);
  }

  function renderSeenRow() {
    const row = document.getElementById('seen-row');
    if (!row) return;
    if (!isCoach) {
      if (!state.otherSeenNotice) { row.style.display = 'none'; row.innerHTML = ''; return; }
      row.style.display = '';
      row.innerHTML = `<div><div class="seen-other-notice">${state.otherSeenNotice}</div></div>`;
      return;
    }
    row.style.display = '';
    const seenListHtml = COACHES.map(c => {
      const seen = !!state.seenByCoach[c.uid];
      return `<span class="seen-coach-item ${seen ? 'seen' : ''}">${seen ? '✓' : '・'} ${escapeHtml(c.name)}</span>`;
    }).join('');
    row.innerHTML = `
      <div class="seen-block">
        <div class="seen-summary">
          <div class="seen-label">この記録を見たよ</div>
          <div class="seen-coach-list">${seenListHtml}</div>
        </div>
        <button type="button" class="seen-toggle-btn" id="seen-toggle-btn">${state.seenPickerOpen ? '閉じる' : '見たよを記録'}</button>
      </div>
      ${state.seenPickerOpen ? `
        <div class="seen-picker">
          <div class="seen-picker-label">自分の名前を選んでね</div>
          ${COACHES.map(c => `
            <button type="button" class="seen-picker-opt ${state.seenByCoach[c.uid] ? 'active' : ''}" data-uid="${c.uid}">${state.seenByCoach[c.uid] ? '✓ ' : ''}${escapeHtml(c.name)}</button>
          `).join('')}
        </div>
      ` : ''}
    `;
    document.getElementById('seen-toggle-btn').onclick = () => {
      state.seenPickerOpen = !state.seenPickerOpen;
      renderSeenRow();
    };
    row.querySelectorAll('.seen-picker-opt').forEach(btn => {
      btn.onclick = async () => {
        const uid = btn.dataset.uid;
        const coach = COACHES.find(c => c.uid === uid);
        const already = !!state.seenByCoach[uid];
        const seenKey = `seen:${state.playerId}:${state.selected}:coach:${uid}`;
        try {
          if (already) {
            await kvSet(seenKey, '');
            delete state.seenByCoach[uid];
          } else {
            const entry = { ts: Date.now(), name: coach ? coach.name : 'コーチ' };
            await kvSet(seenKey, JSON.stringify(entry));
            state.seenByCoach[uid] = entry;
          }
        } catch (e) {}
        renderSeenRow();
      };
    });
  }

  function emptyEntry() {
    return { menu: '', good: '', issue: '', gameGood: '', gameIssue: '', videos: [], thread: [], condition: null, weather: null, mind: null, skill: null, body: null, goodComment: '', issueComment: '', gameGoodComment: '', gameIssueComment: '', playerUpdatedAt: null, important: false };
  }
  async function mergeIntoOtherEntry(uid, mutateFn) {
    const key = `entry:${uid}:${state.selected}`;
    let data = null;
    try {
      const res = await kvGet(key);
      if (res && res.value) data = JSON.parse(res.value);
    } catch (e) { data = null; }
    if (!data) data = emptyEntry();
    if (!data.videos) data.videos = [];
    mutateFn(data);
    await kvSet(key, JSON.stringify(data));
    const dt = state.selected.split('-');
    delete state.calCache[`${uid}:${dt[0]}-${dt[1]}`]; // 送信先のキャッシュも古くなるため無効化
  }
  function resolveTargetUids(target) {
    if (target.mode === 'all') return TEAM.map(r => r.uid);
    if (target.mode === 'category') {
      const uids = new Set([state.playerId]);
      (target.categoryIds || []).forEach(cid => {
        const g = CATEGORIES.groups.find(g => g.id === cid);
        if (g) g.memberUids.forEach(u => uids.add(u));
      });
      return [...uids];
    }
    if (target.mode === 'pick') return [state.playerId, ...target.uids];
    return [state.playerId];
  }
  async function distributeVideo(video) {
    state.entry.videos.push(video);
    await saveEntry();
    if (isCoach) {
      const others = resolveTargetUids(state.videoTarget).filter(uid => uid !== state.playerId);
      for (const uid of others) {
        await mergeIntoOtherEntry(uid, (data) => { data.videos.push({ ...video }); });
      }
    }
  }
  async function broadcastPracticeEnd(target) {
    const now = String(Date.now());
    const uids = resolveTargetUids(target);
    for (const uid of uids) {
      await kvSet(`remind:${uid}:${state.selected}`, now);
    }
  }

          profile.photo = photo || null;
          PHOTO_BY_UID[auth.currentUser.uid] = photo || null;
          TEAM.forEach(m => { if (m.uid === auth.currentUser.uid) m.photo = photo || null; });
          COACHES.forEach(c => { if (c.uid === auth.currentUser.uid) c.photo = photo || null; });
          if (state.myName) COACH_PHOTO_BY_NAME[state.myName] = isCoach ? (photo || null) : COACH_PHOTO_BY_NAME[state.myName];
          const preview = document.getElementById('set-avatar-preview');
          if (preview) preview.innerHTML = avatarHtml(photo, state.myName);
          if (status) status.textContent = '保存しました';
          render();
        } catch (e) {
          console.error('avatar save failed', e);
          if (status) status.textContent = '保存に失敗しました';
        }
      };
      const avatarFile = document.getElementById('set-avatar-file');
      if (avatarFile) {
        avatarFile.onchange = async () => {
          const file = avatarFile.files && avatarFile.files[0];
          if (!file) return;
          try {
            const dataUrl = await resizeImageToDataUrl(file, 160);
            await saveAvatar(dataUrl);
          } catch (e) {
            const status = document.getElementById('set-avatar-status');
            if (status) status.textContent = 'この写真は読み込めませんでした';
          }
          avatarFile.value = '';
        };
      }
      const avatarRemove = document.getElementById('set-avatar-remove');
      if (avatarRemove) avatarRemove.onclick = () => saveAvatar(null);
      const deleteAccountBtn = document.getElementById('set-delete-account');
      if (deleteAccountBtn) {
        deleteAccountBtn.onclick = () => {
          const modal = document.getElementById('settings-overlay');
          if (modal) modal.remove();
          openDeleteAccountModal(profile);
        };
      }
      const nameSaveBtn = document.getElementById('set-name-save');
      if (nameSaveBtn) {
        nameSaveBtn.onclick = async () => {
          const newName = document.getElementById('set-name').value.trim();
          const statusEl = document.getElementById('set-name-status');
          if (!newName) { if (statusEl) statusEl.textContent = '名前を入力してください'; return; }
          nameSaveBtn.disabled = true;
          try {
            await setDoc(doc(db, 'users', auth.currentUser.uid), { displayName: newName }, { merge: true });
            // 画面の表示に使っている名前も、すべて新しい名前に置き換える
            // （以前は state.myName だけを更新していたため、画面を描き直すと古い名前に戻っていた）
            const oldName = state.myName;
            const myUid = auth.currentUser.uid;
            state.myName = newName;
            profile.displayName = newName;
            TEAM.forEach(m => { if (m.uid === myUid) m.name = newName; });
            COACHES.forEach(c => { if (c.uid === myUid) c.name = newName; });
            if (isCoach && oldName && oldName in COACH_PHOTO_BY_NAME) {
              COACH_PHOTO_BY_NAME[newName] = COACH_PHOTO_BY_NAME[oldName];
            }
            if (statusEl) statusEl.textContent = '保存しました';
            render();
          } catch (e) { if (statusEl) statusEl.textContent = '保存に失敗しました'; }
          nameSaveBtn.disabled = false;
        };
      }
      const settingsJoinBtn = document.getElementById('settings-join-btn');
      if (settingsJoinBtn) {
        settingsJoinBtn.onclick = async () => {
          const input = document.getElementById('settings-join-code');
          const msg = document.getElementById('settings-join-msg');
          if (msg) msg.innerHTML = '';
          settingsJoinBtn.disabled = true;
          settingsJoinBtn.textContent = '確認中…';
          const result = await joinTeamByCode(auth.currentUser.uid, input ? input.value : '');
          if (result.ok) {
            profile.teamCode = (input.value || '').trim().toUpperCase();
            const modal = document.getElementById('settings-overlay');
            if (modal) modal.remove();
            await routeStudent(user, profile);
          } else {
            settingsJoinBtn.disabled = false;
            settingsJoinBtn.textContent = '参加する';
            if (msg) msg.innerHTML = `<div class="pay-msg err">${escapeHtml(result.message)}</div>`;
          }
        };
      }
      const customCodeBtn = document.getElementById('set-custom-code-btn');
      if (customCodeBtn) {
        customCodeBtn.onclick = async () => {
          const msgEl = document.getElementById('set-custom-code-msg');
          const showMsg = (text, isErr) => { msgEl.innerHTML = `<div class="custom-code-msg ${isErr ? 'err' : 'ok'}">${escapeHtml(text)}</div>`; };
          const code = (document.getElementById('set-custom-code').value || '').trim().toUpperCase();
          if (!/^[A-Z0-9]{4,16}$/.test(code)) { showMsg('招待コードは、半角の英大文字と数字で4〜16文字にしてください。', true); return; }
          if (code === profile.teamCode) { showMsg('今の招待コードと同じです。', true); return; }
          const hasStudents = TEAM.some(r => r.uid !== auth.currentUser.uid);
          if (hasStudents || coachMates.length > 1) {
            showMsg('選手や他のコーチがいるチームでは、招待コードを変更できません（変更すると全員のつながりが切れるため）。必要な場合はお問い合わせください。', true);
            return;
          }
          customCodeBtn.disabled = true;
          const oldCode = profile.teamCode;
          try {
            const dupQ = query(collection(db, 'users'), where('teamCode', '==', code), where('role', '==', 'coach'));
            const dupSnaps = await getDocs(dupQ);
            if (!dupSnaps.empty) { showMsg('この招待コードは既に他の方に使用されています', true); customCodeBtn.disabled = false; return; }
            // カテゴリー設定があれば新しいコードへ引き継ぐ
            let oldCategories = null;
            try { const r = await kvGet(`categories:${oldCode}`); if (r && r.value) oldCategories = r.value; } catch (e) {}
            await setDoc(doc(db, 'users', auth.currentUser.uid), { teamCode: code }, { merge: true });
            // 保存の直後にもう一度確認（同時に同じコードを取られていないか）
            const recheck = await getDocs(dupQ);
            if (recheck.docs.some(d => d.id !== auth.currentUser.uid)) {
              await setDoc(doc(db, 'users', auth.currentUser.uid), { teamCode: oldCode }, { merge: true });
              showMsg('この招待コードは既に他の方に使用されています', true);
              customCodeBtn.disabled = false;
              return;
            }
            if (oldCategories) { try { await kvSet(`categories:${code}`, oldCategories); } catch (e) {} }
            profile.teamCode = code;
            const codeEl = document.querySelector('.invite-code');
            if (codeEl) codeEl.textContent = code;
            showMsg(`招待コードを「${code}」に変更しました。`, false);
          } catch (e) {
            showMsg('変更できませんでした。時間をおいてもう一度お試しください。', true);
          }
          customCodeBtn.disabled = false;
        };
      }
      const inviteCopyBtn = document.getElementById('set-invite-copy');
      if (inviteCopyBtn) {
        inviteCopyBtn.onclick = () => {
          navigator.clipboard.writeText(profile.teamCode).then(() => {
            inviteCopyBtn.textContent = 'コピーしました';
            setTimeout(() => { inviteCopyBtn.textContent = 'コピー'; }, 1500);
          });
        };
      }
      const addGroupBtn = document.getElementById('add-group-btn');
      if (addGroupBtn) {
        addGroupBtn.onclick = async () => {
          const input = document.getElementById('new-group-name');
          const name = input.value.trim();
          if (!name) return;
          categories.groups.push({ id: newId(), name, memberUids: [] });
          input.value = '';
          await saveCategories();
          renderBody();
        };
      }
      document.querySelectorAll('[data-group-del]').forEach(btn => {
        btn.onclick = async () => {
          const groupId = btn.dataset.groupDel;
          if (!confirm('このカテゴリーを削除しますか？')) return;
          categories.groups = categories.groups.filter(g => g.id !== groupId);
          await saveCategories();
          renderBody();
        };
      });
      document.querySelectorAll('[data-group-toggle]').forEach(cb => {
        cb.onclick = async () => {
          const [groupId, uid] = cb.dataset.groupToggle.split(':');
          const group = categories.groups.find(g => g.id === groupId);
          if (!group) return;
          if (cb.checked) { if (!group.memberUids.includes(uid)) group.memberUids.push(uid); }
          else { group.memberUids = group.memberUids.filter(u => u !== uid); }
          const countEl = document.querySelector(`[data-group-del="${groupId}"]`)?.parentElement?.querySelector('.group-count');
          if (countEl) countEl.textContent = `${group.memberUids.length}人`;
          try { await saveCategories(); } catch (e) {}
        };
      });
      document.querySelectorAll('[data-group-search]').forEach(inp => {
        inp.oninput = () => {
          const groupId = inp.dataset.groupSearch;
          const list = document.querySelector(`[data-group-members="${groupId}"]`);
          if (!list) return;
          const q = inp.value.trim();
          list.querySelectorAll('.group-member-item').forEach(item => {
            item.style.display = item.textContent.includes(q) ? '' : 'none';
          });
        };
      });
      const removeSearch = document.getElementById('remove-student-search');
      if (removeSearch) {
        removeSearch.oninput = () => {
          const list = document.getElementById('remove-student-list');
          if (!list) return;
          const q = removeSearch.value.trim();
          list.querySelectorAll('.remove-student-item').forEach(item => {
            item.style.display = (item.dataset.removeName || '').includes(q) ? '' : 'none';
          });
        };
      }
      document.querySelectorAll('[data-reset-pass]').forEach(btn => {
        btn.onclick = async () => {
          const studentUid = btn.dataset.resetPass;
          const member = TEAM.find(r => r.uid === studentUid);
          const studentName = member ? member.name : '選手';
          const newPass = prompt(`${studentName}さんの新しいパスワードを入力してください（8文字以上）`);
          if (newPass === null) return;
          if (newPass.length < 8) { alert('パスワードは8文字以上にしてください。'); return; }
          btn.disabled = true;
          const original = btn.textContent;
          btn.textContent = '再設定中…';
          try {
            const resetFn = httpsCallable(functions, 'resetStudentPassword');
            await resetFn({ studentUid, newPassword: newPass });
            alert(`再設定しました。\n${studentName}さんに、次のIDと新しいパスワードを伝えてください。\n\nID：${member ? member.loginId : ''}\nパスワード：${newPass}`);
          } catch (e) {
            alert('再設定できませんでした。時間をおいてもう一度お試しください。（' + ((e && e.message) || '') + '）');
          }
          btn.disabled = false;
          btn.textContent = original;
        };
      });
      document.querySelectorAll('[data-remove-student]').forEach(btn => {
        btn.onclick = async () => {
          const studentUid = btn.dataset.removeStudent;
          const row = btn.closest('.remove-student-item');
          const studentName = row ? row.dataset.removeName : '選手';
          if (!confirm(`${studentName}さんをチームから削除しますか？\n本人の記録は消えません。あなたの選手一覧からは外れます。`)) return;
          btn.disabled = true;
          btn.textContent = '削除中…';
          try {
            await setDoc(doc(db, 'users', studentUid), { teamCode: null, removedAt: Date.now() }, { merge: true });
            TEAM = TEAM.filter(r => r.uid !== studentUid);
            if (row) row.remove();
            if (state.playerId === studentUid && TEAM.length) {
              state.playerId = TEAM[0].uid;
              const titleEl = document.getElementById('head-title');
              if (titleEl) titleEl.textContent = TEAM[0].name + 'さん';
            }
            renderTabs();
          } catch (e) {
            btn.disabled = false;
            btn.textContent = '削除';
            alert('削除に失敗しました。もう一度お試しください。');
          }
        };
      });
    }

    renderBody();
  }


  function renderPanel() {

    const e = state.entry;
    panel.innerHTML = `
      ${isCoach ? `

          <button class="practice-end-btn" id="practice-end-btn">📣 「書いてね」を送る</button>

          ${isCoach ? `${targetPickerHtml('menu', state.menuTarget)}<div class="menu-send-row"><button class="menu-send-btn" id="menu-send-btn">保存</button><span class="menu-send-status" id="menu-send-status"></span></div>` : ''}</div>
        <div class="rec-block good"><div class="card-label">◎ よかった点 <span class="save-status" id="save-status"></span></div>

        <div class="video-list" id="video-list">

        </div>
        <input id="v-title" class="video-title-shared" placeholder="動画タイトル">
        <div class="video-add"><input id="v-url" placeholder="外部URL"><button id="v-add">追加</button></div>

          <span class="v-drop-icon">🎥</span>
          <div class="v-drop-main">自分の端末からタップして動画を選ぶ</div>

        <div class="video-board" id="v-board">

          <div class="video-status" id="v-status">準備中…</div>

      ${!isCoach ? `

        ${e.submittedAt ? `<div class="submit-note">最終登録：${formatDateTime(e.submittedAt)}</div>` : ''}
      </div>` : ''}
      <div class="thread-card">
        <div class="thread-title">メッセージ</div>
        ${threadNoticeHtml(e)}
        <div class="thread" id="thread">${e.thread.length ? e.thread.map((m, i) => threadMsgHtml(m, i)).join('') : '<div class="thread-empty">まだメッセージはありません</div>'}</div>

      </div>

      const title = document.getElementById('v-title').value.trim();
      const url = document.getElementById('v-url').value.trim();
      if (!url) return;
      await distributeVideo({ title, url });
      renderPanel();
    };
    setupVideoUpload();
    const submitBtn = document.getElementById('submit-btn');
    if (submitBtn) {
      submitBtn.onclick = async () => {
        clearTimeout(autoSaveTimer);
        submitBtn.disabled = true;
        submitBtn.textContent = '登録中…';
        const prev = state.entry.submittedAt;
        // 次のアップデートで、この submittedAt の更新をきっかけにコーチへ通知する
        state.entry.submittedAt = Date.now();
        const ok = await saveEntry();
        if (ok === false) {
          state.entry.submittedAt = prev;
          submitBtn.disabled = false;
          submitBtn.textContent = '登録に失敗しました。もう一度押してください';
          return;
        }
        renderPanel();
      };
    }
    const matchNameEl = document.getElementById('f-match-name');
    if (matchNameEl) {
      matchNameEl.addEventListener('input', () => {
        state.entry.matchName = matchNameEl.value.trim();
        scheduleAutoSave();
      });
    }
    const importantBtn = document.getElementById('important-toggle');
    if (importantBtn) {
      importantBtn.onclick = () => {
        state.entry.important = !state.entry.important;
        const cellEl = document.querySelector(`.cal-cell[data-date="${state.selected}"]`);
        if (cellEl) cellEl.classList.toggle('important', state.entry.important);
        renderPanel();
        scheduleAutoSave();
      };
    }
    panel.querySelectorAll('.video-del').forEach(btn => {
      btn.onclick = () => {
        const i = parseInt(btn.dataset.i);
        const removed = state.entry.videos[i];
        state.entry.videos.splice(i, 1);
        renderPanel();
        scheduleAutoSave();
        // Bunny Stream側の実ファイルも削除（失敗しても記録上は既に消えているので、ベストエフォート）
        if (removed && removed.videoId) {
          fetch(BUNNY_PROXY_ENDPOINT, {
            method: 'POST',
            body: JSON.stringify({ action: 'deleteVideo', videoId: removed.videoId })
          }).then(res => {
            if (!res.ok) console.error('[video-delete] Bunny側の削除に失敗しました（記録上は削除済み）:', removed.videoId, res.status);
          }).catch(err => {
            console.error('[video-delete] Bunny側の削除リクエスト自体が失敗しました（記録上は削除済み）:', removed.videoId, err);
          });
        }
      };
    });
    panel.querySelectorAll('.tri-opt').forEach(opt => {
      opt.onclick = () => {
        state.entry[opt.dataset.group] = parseInt(opt.dataset.value, 10);
        renderPanel();
        scheduleAutoSave();
      };
    });
    const practiceEndBtn = document.getElementById('practice-end-btn');
    if (practiceEndBtn) {
      practiceEndBtn.onclick = async () => {
        practiceEndBtn.disabled = true;
        practiceEndBtn.textContent = '送信中…';
        try {
          await broadcastPracticeEnd(state.remindTarget);
          practiceEndBtn.textContent = '✓ 送りました';
          practiceEndBtn.classList.add('sent');
        } catch (e) {
          practiceEndBtn.textContent = '送信に失敗しました。もう一度お試しください。';
          practiceEndBtn.disabled = false;
        }
      };
    }
    const menuSendBtn = document.getElementById('menu-send-btn');
    if (menuSendBtn) {
      menuSendBtn.onclick = async () => {
        const text = document.getElementById('f-menu').value;
        state.entry.menu = text;
        const status = document.getElementById('menu-send-status');
        menuSendBtn.disabled = true;
        if (status) status.textContent = '保存中…';
        try {
          await saveEntry();
          const others = resolveTargetUids(state.menuTarget).filter(uid => uid !== state.playerId);
          for (const uid of others) {
            await mergeIntoOtherEntry(uid, (data) => { data.menu = text; });
          }
          if (status) status.textContent = '保存しました';
        } catch (e) {
          if (status) status.textContent = '保存に失敗しました';
        }
        menuSendBtn.disabled = false;
        setTimeout(() => { if (status) status.textContent = ''; }, 2500);
      };
    }
    function getTargetByPrefix(prefix) {
      if (prefix === 'video') return state.videoTarget;
      if (prefix === 'menu') return state.menuTarget;
      if (prefix === 'remind') return state.remindTarget;
      return null;
    }
    panel.querySelectorAll('.send-target-opt').forEach(btn => {
      btn.onclick = () => {
        const target = getTargetByPrefix(btn.dataset.prefix);
        target.mode = btn.dataset.mode;
        renderPanel();
      };
    });
    panel.querySelectorAll('.send-target-list input[type="checkbox"][data-uid]').forEach(cb => {
      cb.onchange = () => {
        const target = getTargetByPrefix(cb.dataset.prefix);
        if (cb.checked) { if (!target.uids.includes(cb.dataset.uid)) target.uids.push(cb.dataset.uid); }
        else { target.uids = target.uids.filter(u => u !== cb.dataset.uid); }
      };
    });
    panel.querySelectorAll('.send-target-list input[type="checkbox"][data-cat-id]').forEach(cb => {
      cb.onchange = () => {
        const target = getTargetByPrefix(cb.dataset.catPrefix);
        if (!target.categoryIds) target.categoryIds = [];
        if (cb.checked) { if (!target.categoryIds.includes(cb.dataset.catId)) target.categoryIds.push(cb.dataset.catId); }
        else { target.categoryIds = target.categoryIds.filter(id => id !== cb.dataset.catId); }
      };
    });
    panel.querySelectorAll('.send-target-search').forEach(inp => {
      inp.oninput = () => {
        const list = panel.querySelector(`.send-target-list[data-prefix="${inp.dataset.prefix}"]`);
        if (!list) return;
        const q = inp.value.trim();
        list.querySelectorAll('.send-target-item').forEach(item => {
          item.style.display = item.textContent.includes(q) ? '' : 'none';
        });
      };
    });
    ['f-menu', 'f-good', 'f-good-comment', 'f-issue', 'f-issue-comment', 'f-game-good', 'f-game-good-comment', 'f-game-issue', 'f-game-issue-comment'].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      autosizeTextarea(el);
      if (el.readOnly) return;
      el.addEventListener('input', () => { autosizeTextarea(el); scheduleAutoSave(); });
    });
    document.getElementById('t-send').onclick = () => sendThread();
    document.querySelectorAll('[data-msg-del]').forEach(btn => {
      btn.onclick = () => {
        const m = state.entry.thread[Number(btn.dataset.msgDel)];
        if (m) confirmDeleteMessage(m);
      };
    });
  }

  function autosizeTextarea(el) { el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; }
  let autoSaveTimer = null;
  function scheduleAutoSave() {
    const status = document.getElementById('save-status');
    if (status) status.textContent = '';
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(() => { saveEntry(); }, 700);
  }
  function setupVideoUpload() {
    const drop = document.getElementById('v-drop');
    const fileInput = document.getElementById('v-file');
    const filenameEl = document.getElementById('v-filename');
    const uploadBtn = document.getElementById('v-upload-btn');
    const board = document.getElementById('v-board');
    const fill = document.getElementById('v-fill');
    const statusTxt = document.getElementById('v-status');
    const errorBox = document.getElementById('v-err');
    const titleInput = document.getElementById('v-title');
    if (!drop) return;
    let selectedFile = null;

    drop.addEventListener('click', () => fileInput.click());
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('drag'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
    drop.addEventListener('drop', (e) => {
      e.preventDefault();
      drop.classList.remove('drag');
      if (e.dataTransfer.files.length) selectFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => { if (fileInput.files.length) selectFile(fileInput.files[0]); });

    function showError(msg) { errorBox.textContent = msg; errorBox.classList.add('show'); }
    function hideError() { errorBox.classList.remove('show'); }

    function selectFile(file) {
      hideError();
      if (!file.type.startsWith('video/')) { showError('動画ファイルを選んでください。'); return; }
      if (file.size > 3 * 1024 * 1024 * 1024) { showError('ファイルサイズが3GBを超えています。さすがに大きすぎるので、動画を分割するかご相談ください。'); return; }
      selectedFile = file;
      filenameEl.textContent = `${file.name}（${(file.size / 1024 / 1024).toFixed(1)}MB）`;
      uploadBtn.disabled = false;
    }

    uploadBtn.addEventListener('click', () => { if (selectedFile) handleUpload(selectedFile); });

    async function handleUpload(file) {
      hideError();
      uploadBtn.disabled = true;
      board.classList.add('show');
      fill.style.width = '0%';
      statusTxt.textContent = 'アップロード準備中…';
      try {
        const uploaded = await uploadToBunny(file, (pct) => {
          fill.style.width = pct + '%';
          statusTxt.textContent = `アップロード中… ${pct}%`;
        });
        statusTxt.textContent = '追加中…';
        await distributeVideo({
          title: titleInput.value.trim(),
          url: uploaded.embedUrl,
          hlsUrl: uploaded.hlsUrl,
          videoId: uploaded.videoId,
          uploadedAt: Date.now()
        });
        statusTxt.textContent = '追加しました！（動画は変換処理中です。少し待ってから開いてください）';
        fill.style.width = '100%';
        selectedFile = null;
        setTimeout(() => { board.classList.remove('show'); renderPanel(); }, 2500);
      } catch (err) {
        console.error(err);
        board.classList.remove('show');
        uploadBtn.disabled = false;
        showError('失敗しました。もう一度お試しください。（' + (err.message || err) + '）');
      }
    }

    function uploadToBunny(file, onProgress) {
      return new Promise(async (resolve, reject) => {
        try {
          // ① Apps Scriptにアップロード許可証（署名付きトークン）を発行してもらう
          const initRes = await fetch(BUNNY_PROXY_ENDPOINT, {
            method: 'POST',
            body: JSON.stringify({ action: 'createUpload', title: file.name })
          });
          const init = await initRes.json();
          if (!init.ok) { reject(new Error(init.error || 'アップロード準備に失敗しました')); return; }

          // ② TUSプロトコルでBunny Streamへ直接・再開可能アップロード
          const upload = new tus.Upload(file, {
            endpoint: init.uploadEndpoint,
            retryDelays: [0, 3000, 5000, 10000, 20000],
            chunkSize: 5 * 1024 * 1024,
            metadata: { filetype: file.type, title: file.name },
            headers: {
              AuthorizationSignature: init.authorizationSignature,
              AuthorizationExpire: String(init.authorizationExpire),
              VideoId: init.videoId,
              LibraryId: init.libraryId
            },
            onError: (error) => reject(error),
            onProgress: (bytesUploaded, bytesTotal) => {
              onProgress(Math.round((bytesUploaded / bytesTotal) * 100));
            },
            onSuccess: () => {
              resolve({
                videoId: init.videoId,
                libraryId: init.libraryId,
                hlsUrl: `https://${init.cdnHostname}/${init.videoId}/playlist.m3u8`,
                embedUrl: `https://iframe.mediadelivery.net/embed/${init.libraryId}/${init.videoId}`
              });
            }
          });

          const prevUploads = await upload.findPreviousUploads();
          if (prevUploads.length > 0) upload.resumeFromPreviousUpload(prevUploads[0]);
          upload.start();
        } catch (err) {
          reject(err);
        }
      });
    }
  }

  function threadNoticeHtml(e) {
    if (!e.thread || !e.thread.length) return '';
    const last = e.thread[e.thread.length - 1];
    if (last.author === state.role) return '';
    if (!last.tsRaw || last.tsRaw <= (state.lastReadEpoch || 0)) return '';
    const who = state.role === 'coach' ? (last.authorName || '選手') : 'コーチ';
    return `<div class="thread-notice">🔔 ${escapeHtml(who)}から新しいメッセージが届きました</div>`;
  }
  // 自分が送ったメッセージか（複数コーチがいても本人だけ取り消せるよう、送信者のuidで判定する。
  //  uidが記録されていない古いメッセージは、役割と名前が一致する場合のみ本人とみなす）
  function isOwnMessage(m) {
    if (m.authorUid) return m.authorUid === auth.currentUser.uid;
    return m.author === state.role && m.authorName === state.myName;
  }
  function sameMessage(a, b) {
    return a.tsRaw === b.tsRaw && a.author === b.author && a.text === b.text && (a.authorUid || '') === (b.authorUid || '');
  }
  function threadMsgHtml(m, idx) {
    const mine = m.author === state.role;
    const canDelete = isOwnMessage(m) && typeof idx === 'number';
    const label = m.authorName || (m.author === 'coach' ? 'コーチ' : '本人');
    const isNew = !mine && m.tsRaw && m.tsRaw > (state.lastReadEpoch || 0);
    const photo = m.author === 'coach'
      ? ((m.authorUid && PHOTO_BY_UID[m.authorUid]) || COACH_PHOTO_BY_NAME[m.authorName] || null)
      : (PHOTO_BY_UID[state.playerId] || null);
    return `<div class="msg ${mine ? 'mine' : ''}"><div class="msg-meta">${avatarHtml(photo, label)}${escapeHtml(label)} ・ ${m.ts} ${isNew ? '<span class="new-badge">NEW</span>' : ''}${canDelete ? `<button type="button" class="msg-del" data-msg-del="${idx}">取り消す</button>` : ''}</div><div class="msg-bubble">${escapeHtml(m.text)}</div></div>`;
  }
  async function saveEntry() {
    if (!isCoach) state.entry.menu = document.getElementById('f-menu').value; // コーチのメニューは「保存」ボタンで保存
    state.entry.good = document.getElementById('f-good').value;
    state.entry.issue = document.getElementById('f-issue').value;
    const gameGoodEl = document.getElementById('f-game-good');
    const gameIssueEl = document.getElementById('f-game-issue');
    if (gameGoodEl) state.entry.gameGood = gameGoodEl.value;
    if (gameIssueEl) state.entry.gameIssue = gameIssueEl.value;
    if (state.role === 'coach') {
      state.entry.goodComment = document.getElementById('f-good-comment').value;
      state.entry.issueComment = document.getElementById('f-issue-comment').value;
      const gameGoodCommentEl = document.getElementById('f-game-good-comment');
      const gameIssueCommentEl = document.getElementById('f-game-issue-comment');
      if (gameGoodCommentEl) state.entry.gameGoodComment = gameGoodCommentEl.value;
      if (gameIssueCommentEl) state.entry.gameIssueComment = gameIssueCommentEl.value;
    }
    if (!isCoach) {
      state.entry.playerUpdatedAt = Date.now();
    }
    const key = `entry:${state.playerId}:${state.selected}`;
    const status = document.getElementById('save-status');
    if (status) status.textContent = '';
    try {
      await kvSet(key, JSON.stringify(state.entry));
      if (status) status.textContent = '';
      const dt = state.selected.split('-');
      const cacheKey = `${state.playerId}:${dt[0]}-${dt[1]}`;
      delete state.calCache[cacheKey]; // 保存内容が古いキャッシュに埋もれないようにする
      const dotEl = document.querySelector(`[data-dot="${state.selected}"]`);
      if (dotEl) {
        dotEl.style.visibility = 'visible';
        const opt = CONDITION_OPTS.find(o => o.v === state.entry.condition);
        if (opt) { dotEl.textContent = opt.icon; dotEl.classList.add('dot-face'); }
      }
      if (!isCoach && state.remindActive) {
        state.remindActive = false;
        kvSet(`remind:${state.playerId}:${state.selected}`, '').catch(() => {});
        const banner = document.querySelector('.remind-banner');
        if (banner) banner.remove();
      }
      return true;
    } catch (e) { if (status) status.textContent = '保存に失敗しました'; return false; }
  }
  // メッセージの取り消し：確認 → 最新のデータを読み直して該当メッセージだけを除いて保存
  // （相手が直前に書いたメッセージを消してしまわないよう、画面上の古いデータではなく最新データから削除する）
  function confirmDeleteMessage(m) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-card">
        <div class="modal-title">このメッセージを取り消しますか？</div>
        <div class="delete-warn" style="white-space:pre-wrap;">${escapeHtml(m.text.length > 120 ? m.text.slice(0, 120) + '…' : m.text)}</div>
        <div class="auth-hint" style="margin-bottom:12px;">取り消したメッセージは、相手の画面からも消えます。元に戻すことはできません。</div>
        <div id="msg-del-status"></div>
        <div class="modal-actions">
          <button class="modal-btn modal-btn-cancel" id="msg-del-cancel">やめる</button>
          <button class="modal-btn modal-btn-danger" id="msg-del-ok">取り消す</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const close = () => overlay.remove();
    overlay.addEventListener('click', (ev) => { if (ev.target === overlay) close(); });
    document.getElementById('msg-del-cancel').onclick = close;
    const okBtn = document.getElementById('msg-del-ok');
    okBtn.onclick = async () => {
      okBtn.disabled = true;
      okBtn.textContent = '取り消し中…';
      try {
        await deleteThreadMessage(m);
        close();
      } catch (e) {
        console.error('message delete failed', e);
        document.getElementById('msg-del-status').innerHTML = `<div class="pay-msg err">取り消せませんでした。電波の良い場所でもう一度お試しください。</div>`;
        okBtn.disabled = false;
        okBtn.textContent = '取り消す';
      }
    };
  }
  async function deleteThreadMessage(m) {
    if (!isOwnMessage(m)) return; // 念のため：他人のメッセージは消さない
    const key = `entry:${state.playerId}:${state.selected}`;
    const res = await kvGet(key);
    const latest = (res && res.value) ? JSON.parse(res.value) : null;
    if (!latest) return;
    const latestThread = Array.isArray(latest.thread) ? latest.thread : [];
    const filtered = latestThread.filter(x => !sameMessage(x, m));
    latest.thread = filtered;
    await kvSet(key, JSON.stringify(latest));
    // 画面側のデータも最新のやり取りに合わせる（この後の自動保存で消したメッセージが復活しないように）
    state.entry.thread = filtered;
    const dt = state.selected.split('-');
    delete state.calCache[`${state.playerId}:${dt[0]}-${dt[1]}`];
    renderPanel();
  }
  async function sendThread() {
    const input = document.getElementById('t-input');
    const text = input.value.trim();
    if (!text) return;
    const now = new Date();
    const ts = `${pad(now.getMonth() + 1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    state.entry.thread.push({ author: state.role, authorName: state.myName, authorUid: auth.currentUser.uid, text, ts, tsRaw: now.getTime() });
    input.value = '';
    await saveEntry();
    await setLastRead(state.playerId, state.selected, state.role);
    renderPanel();
  }
  function escapeHtml(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function escapeAttr(s) { return escapeHtml(s); }
}
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
