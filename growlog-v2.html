<style>
:root {
  --bg: #F5F3EE; --surface: #FFFFFF; --surface2: #FAF8F4; --border: #E4DFD5; --border2: #D3CCBE;
  --navy: #1B2A45; --navy2: #121E33; --navy-light: #EDF0F5;
  --text: #1A1A1A; --text2: #3F3F3F; --text3: #555555; --text-faint: #A8A399;
  --blue: #2F6FD6; --blue-light: #EEF4FD; --red: #D64545; --red-light: #FDEFEF; --line-green: #8DE36A;
  --green: #3A6B4C; --green-light: #EEF4EF; --rust: #B5562C; --rust-light: #FBF0EA; --stitch: #B0402C;
  --radius: 14px; --radius-sm: 9px;
  --splash-bg: #1B2A45; --splash-gap: #1B2A45;
  /* 役割ごとの変数（テーマで上書きする） */
  --header-bg: var(--navy); --header-text: #FFFFFF; --header-sub: #D5DCE8;
  --page-bg: var(--navy);
  --on-primary: #FFFFFF;
  --primary-grad: var(--navy);
  --primary-glow: none;
  --card-bg: var(--surface);
  --card-shadow: none;
  --focus-ring: none;
  --bubble-mine-text: var(--text);
  --badge-bg: rgba(255,255,255,0.14); --badge-text: #FFFFFF;
  --font-body: 'Noto Sans JP', sans-serif;
  --font-display: 'Zen Kaku Gothic New', sans-serif;
  --font-num: 'DM Mono', monospace;
  --font-latin: 'Noto Sans JP', sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page-bg); color: var(--text); font-family: var(--font-body); -webkit-font-smoothing: antialiased; padding-bottom: 40px; }

.plus-mark { position: relative; display: inline-block; width: 0.62em; height: 0.62em; margin-left: 0.09em; vertical-align: -0.08em; }
.plus-mark::before, .plus-mark::after { content: ''; position: absolute; background: var(--plus-color, #FF7A2E); border-radius: 1px; }
.plus-mark::before { width: 100%; height: 26%; top: 50%; left: 0; transform: translateY(-50%); }
.plus-mark::after { height: 100%; width: 26%; left: 50%; top: 0; transform: translateX(-50%); }

/* ---- 起動スプラッシュ（シネマティック版） ----
   0.0-0.8s  S と＋が合体した状態で登場
   0.9-2.3s  S は左へ、＋は右へ開き、＋が一瞬光る
   1.6-2.7s  間から elf がフェードインして Self+ が完成
   2.9s-     アプリの準備ができたら、手前に迫りながら消える（.exit） */
#introSplash { position: fixed; inset: 0; z-index: 9999; background: var(--splash-bg, var(--header-bg));
  display: flex; align-items: center; justify-content: center; overflow: hidden; }
#introSplash.exit { animation: splashBgOut 0.7s ease 0.1s forwards; pointer-events: none; }
/* 字体はアイコンの「S」と同じ Helvetica 系（iPhone では Helvetica Neue Bold）。端末内蔵フォントなので起動直後から崩れない */
.intro-logo { display: inline-flex; align-items: center; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 700;
  font-size: min(19vw, 100px); line-height: 1; color: #F2F2F2; letter-spacing: -0.015em;
  -webkit-text-stroke: 0.018em #F2F2F2; text-shadow: 0 0.025em 0.05em rgba(0,0,0,0.55);
  opacity: 0; transform: scale(0.9);
  animation: logoIn 0.8s cubic-bezier(.2,.8,.2,1) forwards; will-change: transform, opacity; }
.il-s { display: inline-block; }
.il-elf { display: inline-block; overflow: hidden; max-width: 0; white-space: nowrap;
  animation: elfOpen 1.4s cubic-bezier(.65,0,.25,1) 0.9s forwards; }
.il-elf > span { display: inline-block; opacity: 0; letter-spacing: -0.12em; filter: blur(6px);
  animation: elfIn 1.1s cubic-bezier(.2,.8,.2,1) 1.6s forwards; }
.il-s, .il-elf { position: relative; z-index: 1; }
/* ＋はアイコンと同じく、右下に少し重なる「外枠だけ」のネオン。重なった所は背景色で切り抜く */
.il-plus { position: relative; z-index: 2; display: inline-flex; margin-left: -0.17em; transform: translateY(0.2em); }
.il-plus-svg { width: 0.66em; height: 0.66em; overflow: visible; display: block; }
.ilp-gap { fill: var(--splash-gap, #121212); stroke: var(--splash-gap, #121212); stroke-width: 16; stroke-linejoin: round; }
.ilp-line, .ilp-glow { fill: none; stroke: var(--plus-color, #FF7A2E); stroke-linejoin: round; }
.ilp-line { stroke-width: 6.5; }
.ilp-glow { stroke-width: 12; opacity: 0.75; animation: plusPulse 1.2s ease-out 0.95s both; }
#introSplash.exit .intro-logo { animation: logoOut 0.8s cubic-bezier(.4,0,.2,1) forwards; }
@keyframes logoIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
@keyframes elfOpen { from { max-width: 0; } to { max-width: 1.6em; } }
@keyframes elfIn { from { opacity: 0; letter-spacing: -0.12em; filter: blur(6px); } to { opacity: 1; letter-spacing: 0; filter: blur(0); } }
@keyframes plusPulse { 0% { opacity: 0.75; } 40% { opacity: 1; } 100% { opacity: 0.85; } }
@keyframes logoOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(1.35); } }
@keyframes splashBgOut { to { opacity: 0; } }
/* ---- スプラッシュ：ロゴを少し上に置き、完成後に下からスポンサー表記を出す（ロゴの動き自体はそのまま） ---- */
.intro-stack { display: flex; flex-direction: column; align-items: center; transform: translateY(-2vh); }
.intro-sponsor { margin-top: clamp(40px, 8vh, 72px); display: flex; flex-direction: column; align-items: center; gap: 10px;
  opacity: 0; transform: translateY(22px) scale(0.86);
  animation: sponsorIn 0.7s cubic-bezier(.2,.8,.2,1) 2.8s forwards; }
.sp-label { font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif; font-size: 11px; letter-spacing: 0.24em; padding-left: 0.24em; color: #9AA3AE; text-transform: uppercase; }
.sp-icon { width: 64px; height: 64px; border-radius: 14px; display: block; box-shadow: 0 6px 18px rgba(0,0,0,0.45); }
.sp-name { font-family: 'Noto Sans JP', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.06em; color: #E6E8EB; }
@keyframes sponsorIn { to { opacity: 1; transform: translateY(0) scale(1); } }
#introSplash.exit .intro-sponsor { animation: sponsorOut 0.5s ease forwards; }
@keyframes sponsorOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .intro-logo, .il-elf, .il-elf > span, .ilp-glow, .intro-sponsor { animation-duration: 0.01s !important; animation-delay: 0s !important; }
}
.mono { font-family: var(--font-num); } .disp { font-family: var(--font-display); }
.head { background: var(--header-bg); color: var(--header-text); padding: calc(12px + env(safe-area-inset-top)) 18px 13px; border-bottom: 3px solid var(--stitch); position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.head-cal-btn { flex-shrink: 0; width: 64px; height: 64px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); font-size: 32px; cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center; }
.head-text { flex: 1; min-width: 0; }
.head-eyebrow { font-size: 12px; letter-spacing: 0.12em; color: var(--header-sub); font-weight: 500; margin-bottom: 2px; }
.head-title { font-family: var(--font-display); font-weight: 900; font-size: 22px; letter-spacing: 0.02em; }
.head-sub { font-size: 11px; color: var(--header-sub); margin-top: 2px; }
.head-date { font-size: 15px; font-weight: 700; color: #fff; margin-top: 4px; font-family: var(--font-display); letter-spacing: 0.02em; }
.wrap { max-width: 640px; margin: 0 auto; padding: 10px 26px 0; }
.invite-bar { display: flex; align-items: center; gap: 8px; background: var(--navy-light); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 12.5px; color: var(--text2); margin-top: 8px; }
.invite-code { font-family: var(--font-num); font-weight: 700; font-size: 15px; letter-spacing: 0.08em; color: var(--navy); }
.invite-bar button { margin-left: auto; border: 1px solid var(--border2); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 11.5px; color: var(--text2); cursor: pointer; }
.ptabs { display: flex; gap: 7px; overflow-x: auto; padding: 8px 14px 0; scrollbar-width: none; }
.ptab-search { width: 100%; padding: 9px 13px; border: 1px solid var(--border2); border-radius: 20px; font-size: 13px; font-family: inherit; background: var(--surface); color: var(--text); margin-top: 8px; }
.ptab-search:focus { outline: none; border-color: var(--navy); }
.ptabs::-webkit-scrollbar { display: none; }
.ptab { flex-shrink: 0; padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border2); background: var(--surface); color: var(--text2); font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all .15s; }
.ptab.active { background: var(--navy); color: #fff; border-color: var(--navy); }
.cal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-top: 10px; }
.cal-compact { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; cursor: default; }
.cal-compact-label { font-family: var(--font-num); font-weight: 500; font-size: 14px; color: var(--text); }
.cal-grid-wrap { border-top: 1px solid var(--border); }
.cal-today-btn { border: 1px solid var(--border2); background: var(--surface2); color: var(--navy); font-size: 12px; font-weight: 700; border-radius: 16px; padding: 6px 12px; cursor: pointer; }
.cal-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.cal-title { font-weight: 700; font-size: 14px; }
.cal-nav { display: flex; gap: 4px; }
.cal-nav-right { display: flex; align-items: center; gap: 8px; }
.cal-nav button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border2); background: var(--surface2); color: var(--text); font-size: 14px; cursor: pointer; }
.dream-card { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: 14px; margin-top: 12px; margin-bottom: 0; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); padding: 8px; gap: 2px; }
.cal-dow { text-align: center; font-size: 10.5px; color: var(--text3); font-weight: 500; padding-bottom: 3px; }
.cal-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; font-size: 12.5px; color: var(--text); cursor: pointer; position: relative; font-family: var(--font-num); border: 1px solid transparent; }
.cal-star { position: absolute; top: 2px; right: 3px; color: var(--border2); font-size: 10px; line-height: 1; pointer-events: none; z-index: 2; }
.cal-star.active { color: var(--rust); }
.cal-cell { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.tri-sub { font-weight: 400; font-size: 10.5px; color: var(--text3); margin-left: 2px; }
.avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: var(--border); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--text2); vertical-align: middle; overflow: hidden; }
.head-title { display: flex; align-items: center; min-width: 0; }
.head-title .avatar { width: 44px; height: 44px; margin-right: 10px; font-size: 16px; border: 2px solid rgba(255,255,255,0.35); }
.head-title .head-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.head { padding-bottom: 10px; }
.head-eyebrow { margin-bottom: 6px; }
.match-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.match-row-date { flex-shrink: 0; width: 7.2em; font-size: 12px; font-weight: 700; color: var(--rust); }
.match-row input { flex: 1; min-width: 0; }
.match-row .save-status { flex-shrink: 0; min-width: 3.5em; }
.match-empty { font-size: 11.5px; color: var(--text3); padding: 2px 0 0; }
.msg-meta .avatar { width: 20px; height: 20px; font-size: 10px; margin-right: 5px; }
.avatar-edit-row { display: flex; align-items: center; gap: 12px; }
.avatar-edit-row .avatar { width: 56px; height: 56px; font-size: 20px; }
.avatar-edit-btns { display: flex; flex-direction: column; gap: 6px; }
.match-box { border-top: 1px dashed var(--border2); margin: 4px 10px 0; padding: 10px 2px 12px; }
.match-box-label { font-size: 12px; font-weight: 700; color: var(--text2); margin-bottom: 6px; }
.match-box-row { display: flex; align-items: center; gap: 8px; }
.match-box-row input { flex: 1; min-width: 0; }
.match-name-input { width: 100%; margin-top: 8px; }
.match-name-text { font-size: 13px; font-weight: 700; color: var(--rust); margin-top: 6px; }
.proq-note { font-size: 11.5px; color: var(--text3); margin-top: 4px; }
.plan-opt-tax { font-size: 11px; color: var(--text3); margin-top: 2px; }
.cal-hint { text-align: center; font-size: 10.5px; color: var(--text3); padding: 8px 10px 10px; }
.cal-loading { text-align: center; font-size: 11px; color: var(--text3); padding: 0 10px 6px; opacity: 0.85; }
.cal-star.active { color: var(--rust); }
.cal-cell.important { background: var(--rust-light); }
.cal-cell.out { color: var(--text-faint); cursor: default; }
.cal-cell.today { border-color: var(--navy); }
.cal-cell.selected { background: var(--navy); color: #fff; }
.cal-cell.selected .cal-star { color: rgba(255,255,255,0.5); }
.cal-cell.selected .cal-star.active { color: #FF9F66; }
.cal-cell.important.selected { background: var(--rust); }
.cal-cell .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--stitch); margin-top: 2px; }
.cal-cell .dot.dot-unread { width: 7px; height: 7px; box-shadow: 0 0 0 2px var(--rust-light); }
.cal-cell.selected .dot { background: #fff; }
.cal-cell .dot.dot-face { width: auto; height: auto; border-radius: 0; background: none; font-size: 11px; line-height: 1; margin-top: 1px; position: relative; }
.cal-cell .dot.dot-face.dot-unread::after { content: ''; position: absolute; top: -3px; right: -4px; width: 5px; height: 5px; border-radius: 50%; background: var(--rust); }
.cal-cell:not(.out):hover { background: var(--navy-light); }
.cal-cell.selected:hover { background: var(--navy); }
.section-title { font-size: 12px; font-weight: 700; color: var(--text); margin: 14px 2px 6px; letter-spacing: 0.04em; }
.section-title:first-child { margin-top: 0; }
.panel { margin-top: 10px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; }
.card-label { font-size: 12.5px; font-weight: 700; color: var(--text); margin-bottom: 6px; display: flex; align-items: center; gap: 7px; }
.card.good { border-left: 4px solid var(--blue); } .card.issue { border-left: 4px solid var(--red); }
.card.good .card-label { color: var(--blue); } .card.issue .card-label { color: var(--red); }
/* メニュー・よかった点・改善点を1枚のカードにまとめる */
.rec-block + .rec-block { margin-top: 18px; }
.rec-block.good .card-label { color: var(--blue); } .rec-block.issue .card-label { color: var(--red); }
.rec-block.good > textarea { border-color: var(--blue); background: var(--blue-light); }
.rec-block.issue > textarea { border-color: var(--red); background: var(--red-light); }
.rec-block.good > textarea:focus { border-color: var(--blue); background: var(--surface); }
.rec-block.issue > textarea:focus { border-color: var(--red); background: var(--surface); }
/* ノート全体の登録ボタン */
.submit-row { margin: 4px 0 12px; }
.submit-btn { width: 100%; padding: 14px; border: none; border-radius: var(--radius-sm); background: var(--primary-grad); color: var(--on-primary); box-shadow: var(--primary-glow); letter-spacing: 0.08em; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
.submit-btn:disabled { opacity: 0.5; cursor: default; }
.submit-btn.done { background: var(--green); }
.submit-note { text-align: center; font-size: 11.5px; color: var(--text3); margin-top: 6px; }
.removed-banner { background: var(--navy-light); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-top: 10px; margin-bottom: 4px; }
.removed-banner-title { font-family: var(--font-display); font-weight: 900; font-size: 14px; color: var(--navy); margin-bottom: 6px; }
.removed-banner-text { font-size: 12.5px; color: var(--text2); line-height: 1.6; margin-bottom: 10px; }
.removed-reactivate-btn { width: 100%; padding: 11px; border: none; border-radius: var(--radius-sm); background: var(--navy); color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; }
.removed-reactivate-btn:disabled { opacity: 0.45; cursor: default; }
.removed-refresh-row { text-align: center; margin-top: 10px; }
.removed-refresh-btn { border: none; background: none; color: var(--navy); font-size: 12px; font-weight: 700; text-decoration: underline; cursor: pointer; padding: 4px; }
.removed-refresh-hint { font-size: 11.5px; color: var(--text3); margin-top: 4px; }
.removed-join-row { display: flex; gap: 8px; }
.removed-join-row .modal-select { flex: 1; }
.removed-date-label { font-family: var(--font-num); font-size: 13px; color: var(--text2); margin: 12px 2px 6px; }
.removed-cond-row { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12.5px; color: var(--text2); }
.removed-readonly-text { font-size: 13.5px; color: var(--text); white-space: pre-wrap; line-height: 1.6; }
.removed-coach-comment { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border2); font-size: 12.5px; color: var(--navy); white-space: pre-wrap; }
textarea { width: 100%; border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 9px 11px; font-family: var(--font-body); font-size: 14px; color: var(--text); resize: none; min-height: 44px; background: var(--surface2); overflow-y: hidden; }
.goal-card { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: 14px; margin-top: 10px; }
.goal-label { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.goal-input { width: 100%; border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 9px 11px; font-size: 14px; font-weight: 700; color: var(--text); background: var(--surface2); margin-bottom: 10px; }
.goal-input:focus { outline: none; border-color: var(--navy); background: var(--surface); }
.goal-tasks-label { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.goal-ai-btn { border: 1px solid var(--border2); background: var(--surface2); color: var(--text); border-radius: 14px; padding: 4px 10px; font-size: 11px; font-weight: 500; cursor: pointer; font-family: inherit; }
.goal-ai-btn:disabled { opacity: 0.5; cursor: default; }
.goal-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.goal-progress { font-size: 11px; font-weight: 700; color: var(--green); }
.goal-tasks { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.goal-task-row { display: flex; align-items: center; gap: 6px; }
.goal-task-row.done .goal-task-input { color: var(--text3); text-decoration: line-through; }
.goal-task-check { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--border2); background: var(--surface2); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: 11px; font-weight: 900; color: #fff; }

/* ── paywall ── */

.group-search { margin-bottom: 8px; }
.group-members { display: flex; flex-direction: column; max-height: 180px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }
.group-member-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 13px; border-top: 1px solid var(--border); cursor: pointer; }
.group-member-item:first-child { border-top: none; }
.group-member-item input { width: auto; }



/* ---- ロゴ（スプラッシュ・アイコンと同じ字体とバランス） ---- */
.brand-logo { display: inline-flex; align-items: center; vertical-align: middle; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 700; line-height: 1; letter-spacing: -0.015em; color: var(--brand-text, var(--navy)); }
.bl-word { position: relative; z-index: 1; -webkit-text-stroke: 0.018em currentColor; }
.bl-plus { position: relative; z-index: 2; display: inline-flex; margin-left: -0.17em; transform: translateY(0.2em); }
.bl-plus svg { width: 0.66em; height: 0.66em; overflow: visible; display: block; }
.blp-gap { fill: var(--brand-gap, var(--bg)); stroke: var(--brand-gap, var(--bg)); stroke-width: 16; stroke-linejoin: round; }
.blp-line, .blp-glow { fill: none; stroke: var(--plus-color, #FF7A2E); stroke-linejoin: round; }
.blp-line { stroke-width: 6.5; } .blp-glow { stroke-width: 12; opacity: 0.8; }
.auth-title .brand-logo { font-size: 34px; }
.auth-title { --brand-gap: var(--bg); margin-bottom: 18px; }
.pay-title .brand-logo { font-size: 26px; }
.pay-title { --brand-gap: var(--surface); }
.bl-after { margin-left: 0.45em; color: var(--text); }
html[data-theme="dream-notebook"] .brand-logo { --brand-text: #F2F2F2; }

/* ---- 招待コードの自作 ---- */
.custom-code-row { display: flex; gap: 8px; margin-top: 10px; }
.custom-code-row .modal-select { flex: 1; text-transform: uppercase; }
.custom-code-msg { margin-top: 6px; font-size: 12.5px; font-weight: 700; }
.custom-code-msg.err { color: var(--red); }
.custom-code-msg.ok { color: var(--green); }
/* ---- アスリートへの質問 ---- */
.proq-lead { font-size: 12.5px; line-height: 1.7; color: var(--text2); margin: -4px 0 14px; }
/* ---- トップ画面（日替わり名言＋2つの入り口） ---- */
.launcher { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; padding: calc(env(safe-area-inset-top, 0px) + 28px) 22px calc(env(safe-area-inset-bottom, 0px) + 28px); background: var(--bg); color: var(--text); }
.launcher-top { width: 100%; max-width: 520px; display: flex; align-items: center; gap: 6px; font-size: 16px; color: #F2F2F2; }
.launcher-top .brand-badge { font-size: 13px; padding: 3px 9px; }
.launcher-hello { font-weight: 700; }
.quote-card { width: 100%; max-width: 520px; margin-top: 26px; padding: 24px 22px 20px; border-radius: var(--radius); background: var(--card-bg); box-shadow: var(--card-shadow); border: 1px solid rgba(255,255,255,0.10); text-align: center; }
.quote-eyebrow { font-family: 'Oswald', var(--font-latin); letter-spacing: 0.28em; padding-left: 0.28em; /* 字間の分だけ左に寄るのを打ち消して、ちょうど真ん中に */ font-size: 12px; color: var(--plus-color, var(--rust)); margin-bottom: 14px; text-align: center; }
.quote-text { font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-size: clamp(18px, 5.2vw, 23px); line-height: 1.65; color: var(--text); }
/* 改行は「、」「。」の後を最優先。まとまりが1行に入りきらない時だけ、文節の切れ目で改行する */
.qc { display: inline-block; }
.qp { display: inline-block; }
.quote-who { margin-top: 16px; font-size: 13.5px; font-weight: 700; color: var(--text2); }
.quote-field { margin-left: 8px; font-weight: 500; font-size: 12px; color: var(--text3); }
.quote-note { margin-top: 10px; font-size: 12.5px; color: var(--text3); line-height: 1.6; }
.head-cal-img { width: 30px; height: 30px; display: block; margin: auto; }
.launcher-main { flex: 1; width: 100%; max-width: 520px; display: flex; flex-direction: column; justify-content: center; gap: clamp(36px, 7vh, 64px); padding: 16px 0 8vh; }
.launcher-main .quote-card { margin-top: 0; }
.launcher-tiles-area { width: 100%; display: flex; justify-content: center; }
.launcher-tiles { display: flex; gap: 26px; justify-content: center; flex-wrap: wrap; }
.launcher-tile { width: 132px; display: flex; flex-direction: column; align-items: center; gap: 10px; background: none; border: none; cursor: pointer; color: var(--text2); font-family: inherit; padding: 0; }
.launcher-icon { width: 120px; height: 120px; border-radius: 14px; background: #141414; border: 2px solid rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; transition: transform .15s ease, border-color .15s ease, box-shadow .2s ease; overflow: hidden; }
.launcher-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
.launcher-svg { width: 100px; height: 100px; display: block; }
.launcher-label { font-size: 13.5px; font-weight: 700; }
.launcher-tile:hover .launcher-icon, .launcher-tile:focus-visible .launcher-icon { transform: scale(1.06); border-color: #F2F2F2; }
.launcher-tile:active .launcher-icon { transform: scale(0.97); }
.launcher-tile:hover .launcher-label { color: var(--text); }
.launcher-footer { display: flex; gap: 18px; }
/* =========================================================
   テーマ共通の仕上げ
   ========================================================= */
.brand-badge { display: inline-block; font-family: var(--font-latin); font-weight: 700; font-size: 11px; letter-spacing: 0.06em; padding: 2px 8px; margin-right: 8px; border-radius: 4px; background: var(--badge-bg); color: var(--badge-text); vertical-align: 1px; }
.head-eyebrow { display: flex; align-items: center; }
.card, .goal-card, .thread-card, .cal, .auth-card, .pay-card, .modal-card { background: var(--card-bg); box-shadow: var(--card-shadow); }
textarea:focus, input:focus, .goal-input:focus, .goal-task-input:focus { box-shadow: var(--focus-ring); }
.submit-btn, .auth-btn, .pay-btn, .video-upload-btn, .menu-send-btn, .modal-btn-send, .removed-reactivate-btn { transition: transform .12s ease, filter .12s ease, box-shadow .2s ease; }
.submit-btn:active, .auth-btn:active, .pay-btn:active, .goal-ai-btn:active { transform: scale(0.98); filter: brightness(1.12); }
.cal-cell, .goal-progress, .invite-code, .pay-amount, .plan-opt-amount, .cal-compact-label, .removed-date-label, .msg-meta { font-variant-numeric: tabular-nums; }

/* =========================================================
   1. dream-notebook（夢ノート / 既定）
   マットブラック × エレクトリックオレンジ × ホワイト
   ========================================================= */
html[data-theme="dream-notebook"] {
  --bg: #121212; --surface: #1E1E1E; --surface2: #252525; --border: #2D2D2D; --border2: #3A3A3A;
  --navy: #E8804A; --navy2: #CF6B36; --navy-light: rgba(232,128,74,0.12);
  --text: #FFFFFF; --text2: #D7DCE3; --text3: #A0AEC0; --text-faint: #6B7280;
  --blue: #00E676; --blue-light: rgba(0,230,118,0.08); --red: #FF5252; --red-light: rgba(255,82,82,0.08);
  --line-green: #25D366; --bubble-mine-text: #08130C;
  --green: #00E676; --green-light: rgba(0,230,118,0.10); --rust: #E8804A; --rust-light: rgba(232,128,74,0.12); --stitch: #D9733E;
  --radius: 12px; --radius-sm: 8px;
  --header-bg: linear-gradient(180deg, #232323 0%, #161616 100%); --header-text: #FFFFFF; --header-sub: #A0AEC0;
  --page-bg: #121212;
  --on-primary: #FFFFFF;
  --primary-grad: linear-gradient(135deg, #EC9361 0%, #E07A43 55%, #CF6B36 100%);
  --primary-glow: 0 4px 12px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.18);
  --card-bg: linear-gradient(180deg, #222222 0%, #1B1B1B 100%);
  --card-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 24px rgba(0,0,0,0.35);
  --focus-ring: 0 0 0 3px rgba(232,128,74,0.22);
  --badge-bg: #E07A43; --badge-text: #FFFFFF;
  --font-body: 'Noto Sans JP', sans-serif;
  --font-display: 'Noto Sans JP', sans-serif;
  --font-num: 'Oswald', 'Noto Sans JP', sans-serif;
  --font-latin: 'Montserrat', 'Noto Sans JP', sans-serif;
  color-scheme: dark;
}
html[data-theme="dream-notebook"] .wrap { background: transparent; }
/* ロゴ：Selfは白、＋だけオレンジ */
html[data-theme="dream-notebook"] { --plus-color: #E8804A; --splash-bg: #121212; --splash-gap: #121212; }
html[data-theme="dream-notebook"] .auth-title { color: #FFFFFF; }
html[data-theme="dream-notebook"] .head-title { font-weight: 900; letter-spacing: 0.04em; }
html[data-theme="dream-notebook"] .section-title { font-family: var(--font-latin); letter-spacing: 0.12em; color: var(--text3); }
html[data-theme="dream-notebook"] .goal-ai-btn { background: var(--primary-grad); color: #fff; border: none; font-weight: 700; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
html[data-theme="dream-notebook"] .msg-bubble { background: #2A2A2A; border-color: #333; }
html[data-theme="dream-notebook"] .cal-cell { font-family: var(--font-num); font-size: 14px; }
html[data-theme="dream-notebook"] .cal-cell.selected { background: var(--primary-grad); box-shadow: 0 3px 8px rgba(0,0,0,0.3); }
html[data-theme="dream-notebook"] .tri-opt.active { box-shadow: 0 0 0 1px var(--navy); }
html[data-theme="dream-notebook"] .goal-task-check { background: var(--surface2); }
html[data-theme="dream-notebook"] .head-cal-btn { border-color: rgba(255,255,255,0.14); background: rgba(255,255,255,0.05); }

/* =========================================================
   2. school-notebook（ルーズリーフ風）
   ウォームホワイト × 罫線 × 深緑 ＆ オレンジ
   ========================================================= */
html[data-theme="school-notebook"] {
  --splash-bg: #2E5E4E; --splash-gap: #2E5E4E;
  --bg: #F7F4EC; --surface: #FFFFFD; --surface2: #FFFFFD; --border: #E6E0D2; --border2: #D6CEBB;
  --navy: #2E5E4E; --navy2: #224739; --navy-light: #E8F1EC;
  --text: #22302A; --text2: #3A4741; --text3: #55605A; --text-faint: #A9A491;
  --blue: #2F6FBF; --blue-light: #F3F7FC; --red: #D2483F; --red-light: #FCF2F1; --line-green: #A6DF7A;
  --green: #2E7D55; --green-light: #EAF3EC; --rust: #E8782A; --rust-light: #FDF0E6; --stitch: #F08A24;
  --radius: 16px; --radius-sm: 10px;
  --header-bg: #2E5E4E; --header-sub: #CFE3D8; --page-bg: #2E5E4E;
  --primary-grad: linear-gradient(135deg, #3A7360, #2E5E4E);
  --primary-glow: 0 4px 12px rgba(46,94,78,0.25);
  --card-shadow: 0 1px 2px rgba(60,50,30,0.06);
  --focus-ring: 0 0 0 3px rgba(240,138,36,0.22);
  --badge-bg: #F08A24; --badge-text: #FFFFFF;
  --font-body: 'Zen Maru Gothic', 'Noto Sans JP', sans-serif;
  --font-display: 'Zen Maru Gothic', 'Noto Sans JP', sans-serif;
  --font-num: 'Zen Maru Gothic', 'Noto Sans JP', sans-serif;
  --font-latin: 'Zen Maru Gothic', 'Noto Sans JP', sans-serif;
}
/* 罫線（ルーズリーフ）：記録の入力欄に横線を引く */
html[data-theme="school-notebook"] .rec-block > textarea,
html[data-theme="school-notebook"] #f-menu {
  line-height: 28px; padding-top: 4px;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 27px, #DCE5EE 27px, #DCE5EE 28px);
  background-attachment: local;
}
html[data-theme="school-notebook"] .card, html[data-theme="school-notebook"] .goal-card { border-left: 3px solid #F2B8B0; }

/* =========================================================
   3. academic-navy（スタイリッシュネイビー）
   ディープネイビー × エメラルド × ホワイト
   ========================================================= */
html[data-theme="academic-navy"] {
  --splash-bg: #0F2A4A; --splash-gap: #0F2A4A;
  --bg: #F3F6F9; --surface: #FFFFFF; --surface2: #F7F9FC; --border: #E2E8F0; --border2: #CBD5E1;
  --navy: #0F2A4A; --navy2: #0A1E36; --navy-light: #EAF0F7;
  --text: #0F172A; --text2: #334155; --text3: #4A5568; --text-faint: #A0AEC0;
  --blue: #2563EB; --blue-light: #EEF3FE; --red: #DC4A4A; --red-light: #FDEFEF; --line-green: #A7EBCB;
  --green: #0F8B6E; --green-light: #E6F5F0; --rust: #0F8B6E; --rust-light: #E6F5F0; --stitch: #10B981;
  --radius: 10px; --radius-sm: 7px;
  --header-bg: #0F2A4A; --header-sub: #B9C7DA; --page-bg: #0F2A4A;
  --primary-grad: linear-gradient(135deg, #16385F, #0F2A4A);
  --primary-glow: 0 4px 14px rgba(15,42,74,0.22);
  --card-shadow: 0 1px 3px rgba(15,23,42,0.06);
  --focus-ring: 0 0 0 3px rgba(16,185,129,0.22);
  --badge-bg: #10B981; --badge-text: #FFFFFF;
  --font-body: 'Noto Sans JP', sans-serif;
  --font-display: 'Noto Sans JP', sans-serif;
  --font-num: 'Outfit', 'Noto Sans JP', sans-serif;
  --font-latin: 'Outfit', 'Noto Sans JP', sans-serif;
}
html[data-theme="academic-navy"] .head-title { font-weight: 700; }

/* =========================================================
   4. architectural-beige（建築北欧モダン）
   サンドベージュ × スレートグレー × テラコッタ
   ========================================================= */
html[data-theme="architectural-beige"] {
  --splash-bg: #3E4A52; --splash-gap: #3E4A52;
  --bg: #EFEAE1; --surface: #FBF9F5; --surface2: #F4F0E8; --border: #E1D9CA; --border2: #CFC4B1;
  --navy: #3E4A52; --navy2: #2F393F; --navy-light: #E8EBED;
  --text: #2A2A28; --text2: #424548; --text3: #5A5D60; --text-faint: #ADA697;
  --blue: #4A72A8; --blue-light: #ECF1F7; --red: #B9553B; --red-light: #F7EBE6; --line-green: #B4D9A0;
  --green: #5E7F67; --green-light: #ECF1EC; --rust: #B85C38; --rust-light: #F5E8E0; --stitch: #C2643F;
  --radius: 6px; --radius-sm: 4px;
  --header-bg: #3E4A52; --header-sub: #D3D8DB; --page-bg: #3E4A52;
  --primary-grad: #3E4A52;
  --card-shadow: none;
  --focus-ring: 0 0 0 2px rgba(194,100,63,0.25);
  --badge-bg: #C2643F; --badge-text: #FFFFFF;
  --font-body: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
  --font-display: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
  --font-num: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
  --font-latin: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
}
html[data-theme="architectural-beige"] .section-title { font-family: var(--font-latin); letter-spacing: 0.14em; }
</style>

function generateTeamCode(length = 6) {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 紛らわしい文字(0/O, 1/I等)を除外
  // 予測されにくいよう、暗号用の乱数を使う（使えない環境では従来の乱数）
  const rand = new Uint32Array(length);
  if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(rand);
  else for (let i = 0; i < length; i++) rand[i] = Math.floor(Math.random() * 4294967296);
  let code = '';
  for (let i = 0; i < length; i++) code += chars[rand[i] % chars.length];
  return code;
}

  // Web版：新しいタブで開く

// ── プロフィール写真（アバター） ──
// 写真は160px四方のJPEG（数KB）に縮小して users/{uid}.photo に保存する。
function avatarHtml(photo, name) {
  if (photo && typeof photo === 'string' && photo.startsWith('data:image/')) {
    return `<img class="avatar" src="${photo}" alt="">`;
  }
  const initial = (name || '？').trim().charAt(0) || '？';
  return `<span class="avatar">${escapeHtml(initial)}</span>`;
}
function resizeImageToDataUrl(file, size = 160) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read failed'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('image load failed'));
      img.onload = () => {
        const side = Math.min(img.width, img.height);
        const sx = (img.width - side) / 2;
        const sy = (img.height - side) / 2;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.addEventListener('click', (ev) => { if (ev.target === overlay) close(); });
  document.getElementById('del-cancel').onclick = close;

  const passEl = document.getElementById('del-pass');
  const confirmEl = document.getElementById('del-confirm');
  const submitBtn = document.getElementById('del-submit');
  const msgEl = document.getElementById('del-msg');
  const updateState = () => { submitBtn.disabled = !(passEl.value && confirmEl.value.trim() === '削除'); };
  passEl.oninput = updateState;
  confirmEl.oninput = updateState;

  // 有料プランの注意書き（確認できなかった場合も、念のため注意を出す）
  checkActiveSubscription(current.uid).then(active => {
    const note = document.getElementById('del-sub-note');
    if (!note) return;
    if (active === false) { note.remove(); return; }
    const teamNote = isCoachRole ? 'チームの他のコーチが契約していない場合、選手もSelf+を使えなくなります。' : '';

  });

  submitBtn.onclick = async () => {
    msgEl.innerHTML = '';
    submitBtn.disabled = true;
    submitBtn.textContent = '削除しています…';
    try {
      const cred = EmailAuthProvider.credential(current.email, passEl.value);
      await reauthenticateWithCredential(current, cred);
      pendingAuthNotice = { text: 'アカウントを削除しました。ご利用ありがとうございました。', type: 'ok' };
      await deleteUser(current);
      close();
      // この後 onAuthStateChanged が発火してログイン画面に戻り、上のメッセージが表示される
    } catch (e) {
      pendingAuthNotice = null;
      console.error('account delete failed', e);
      const wrongPass = e && (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential');
      const text = wrongPass ? 'パスワードが正しくありません。' : translateError(e);
      msgEl.innerHTML = `<div class="pay-msg err">${escapeHtml(text)}</div>`;
      submitBtn.textContent = '完全に削除する';
      updateState();
    }
  };
}

async function kvGet(key) {
  const snap = await getDoc(doc(db, 'kv', key));
  if (!snap.exists()) return null;
  return { value: snap.data().value };
}
async function kvSet(key, value) {
  await setDoc(doc(db, 'kv', key), { key, value, updatedAt: Date.now() });
  return true;
}
async function kvList(prefix, withValues) {
  const q = query(collection(db, 'kv'), where(documentId(), '>=', prefix), where(documentId(), '<', prefix + '\uf8ff'));
  const snaps = await getDocs(q);
  const keys = [];
  const docs = [];
  snaps.forEach(d => { keys.push(d.id); if (withValues) docs.push({ key: d.id, value: d.data().value }); });
  return { keys, docs };
}

// ── 全角英数字（Ａ〜Ｚ・ａ〜ｚ・０〜９）を、入力中に自動で半角にする ──
function toHalfWidthAlnum(str) {
  return str.replace(/[Ａ-Ｚａ-ｚ０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
}
function isHalfWidthTarget(el) {
  if (!el || el.readOnly || el.disabled) return false;
  if (el.tagName === 'TEXTAREA') return true;
  return el.tagName === 'INPUT' && ['text', 'search', 'email', ''].includes((el.getAttribute('type') || '').toLowerCase());
}
function normalizeHalfWidth(el) {
  const before = el.value;
  const after = toHalfWidthAlnum(before);
  if (after === before) return false;
  const pos = el.selectionStart;
  el.value = after;
  try { el.setSelectionRange(pos, pos); } catch (e) {}
  return true;
}
document.addEventListener('input', (ev) => {
  if (ev.isComposing || !isHalfWidthTarget(ev.target)) return;
  normalizeHalfWidth(ev.target);
}, true);
document.addEventListener('compositionend', (ev) => {
  if (!isHalfWidthTarget(ev.target)) return;
  // 変換確定のあとで直した場合は、自動保存にも伝わるように input をもう一度知らせる
  if (normalizeHalfWidth(ev.target)) ev.target.dispatchEvent(new Event('input', { bubbles: true }));
}, true);

const app = document.getElementById('app');
const introSplash = document.getElementById('introSplash');
const splashStartTime = Date.now();
const SPLASH_MIN_MS = 5500; // ロゴ完成（2.7秒）→ スポンサー表示（2.8〜3.5秒）→ 出そろってから約2秒静止。ここまでは必ず見せる
const SPLASH_EXIT_MS = 850;  // 手前に迫りながら消える演出の長さ

function hideIntroSplash() {
  if (!introSplash || introSplash.dataset.leaving) return;
  introSplash.dataset.leaving = '1';
  const elapsed = Date.now() - splashStartTime;
  const wait = Math.max(0, SPLASH_MIN_MS - elapsed);
  setTimeout(() => {
    introSplash.classList.add('exit');
    setTimeout(() => { introSplash.style.display = 'none'; introSplash.remove(); }, SPLASH_EXIT_MS);
  }, wait);
}
// 万一アプリの読み込みが止まっても、スプラッシュが出っぱなしにならないようにする
setTimeout(hideIntroSplash, 8000);

const bgResetObserver = new MutationObserver(() => {
  document.body.style.background = 'var(--bg)';
  hideIntroSplash();
  bgResetObserver.disconnect();
});
bgResetObserver.observe(app, { childList: true });

        `}
        <label>パスワード</label>
        <div style="display:flex; gap:6px;">
          <input id="a-pass" type="password" autocomplete="${authMode==='signup'?'new-password':'current-password'}" placeholder="${(authMode === 'signup' && authRole === 'student' && (isNativeApp || authStudentMode === 'team')) ? '8文字以上' : '6文字以上'}" style="flex:1;">
          <button type="button" id="a-pass-toggle" style="flex-shrink:0; border:1px solid var(--border2); background:var(--surface2); border-radius:10px; padding:0 14px; font-size:12.5px; cursor:pointer; color:var(--text2);">表示</button>
        </div>
        ${authMode === 'signup' ? `
          <label class="agree-row">

          </label>
        ` : ''}
        <button id="a-submit" class="auth-btn">${authMode==='signup' ? '仮登録する' : 'ログイン'}</button>
        ${authMode === 'login' ? `<div class="auth-forgot" id="a-forgot">パスワードをお忘れですか？</div>
        <div class="auth-forgot" id="a-resend">確認メールが届かない方はこちら（もう一度送る）</div>` : ''}
        <div class="auth-mail-note">※IDで登録した選手は、パスワードを忘れたらコーチに再設定を頼んでください。<br>※メールが届かない場合は、迷惑メールフォルダもご確認ください。送信元は noreply@yakyu-nikki.firebaseapp.com です。携帯会社のメール（docomo・au・SoftBank等）は届かないことがあるため、Gmail等のご利用をおすすめします。</div>
        <div id="a-msg"></div>
      </div>
      ${legalLinksHtml()}
    </div></div>
  `;
  app.querySelectorAll('.auth-tab').forEach(t => t.onclick = () => { authMode = t.dataset.tab; renderAuth(); });
  app.querySelectorAll('.role-opt').forEach(r => r.onclick = () => {
    if (r.dataset.role) authRole = r.dataset.role;
    if (r.dataset.coachmode) authCoachMode = r.dataset.coachmode;
    if (r.dataset.studentmode) authStudentMode = r.dataset.studentmode;
    renderAuth();
  });
  document.getElementById('a-submit').onclick = authMode === 'signup' ? handleSignup : handleLogin;
  const forgotLink = document.getElementById('a-forgot');
  if (forgotLink) forgotLink.onclick = handleForgotPassword;
  const resendLink = document.getElementById('a-resend');
  if (resendLink) resendLink.onclick = handleResendVerification;
  const emailInput = document.getElementById('a-email');
  if (emailInput) emailInput.addEventListener('input', () => { lastAuthEmail = emailInput.value.trim(); });
  const toggleBtn = document.getElementById('a-pass-toggle');
  const passInput = document.getElementById('a-pass');
  toggleBtn.onclick = () => {
    const showing = passInput.type === 'text';
    passInput.type = showing ? 'password' : 'text';
    toggleBtn.textContent = showing ? '表示' : '隠す';
  };
  wireLegalLinks(app);
  if (pendingAuthNotice) {
    showAuthMsg(pendingAuthNotice.text, pendingAuthNotice.type);
    pendingAuthNotice = null;
  }
}
function birthYearOptions() {

  let html = '<option value="">年</option>';
  for (let y = nowY; y >= nowY - 100; y--) html += `<option value="${y}">${y}年</option>`;
  return html;
}
function monthDayOptions(max, label) {
  let html = `<option value="">${label}</option>`;

function showAuthMsg(text, type) {

// アカウント削除（ロールバック）を試みる。成功/失敗を呼び出し側で判定できるようにする。
async function rollbackSignupAccount(cred) {

    await cred.user.delete();
    return true;
  } catch (e) {

    return false;
  }

async function handleSignup() {
  const agreeEl = document.getElementById('a-agree');
  if (!agreeEl || !agreeEl.checked) { showAuthMsg('利用規約とプライバシーポリシーへの同意が必要です', 'err'); return; }
  const name = document.getElementById('a-name').value.trim();
  const sport = document.getElementById('a-sport').value.trim();
  const email = document.getElementById('a-email').value.trim();
  const password = document.getElementById('a-pass').value;
  let teamCode = '';
  // 個人アカウントはWeb版でのみ登録できる（アプリ版はストア審査の都合で購入導線を持たないため）
  const isIndividualSignup = authRole === 'student' && authStudentMode === 'individual' && !isNativeApp;
  // チームの選手はIDで登録する（メール確認なし）
  const isIdSignup = authRole === 'student' && !isIndividualSignup;
  let loginId = '';
  let signupEmail = email;
  if (isIdSignup) {
    loginId = email.toLowerCase();
    if (!ID_PATTERN.test(loginId)) { showAuthMsg('IDは半角の英小文字・数字・「_」で4〜20文字にしてください（例：kanta2013）', 'err'); return; }
    if (password.length < 8) { showAuthMsg('IDで登録する場合、パスワードは8文字以上にしてください', 'err'); return; }
    signupEmail = idToEmail(loginId);
  }

  if (isIndividualSignup) {
    if (!name || !sport || !email || !password) { showAuthMsg('すべての項目を入力してください', 'err'); return; }
  } else if (authRole === 'student') {
    teamCode = document.getElementById('a-team').value.trim().toUpperCase();
    if (!name || !sport || !teamCode || !email || !password) { showAuthMsg('すべての項目を入力してください', 'err'); return; }
  } else if (authRole === 'coach' && authCoachMode === 'join') {
    teamCode = document.getElementById('a-team').value.trim().toUpperCase();
    if (!name || !sport || !teamCode || !email || !password) { showAuthMsg('すべての項目を入力してください', 'err'); return; }
  } else {
    if (!name || !sport || !email || !password) { showAuthMsg('すべての項目を入力してください', 'err'); return; }
  }

  let birthdate = null;
  if (authRole === 'student') {
    const by = document.getElementById('a-birth-y').value;
    const bm = document.getElementById('a-birth-m').value;
    const bd = document.getElementById('a-birth-d').value;
    if (!by || !bm || !bd) { showAuthMsg('生年月日を入力してください', 'err'); return; }
    birthdate = `${by}-${String(bm).padStart(2, '0')}-${String(bd).padStart(2, '0')}`;
  }

  const submitBtn = document.getElementById('a-submit');
  submitBtn.disabled = true;
  let cred = null;
  try {
    // Firestoreへの問い合わせ（招待コードの検証・発行）はセキュリティルール上
    // 認証済みユーザーでないと permission-denied になるため、
    // 先にFirebase Authenticationのアカウント作成を済ませる。
    if (isIdSignup) signupInProgress = true;
    cred = await createUserWithEmailAndPassword(auth, signupEmail, password);

    if (isIndividualSignup) {
      teamCode = null;
    } else if (authRole === 'student') {
      const coachQ = query(collection(db, 'users'), where('teamCode', '==', teamCode), where('role', '==', 'coach'));
      const coachSnaps = await getDocs(coachQ);
      if (coachSnaps.empty) {
        // 招待コードが無効だった場合、作成済みの認証アカウントをロールバック（削除）する
        const rolledBack = await rollbackSignupAccount(cred);
        signupInProgress = false;
        showAuthMsg(
          rolledBack
            ? 'その招待コードに一致するコーチが見つかりませんでした。コードを確認してください。'
            : 'その招待コードに一致するコーチが見つかりませんでした。また、アカウントの後始末に失敗しました。お手数ですが、このメールアドレスでの再登録がうまくいかない場合はお問い合わせフォームからご連絡ください。',
          'err'
        );
        submitBtn.disabled = false;
        return;
      }
    } else if (authRole === 'coach' && authCoachMode === 'join') {
      const coachQ = query(collection(db, 'users'), where('teamCode', '==', teamCode), where('role', '==', 'coach'));
      const coachSnaps = await getDocs(coachQ);
      if (coachSnaps.empty) {
        const rolledBack = await rollbackSignupAccount(cred);
        showAuthMsg(
          rolledBack
            ? 'その招待コードに一致するチームが見つかりませんでした。コードを確認してください。'
            : 'その招待コードに一致するチームが見つかりませんでした。また、アカウントの後始末に失敗しました。お手数ですが、このメールアドレスでの再登録がうまくいかない場合はお問い合わせフォームからご連絡ください。',
          'err'
        );
        submitBtn.disabled = false;
        return;
      }
    } else {
      teamCode = await generateUniqueTeamCode();
    }

    const profileData = { email: isIdSignup ? signupEmail : email, displayName: name, role: authRole, sport, teamCode, createdAt: Date.now() };
    if (isIdSignup) Object.assign(profileData, { loginType: 'id', loginId });
    if (authRole === 'student') {
      Object.assign(profileData, { birthdate });
    }
    if (isIndividualSignup) {
      Object.assign(profileData, { accountType: 'individual' });
    }
    await setDoc(doc(db, 'users', cred.user.uid), profileData);
    // 新しいチームを作った場合：保存した直後にもう一度、同じコードの別チームがないか確認する。
    // ごくまれに他のコーチと同時に同じコードが発行された場合は、自分のコードを発行し直す
    if (authRole === 'coach' && authCoachMode === 'new') {
      for (let i = 0; i < 3 && await isTeamCodeTaken(teamCode, cred.user.uid); i++) {
        teamCode = await generateUniqueTeamCode();
        await setDoc(doc(db, 'users', cred.user.uid), { teamCode }, { merge: true });
      }
    }
    if (isIdSignup) {
      // IDの選手はメール確認なし。そのままログインした状態で始める
      signupInProgress = false;
      pendingAuthNotice = null;
      location.reload();
      return;
    }
    await sendEmailVerification(cred.user);
    if (authRole === 'coach' && authCoachMode === 'new') {
      showAuthMsg(`仮登録できました。あなたの招待コードは「${teamCode}」です。届いた確認メールのリンクを開いてから、ログインしてください。メールが届かない場合は迷惑メールフォルダもご確認ください。`, 'ok');
    } else if (authRole === 'coach') {
      showAuthMsg('仮登録できました。チームに参加しました。届いた確認メールのリンクを開いてから、ログインしてください。メールが届かない場合は迷惑メールフォルダもご確認ください。', 'ok');
    } else if (isIndividualSignup) {
      showAuthMsg('仮登録できました。届いた確認メールのリンクを開いてからログインし、個人プランの手続きに進んでください。', 'ok');
    } else {
      showAuthMsg('仮登録できました。届いた確認メールのリンクを開いてから、ログインしてください。メールが届かない場合は迷惑メールフォルダもご確認ください。', 'ok');
    }
  } catch (e) {
    signupInProgress = false;
    if (isIdSignup && (e.code || '').includes('email-already-in-use')) {
      showAuthMsg('そのIDはすでに使われています。別のIDにしてください。', 'err');
      submitBtn.disabled = false;
      return;
    }
    // setDoc等の後半処理で失敗した場合も、認証アカウントだけ残ってしまわないようロールバックを試みる
    if (cred && cred.user) {
      const rolledBack = await rollbackSignupAccount(cred);
      if (!rolledBack) {
        showAuthMsg(translateError(e) + ' また、アカウントの後始末にも失敗しました。お手数ですが、このメールアドレスでの再登録がうまくいかない場合はお問い合わせフォームからご連絡ください。', 'err');
        submitBtn.disabled = false;
        return;
      }
    }
    showAuthMsg(translateError(e), 'err');
  }
  submitBtn.disabled = false;
}
async function handleResendVerification() {
  const email = document.getElementById('a-email').value.trim();
  if (email && !email.includes('@')) { showAuthMsg('IDで登録した方は、確認メールは不要です。そのまま「ログイン」を押してください。', 'ok'); return; }
  const password = document.getElementById('a-pass').value;
  lastAuthEmail = email;
  if (!email || !password) { showAuthMsg('登録したメールアドレスとパスワードを入力してから、もう一度押してください。', 'err'); return; }
  let text, type = 'ok';
  try {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    await reload(cred.user);
    if (cred.user.emailVerified) {
      text = 'このアカウントはメール確認が済んでいます。そのまま「ログイン」を押してください。';
    } else {
      try {
        await sendEmailVerification(cred.user);
        text = `${email} に確認メールをもう一度送りました。迷惑メールフォルダもご確認のうえ、メールアプリから直接リンクを開いてから、ログインしてください。`;
      } catch (re) {
        type = 'err';
        text = ((re && re.code) || '').includes('too-many-requests')
          ? '確認メールは少し前に送っています。10分ほど待ってから、もう一度お試しください。'
          : '確認メールを送れませんでした。時間をおいてお試しいただくか、お問い合わせフォームからご連絡ください。';
      }
    }
    pendingAuthNotice = { text, type };
    await signOut(auth);
  } catch (e) {
    showAuthMsg(translateError(e), 'err');
  }
}
async function handleLogin() {
  const rawInput = document.getElementById('a-email').value.trim();
  lastAuthEmail = rawInput;
  const email = toLoginEmail(rawInput);
  const password = document.getElementById('a-pass').value;
  if (!email || !password) { showAuthMsg('メールアドレスとパスワードを入力してください', 'err'); return; }
  try {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    await reload(cred.user);
    if (!cred.user.emailVerified && !isIdEmail(cred.user.email)) {
      // 確認メールを自動で送り直す（短時間に何度も送ると Firebase 側で止められるので、そのときは待ってもらう）
      let resendMsg;
      try {
        await sendEmailVerification(cred.user);
        resendMsg = `まだメール確認が済んでいません。${email} に確認メールをもう一度送りました。迷惑メールフォルダもご確認のうえ、メールアプリから直接リンクを開いてから、もう一度ログインしてください。`;
      } catch (re) {
        const rc = (re && re.code) || '';
        resendMsg = rc.includes('too-many-requests')
          ? 'まだメール確認が済んでいません。確認メールは少し前に送っています。届いたメールのリンクを開いてから、もう一度ログインしてください（届かない場合は10分ほど待ってから、もう一度ログインすると送り直します）。'
          : 'まだメール確認が済んでいません。届いたメールのリンクを開いてから、もう一度ログインしてください。';
      }
      pendingAuthNotice = { text: resendMsg, type: 'err' };
      showAuthMsg(resendMsg, 'err');
      await signOut(auth);
      return;
    }
  } catch (e) { showAuthMsg(translateError(e), 'err'); }
}
function translateError(e) {
  const code = e.code || '';
  if (code.includes('email-already-in-use')) return 'このメールアドレスはすでに登録されています。ログインタブからお試しください。';
  if (code.includes('invalid-email')) return 'メールアドレスの形式が正しくありません。';
  if (code.includes('weak-password')) return 'パスワードは6文字以上にしてください。';
  if (code.includes('user-not-found') || code.includes('wrong-password') || code.includes('invalid-credential')) return 'メールアドレス（またはID）かパスワードが正しくありません。';
  if (code.includes('too-many-requests')) return 'ログインに何度か失敗したため、しばらく操作できません。10分ほど待ってからお試しいただくか、「パスワードをお忘れですか？」から再設定してください。';
  if (code.includes('network-request-failed')) return '通信できませんでした。電波の良い場所でもう一度お試しください。フィルター（あんしんフィルター等）が有効な端末では、つながらない場合があります。';
  return 'エラーが発生しました：' + code;
}

onAuthStateChanged(auth, async (user) => {
  if (signupInProgress) return; // ID登録の途中（プロフィール保存前）は何もしない
  if (user && (user.emailVerified || isIdEmail(user.email))) {
    try {
      let profSnap;
      try {
        profSnap = await getDoc(doc(db, 'users', user.uid));
      } catch (e) {
        console.error('profile fetch failed', e);
        renderCheckFailedScreen({ displayName: '' }, () => location.reload());
        return;
      }
      if (!profSnap.exists()) {
        app.innerHTML = `<div class="err-screen">プロフィールが見つかりませんでした。サポートにご連絡ください。</div>`;
        return;
      }
      const profile = profSnap.data();
      if (profile.freeAccess === true) {
        boot(user, profile);
        return;
      }
      if (profile.role === 'coach') {
        // チーム単位の契約：自分個人の契約でなく、同じチームのコーチの誰か1人でも
        // 有効な契約(またはfreeAccess)を持っていればチーム全体を有効とみなす
        const coachQ = query(collection(db, 'users'), where('teamCode', '==', profile.teamCode), where('role', '==', 'coach'));
        const coachSnaps = await getDocs(coachQ);
        let teamActive = false;
        let checkFailed = false;
        for (const d of coachSnaps.docs) {
          if (d.data().freeAccess === true) { teamActive = true; break; }
          const result = await checkActiveSubscription(d.id);
          if (result === true) { teamActive = true; break; }
          if (result === null) checkFailed = true;
        }
        if (teamActive) {
          boot(user, profile);
        } else if (checkFailed) {
          // 誰か1人でも「確認できなかった」だけで、確実に未契約と判明した人はいない
          renderCheckFailedScreen(profile, () => location.reload());
        } else {
          renderPaywall(user, profile);
        }
      } else {
        await routeStudent(user, profile);
      }
    } catch (e) {
      app.innerHTML = `<div class="err-screen">読み込みに失敗しました：${e.message}</div>`;
    }
  } else {
    renderAuth();
  }
});

async function routeStudent(user, profile) {
  // チームから外れた（コーチに削除された）選手は、担当コーチ検索より前にここで検知する
  if (!profile.teamCode) {
    if (profile.freeAccess === true) { boot(user, profile); return; }
    const result = await checkActiveSubscription(user.uid);
    if (result === true) {
      boot(user, profile);
    } else if (result === null) {
      renderCheckFailedScreen(profile, () => routeStudent(user, profile));
    } else {
      renderRemovedStudentScreen(user, profile, profile.accountType === 'individual' ? 'individual' : 'removed');
    }
    return;
  }
  // 生徒本人は課金せず、担当コーチの契約状況で判定する
  // （同じチームのコーチの誰か1人でも有効な契約/freeAccessがあればOK）
  const coachQ = query(collection(db, 'users'), where('teamCode', '==', profile.teamCode), where('role', '==', 'coach'));
  const coachSnaps = await getDocs(coachQ);
  if (coachSnaps.empty) {
    app.innerHTML = `<div class="err-screen">担当コーチが見つかりませんでした。招待コードをコーチに確認してください。</div>`;
    return;
  }
  let coachActive = false;
  let checkFailed = false;
  for (const d of coachSnaps.docs) {
    if (d.data().freeAccess === true) { coachActive = true; break; }
    const result = await checkActiveSubscription(d.id);
    if (result === true) { coachActive = true; break; }
    if (result === null) checkFailed = true;
  }
  if (coachActive) {
    boot(user, profile);
  } else if (checkFailed) {
    renderCheckFailedScreen(profile, () => routeStudent(user, profile));
  } else {
    // コーチの契約が止まっている（または未加入）チームの選手も、自分の過去の記録は閲覧できるようにする
    renderRemovedStudentScreen(user, profile, 'coachInactive');
  }
}

// 招待コードを入力して新しいチームに参加する（ログイン中の既存アカウント向け）。
// 成功すると自分の teamCode を書き換える。呼び出し側で再判定（routeStudent等）すること。
async function joinTeamByCode(uid, rawCode) {
  const code = (rawCode || '').trim().toUpperCase();
  if (!code) return { ok: false, message: '招待コードを入力してください' };
  const coachQ = query(collection(db, 'users'), where('teamCode', '==', code), where('role', '==', 'coach'));
  const coachSnaps = await getDocs(coachQ);
  if (coachSnaps.empty) return { ok: false, message: 'その招待コードに一致するチームが見つかりませんでした。コードを確認してください。' };
  try {
    await setDoc(doc(db, 'users', uid), { teamCode: code }, { merge: true });
    return { ok: true };
  } catch (e) {
    return { ok: false, message: '参加に失敗しました：' + e.message };
  }
}

async function checkActiveSubscription(uid) {
  try {
    const q = query(
      collection(db, 'customers', uid, 'subscriptions'),
      where('status', 'in', ['trialing', 'active'])
    );
    const snaps = await getDocs(q);
    return !snaps.empty;
  } catch (e) {
    console.error('subscription check failed', e);
    // 通信エラーやFirestore側の一時的な問題で「確認できなかった」場合はnullを返す。
    // ここでfalseにしてしまうと「未契約」と誤判定され、正規の課金者が
    // 有料画面に弾かれてしまうため、呼び出し側で必ず区別して扱うこと。
    return null;
  }
}

          price: INDIVIDUAL_PLAN_PRICE_ID,
          success_url: SITE_URL,
          cancel_url: SITE_URL
        });
        let settled = false;
        let timeoutId;
        const unsub = onSnapshot(sessionRef, (snap) => {
          if (settled) return;
          const data = snap.data();
          if (!data) return;
          if (data.error) {
            settled = true;
            clearTimeout(timeoutId);
            if (msg) msg.innerHTML = `<div class="pay-msg err">エラーが発生しました：${data.error.message}</div>`;
            reactivateBtn.disabled = false;
            reactivateBtn.textContent = REACTIVATE_LABEL;
            unsub();
          }
          if (data.url) {
            settled = true;
            clearTimeout(timeoutId);
            unsub();
            window.location.assign(data.url);
          }
        });
        timeoutId = setTimeout(() => {
          if (settled) return;
          settled = true;
          unsub();

      try {

        if (result === true) {
          boot(user, profile);
          return;

      joinBtn.textContent = '確認中…';
      const result = await joinTeamByCode(user.uid, input ? input.value : '');
      if (result.ok) {
        profile.teamCode = (input.value || '').trim().toUpperCase();

        joinBtn.disabled = false;
        joinBtn.textContent = '参加する';
        if (msg) msg.innerHTML = `<div class="pay-msg err">${escapeHtml(result.message)}</div>`;
      }
    };
  }

  async function renderCal() {
    const cal = document.getElementById('removed-cal');
    if (!cal) return;
    const y = rState.year, m = rState.month;
    const first = new Date(y, m, 1);
    const startDow = first.getDay();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const prevDays = new Date(y, m, 0).getDate();
    const dows = ['日', '月', '火', '水', '木', '金', '土'];
    let cells = '';
    for (let i = 0; i < startDow; i++) cells += `<div class="cal-cell out">${prevDays - startDow + i + 1}</div>`;
    const t = todayParts();
    for (let d = 1; d <= daysInMonth; d++) {
      const key = dateKey(y, m, d);
      const isToday = t.y === y && t.m === m && t.d === d;
      const isSel = key === rState.selected;
      cells += `<div class="cal-cell ${isToday ? 'today' : ''} ${isSel ? 'selected' : ''}" data-date="${key}">
        <span>${d}</span><span class="dot" style="visibility:hidden" data-dot="${key}"></span>
      </div>`;
    }
    const totalCells = startDow + daysInMonth;
    const trailing = (7 - (totalCells % 7)) % 7;
    for (let i = 1; i <= trailing; i++) cells += `<div class="cal-cell out">${i}</div>`;
    cal.innerHTML = `
      <div class="cal-head">
        <div class="cal-nav"><button id="removed-prevM">‹</button></div>
        <div class="cal-title">${y}年 ${m + 1}月</div>
        <div class="cal-nav"><button id="removed-nextM">›</button></div>
      </div>
      <div class="cal-grid">${dows.map(d => `<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
    `;
    document.getElementById('removed-prevM').onclick = () => { rState.month--; if (rState.month < 0) { rState.month = 11; rState.year--; } renderCal(); };
    document.getElementById('removed-nextM').onclick = () => { rState.month++; if (rState.month > 11) { rState.month = 0; rState.year++; } renderCal(); };
    cal.querySelectorAll('.cal-cell[data-date]').forEach(c => {
      c.onclick = () => { rState.selected = c.dataset.date; renderCal(); renderDetail(); };
    });
    try {
      // 今日のカレンダー修正と同じ理由：一覧クエリ(kvList)はFirestoreのルール上
      // 安全性の事前証明が不安定なため使わず、1日ずつ個別取得(kvGet)する。
      // 未来の日付は記録が存在し得ないので問い合わせから除外する。
      const maxDay = (t.y === y && t.m === m) ? t.d : (t.y > y || (t.y === y && t.m > m)) ? daysInMonth : 0;
      const days = Array.from({ length: maxDay }, (_, i) => i + 1);
      await Promise.all(days.map(async (d) => {
        const dateStr = dateKey(y, m, d);
        try {
          const r = await kvGet(`entry:${user.uid}:${dateStr}`);
          if (!r || !r.value) return;
          let parsed = null;
          try { parsed = JSON.parse(r.value); } catch (e) { return; }
          if (!hasEntryContent(parsed)) return;
          const dotEl = cal.querySelector(`[data-dot="${dateStr}"]`);
          if (dotEl) dotEl.style.visibility = 'visible';
        } catch (e) { /* この日だけ取得失敗、他の日には影響させない */ }
      }));
    } catch (e) { console.error('[removed-calendar] renderCal failed:', e); }
  }

  async function renderDetail() {
    const box = document.getElementById('removed-detail');
    if (!box) return;
    box.innerHTML = `<div class="empty-hint">読み込み中…</div>`;
    let data = null;
    try {
      const res = await kvGet(`entry:${user.uid}:${rState.selected}`);
      if (res && res.value) data = JSON.parse(res.value);
    } catch (e) {}
    if (!data) {
      box.innerHTML = `<div class="removed-date-label">${formatSelectedLabel(rState.selected)}</div><div class="card"><div class="empty-hint">この日の記録はありません</div></div>`;
      return;
    }
    try {
      const w = WEATHER_OPTS.find(o => o.v === data.weather);
      const c1 = CONDITION_OPTS.find(o => o.v === data.condition);
      const c2 = CONDITION_OPTS.find(o => o.v === data.mind);
      const c3 = CONDITION_OPTS.find(o => o.v === data.skill);
      const c4 = CONDITION_OPTS.find(o => o.v === data.body);
      box.innerHTML = `
        <div class="removed-date-label">${formatSelectedLabel(rState.selected)}${data.important ? ' ★試合' : ''}${data.matchName ? ` ${escapeHtml(data.matchName)}` : ''}</div>
        <div class="card">
          <div class="removed-cond-row">
            ${w ? `<span>${w.icon} ${w.label}</span>` : ''}
            ${c1 ? `<span>${c1.icon} 総合:${c1.label}</span>` : ''}
            ${c2 ? `<span>${c2.icon} 心:${c2.label}</span>` : ''}
            ${c3 ? `<span>${c3.icon} 技:${c3.label}</span>` : ''}
            ${c4 ? `<span>${c4.icon} 体:${c4.label}</span>` : ''}
          </div>
        </div>
        ${data.menu ? `<div class="card"><div class="card-label">メニュー<span class="tri-sub">（練習内容や大会で意識したこと）</span></div><div class="removed-readonly-text">${escapeHtml(data.menu)}</div></div>` : ''}
        ${data.good ? `<div class="card good"><div class="card-label">◎ よかった点</div><div class="removed-readonly-text">${escapeHtml(data.good)}</div>${data.goodComment ? `<div class="removed-coach-comment">💬 ${escapeHtml(data.goodComment)}</div>` : ''}</div>` : ''}
        ${data.issue ? `<div class="card issue"><div class="card-label">△ 改善点</div><div class="removed-readonly-text">${escapeHtml(data.issue)}</div>${data.issueComment ? `<div class="removed-coach-comment">💬 ${escapeHtml(data.issueComment)}</div>` : ''}</div>` : ''}
        ${data.gameGood ? `<div class="card good"><div class="card-label">◎ 試合でよかった点</div><div class="removed-readonly-text">${escapeHtml(data.gameGood)}</div>${data.gameGoodComment ? `<div class="removed-coach-comment">💬 ${escapeHtml(data.gameGoodComment)}</div>` : ''}</div>` : ''}
        ${data.gameIssue ? `<div class="card issue"><div class="card-label">△ 試合の改善点</div><div class="removed-readonly-text">${escapeHtml(data.gameIssue)}</div>${data.gameIssueComment ? `<div class="removed-coach-comment">💬 ${escapeHtml(data.gameIssueComment)}</div>` : ''}</div>` : ''}
        ${data.thread && data.thread.length ? `<div class="card"><div class="card-label">メッセージ</div>${data.thread.map(m => `<div class="removed-readonly-text"><strong>${escapeHtml(m.authorName || (m.author === 'coach' ? 'コーチ' : '本人'))}：</strong>${escapeHtml(m.text)}</div>`).join('')}</div>` : ''}
      `;
    } catch (e) {
      box.innerHTML = `<div class="removed-date-label">${formatSelectedLabel(rState.selected)}</div><div class="card"><div class="empty-hint">表示に失敗しました</div></div>`;
    }
  }

  await renderCal();
  await renderDetail();
}

      for (const d of coachSnaps.docs) {
        if (d.data().freeAccess === true) { teamActive = true; break; }
        const result = await checkActiveSubscription(d.id);
        if (result === true) { teamActive = true; break; }
        if (result === null) checkFailed = true;
      }
      if (teamActive) { boot(user, profile); return; }
      msg.innerHTML = checkFailed
        ? `<div class="pay-msg err">通信環境の問題で確認できませんでした。電波の良い場所でもう一度お試しください。</div>`
        : `<div class="pay-msg err">まだ有効なプランが確認できません。反映まで少し時間がかかることがあります。</div>`;
    } catch (e) {
      msg.innerHTML = `<div class="pay-msg err">確認できませんでした。もう一度お試しください。</div>`;
    }
    btn.disabled = false;
    btn.textContent = RECHECK_LABEL;
  };
}

async function startCheckout(uid, priceId) {
  const btn = document.getElementById('pay-btn');
  const msg = document.getElementById('pay-msg');
  if (!isPriceReady(priceId)) {
    if (msg) msg.innerHTML = `<div class="pay-msg err">このプランは現在準備中です。しばらくしてからお試しください。</div>`;
    return;
  }
  btn.disabled = true;
  btn.textContent = '処理中…';
  try {
    const sessionRef = await addDoc(collection(db, 'customers', uid, 'checkout_sessions'), {
      price: priceId,
      success_url: SITE_URL,
      cancel_url: SITE_URL
    });
    let settled = false;
    let timeoutId;
    const unsub = onSnapshot(sessionRef, (snap) => {
      if (settled) return;
      const data = snap.data();
      if (!data) return;
      if (data.error) {
        settled = true;
        clearTimeout(timeoutId);
        msg.innerHTML = `<div class="pay-msg err">エラーが発生しました：${data.error.message}</div>`;
        btn.disabled = false;
        btn.textContent = '加入手続きに進む';
        unsub();
      }
      if (data.url) {
        settled = true;
        clearTimeout(timeoutId);
        unsub();
        window.location.assign(data.url);
      }
    });
    // 15秒たっても応答（エラーorリダイレクトURL）が来なければ、
    // ボタンが「処理中…」のまま固まって見えないようにタイムアウトさせる
    timeoutId = setTimeout(() => {
      if (settled) return;
      settled = true;
      unsub();
      msg.innerHTML = `<div class="pay-msg err">時間がかかりすぎています。通信環境を確認して、もう一度お試しください。</div>`;
      btn.disabled = false;
      btn.textContent = '加入手続きに進む';
    }, 15000);
  } catch (e) {
    msg.innerHTML = `<div class="pay-msg err">エラーが発生しました：${e.message}</div>`;
    btn.disabled = false;
    btn.textContent = '加入手続きに進む';
  }
}

async function openPortal() {

// 今日の日付（月-日）の名言。見つからなければ年内の通し日数で選ぶ
function todaysQuote() {
  if (!DAILY_QUOTES.length) return null;
  const now = new Date();
  const md = `${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  const hit = DAILY_QUOTES.find(q => q.date === md);
  if (hit) return hit;
  const start = new Date(now.getFullYear(), 0, 0);
  const dayOfYear = Math.floor((now - start) / 86400000);
  return DAILY_QUOTES[(dayOfYear - 1) % DAILY_QUOTES.length];
}
// 名言の文を「意味のまとまり」ごとに表示する。
// c = [[文節, 文節, ...（読点・句点まで）], ...] の形。まとまりの途中では改行しない
function phraseHtml(clauses) {
